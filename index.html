function EmailInboxFlow({ conn, tmpl, editing, editInstance, existingSources=[], existingConnectors=[], onOpenSource, onCancel, onBackToConnectors, onCreate, onSave }){
  const { useState } = React;

  if (editing){
    return <EmailConnectionDetail conn={conn} tmpl={tmpl} editInstance={editInstance} existingSources={existingSources} onOpenSource={onOpenSource} onCancel={onCancel} />;
  }

  const [phase, setPhase] = useState(1);
  const [name, setName] = useState("");
  const [local, setLocal] = useState("");
  const [localTouched, setLocalTouched] = useState(false);
  const [localError, setLocalError] = useState("");
  const [seed, setSeed] = useState(null);
  const [configuring, setConfiguring] = useState(null); // null | "parent" | "child"

  const effectiveLocal = localTouched ? local : emailLocalPartDefault(name);

  const goStep2 = () => {
    const address = emailAddressFor(effectiveLocal);
    if (!emailLocalPartValid(effectiveLocal)){ setLocalError("Use lowercase letters, numbers, dots, underscores, or hyphens only."); return; }
    if (existingConnectors.some(c => c.address && c.address.toLowerCase() === address.toLowerCase())){
      setLocalError("This address is already used by another connection in this tenant."); return;
    }
    setLocalError("");
    setSeed({ ...emailInboxSources(name, address), address });
    setPhase(2);
  };

  const finish = () => {
    const instId = "conn_" + Math.random().toString(36).slice(2,10);
    const day = todayStr();
    const lastMsg = EMAIL_SEED[EMAIL_SEED.length - 1];
    const instance = {
      id:instId, name,
      connectorId:conn.id, connectorName:conn.name, group:conn.group,
      address: seed.address, frequency:"On Email Receipt", noSchedule:false,
      status:"Ready", lastChecked:"Just now", lastRun: lastMsg.received_at,
      createdAt:day, updatedAt:day,
      dataSourceIds:[seed.parent.id, seed.child.id],
      lastReceived: lastMsg.received_at, messageCount: EMAIL_SEED.length,
    };
    onCreate(instance, [seed.parent, seed.child]);
  };

  if (phase === 1){
    return <EmailNameStep conn={conn} tmpl={tmpl} name={name} setName={setName} local={effectiveLocal}
      setLocal={(v)=>{ setLocal(v); setLocalTouched(true); setLocalError(""); }} error={localError}
      onCancel={onCancel} onBack={onBackToConnectors} onContinue={goStep2} />;
  }

  if (configuring){
    const draft = configuring === "parent" ? seed.parent : seed.child;
    const otherName = configuring === "parent" ? seed.child.name : seed.parent.name;
    return <EmailConfigureTableStep tableKey={configuring} draft={draft} otherName={otherName} existingSources={existingSources}
      onCancel={()=>setConfiguring(null)}
      onSave={(patch)=>{
        setSeed(s => ({ ...s, [configuring]: { ...s[configuring], ...patch } }));
        setConfiguring(null);
      }} />;
  }

  if (phase === 2){
    const conflict = existingSources.some(s => s.name === seed.parent.name) || existingSources.some(s => s.name === seed.child.name) || seed.parent.name === seed.child.name;
    return <EmailDataSourcesStep conn={conn} tmpl={tmpl} parentDraft={seed.parent} childDraft={seed.child} conflict={conflict}
      onConfigure={setConfiguring} onCancel={onCancel} onBack={()=>setPhase(1)} onContinue={()=>setPhase(3)} />;
  }

  return <EmailScheduleStep conn={conn} tmpl={tmpl} onCancel={onCancel} onBack={()=>setPhase(2)} onCreate={finish} />;
}

// Upsert-aware re-scrape: existing rows update in place, a work order missing from the fresh scrape
// is marked not_seen_in_last_scrape (never deleted), and a previously-missing one can reappear.
function simulateScriptRun(parentSrc, childSrc){
  const now = new Date().toISOString().slice(0,16).replace("T"," ");
  const parentRows = (parentSrc.parsed.rows || []).map(r => ({ ...r }));
  const seenNow = parentRows.filter(r => r.scrape_status !== "not_seen_in_last_scrape");
  if (seenNow.length > 1 && Math.random() < 0.5){
    const drop = seenNow[Math.floor(Math.random()*seenNow.length)];
    drop.scrape_status = "not_seen_in_last_scrape";
  } else {
    const missing = parentRows.filter(r => r.scrape_status === "not_seen_in_last_scrape");
    if (missing.length && Math.random() < 0.4){
      const back = missing[Math.floor(Math.random()*missing.length)];
      back.scrape_status = "seen"; back.last_scraped_at = now;
    }
  }
  parentRows.forEach(r => { if (r.scrape_status !== "not_seen_in_last_scrape") r.last_scraped_at = now; });
  let childRows = (childSrc.parsed.rows || []).map(r => ({ ...r }));
  if (Math.random() < 0.3){
    const n = parentRows.length + 1;
    const id = "WO-" + (70100 + n);
    parentRows.push({ work_order_id:id, status:"Open", asset_id:"Unit " + (100+n), vendor:"FlexDrive Holmant",
      opened_at: now.slice(0,10), description:"Newly opened work order", total_amount: Math.round((150 + Math.random()*400)*100)/100,
      last_scraped_at: now, scrape_status:"seen", raw_html_ref:"scrapes/" + id + "_" + now.replace(/[: ]/g,"-") + ".html" });
    childRows.push({ line_item_id:id + "_li1", work_order_id:id, type:"labor", parts_id:"", labor_id:"LBR-05",
      description:"Diagnostic labor", quantity:1, unit_cost:95, line_total:95 });
  }
  return {
    parent: { ...parentSrc, parsed:{ ...parentSrc.parsed, rows:parentRows }, recordCount:parentRows.length, records:parentRows.length.toLocaleString("en-US"), lastSynced:"Just now" },
    child: { ...childSrc, parsed:{ ...childSrc.parsed, rows:childRows }, recordCount:childRows.length, records:childRows.length.toLocaleString("en-US"), lastSynced:"Just now" },
  };
}

function ScriptDeclareStep({ conn, tmpl, parentDraft, setParentDraft, childDraft, setChildDraft, testResult, onCancel, onBack, onContinue }){
  const { useState } = React;
  const [configuringKey, setConfiguringKey] = useState(null);
  const scraped = testResult || scriptTestScrape();
  const draftFor = (key) => {
    const base = key === "parent" ? parentDraft : childDraft;
    const rows = key === "parent" ? scraped.parentRows : scraped.childRows;
    return { ...base, parsed: { columns: base.columns.map(c=>c.name), rows, previewRows: rows, typeByCol: Object.fromEntries(base.columns.map(c=>[c.name,c.type])) } };
  };
  const handleSave = (key, patch) => {
    const next = { name:patch.name, singular:patch.singular, plural:patch.plural, description:patch.description, type:patch.type, published:patch.published, columns:patch.columns };
    if (key === "parent") setParentDraft(next); else setChildDraft(next);
    setConfiguringKey(null);
  };
  const canCreate = parentDraft.name.trim() && childDraft.name.trim() && parentDraft.columns.some(c=>c.pk);

  if (configuringKey){
    return <ConfigureSource source={draftFor(configuringKey)}
      title="Configure Data Table"
      sub={"Set this source's identity, type, fields, and keys. The script populates it; it can't change this shape once created."}
      submitLabel="Save configuration"
      allowAddColumns={true}
      originalNameLabel={conn.name} showRelationsTab={false}
      onCancel={()=>setConfiguringKey(null)}
      onSave={(patch)=>handleSave(configuringKey, patch)} />;

  return (
    <div className="vds-content">
      <PageHead title={"Connect " + conn.name} sub={tmpl.tagline} onCancel={onCancel} />
      <Stepper current={5} steps={SCRIPT_STEPS} />

      <div className="vds-table-container has-actions">
        <div className="dscreate-row" style={{gridTemplateColumns:"44px 1.3fr 92px 1fr 140px"}}>
          <span className="dscreate-ico"><Icon name="grid" size={19} /></span>

            <span className="dscreate-kind">Parent · one row per work order</span>
          </span>
          <span className="vds-chip vds-chip--sm">{parentDraft.type}</span>
          <span className="dscreate-num">{parentDraft.columns.length} columns</span>
          <span><button className="vds-btn vds-btn--sm proto-cfg-btn done" onClick={()=>setConfiguringKey("parent")}><Icon name="check" size={14} />Configure</button></span>

        <div className="dscreate-row" style={{gridTemplateColumns:"44px 1.3fr 92px 1fr 140px"}}>

          <span className="dscreate-meta">

            <span className="dscreate-kind">Child · one row per line item</span>
          </span>
          <span className="vds-chip vds-chip--sm">{childDraft.type}</span>

          <span><button className="vds-btn vds-btn--sm proto-cfg-btn done" onClick={()=>setConfiguringKey("child")}><Icon name="check" size={14} />Configure</button></span>
        </div>
      </div>

      <div className="vds-alert vds-alert--info proto-note" style={{marginTop:20}}>If a run ever returns a column that isn't declared here, that run is rejected — not auto-merged. Both data tables land unpublished; publish them from the Data Tables page once you've checked the first scrape.</div>

      <div className="wiz-footer">

        <button className="vds-btn vds-btn--primary" disabled={!canCreate} onClick={onContinue}><Icon name="check" size={17} />Create connector</button>

function ScriptConnectorFlow({ conn, tmpl, editing, editInstance, existingSources=[], onOpenSource, onCancel, onBackToConnectors, onCreate, onSave }){
  const { useState } = React;
  const [phase, setPhase] = useState(1);
  const [name, setName] = useState(conn.name);
  const [targets, setTargets] = useState([]);
  const [creds, setCreds] = useState({});
  const [script, setScript] = useState(() => scriptStarterTemplate(conn.name, ""));
  const [testResult, setTestResult] = useState(null);
  const [intervalHours, setIntervalHours] = useState(6);
  const [parentDraft, setParentDraft] = useState(() => {
    const dn = displayNamesFromName("raw__scraped_workorder");
    return { name:"raw__scraped_workorder", singular:dn.singular, plural:dn.plural,
      description:"Scraped work orders. One row per work order; the latest scrape wins per upsert key.",
      type:"Table", published:false, columns:scriptDefaultParentCols() };
  });
  const [childDraft, setChildDraft] = useState(() => {
    const dn = displayNamesFromName("raw__scraped_workorder_lineitem");
    return { name:"raw__scraped_workorder_lineitem", singular:dn.singular, plural:dn.plural,
      description:"Line items for scraped work orders, keyed to the parent by work_order_id.",
      type:"Table", published:false, columns:scriptDefaultChildCols() };
  });

  if (editing){
    return <ScriptConnectorDetail conn={conn} tmpl={tmpl} editInstance={editInstance} existingSources={existingSources}
      onOpenSource={onOpenSource} onCancel={onCancel} onSave={onSave} />;
  }

  const runTest = () => setTestResult(scriptTestScrape());

  const finish = () => {
    const instId = "conn_" + Math.random().toString(36).slice(2,10);
    const day = todayStr();
    const scraped = testResult || scriptTestScrape();
    const buildRows = (cols, rows) => rows.map(r => { const out = {}; cols.forEach(c => { out[c.name] = r[c.name]; }); return out; });
    const parentRows = buildRows(parentDraft.columns, scraped.parentRows);
    const childRows = buildRows(childDraft.columns, scraped.childRows);
    const typeByCol = (cols) => Object.fromEntries(cols.map(c => [c.name, c.type]));
    const parentId = "ds_" + Math.random().toString(36).slice(2,10);
    const childId = "ds_" + Math.random().toString(36).slice(2,10);
    const parent = {
      id:parentId, origin:name || conn.name, ...parentDraft,
      status:"Ready", records:parentRows.length.toLocaleString("en-US"), recordCount:parentRows.length, lastSynced:"Just now",
      fromConnector:true,
      parsed:{ fileName:name || conn.name, columns:parentDraft.columns.map(c=>c.name), rows:parentRows, previewRows:parentRows, typeByCol:typeByCol(parentDraft.columns) },
      relations:{ outgoing:[{ key:"lineitems", schema:childDraft.name, type:"One to many", pairs:[{ local:"work_order_id", related:"work_order_id" }], created:"Just now" }], incoming:[] },
    };
    const child = {
      id:childId, origin:name || conn.name, ...childDraft,
      status:"Ready", records:childRows.length.toLocaleString("en-US"), recordCount:childRows.length, lastSynced:"Just now",
      fromConnector:true,
      parsed:{ fileName:name || conn.name, columns:childDraft.columns.map(c=>c.name), rows:childRows, previewRows:childRows, typeByCol:typeByCol(childDraft.columns) },
      relations:{ outgoing:[{ key:"workorder", schema:parentDraft.name, type:"Many to one", pairs:[{ local:"work_order_id", related:"work_order_id" }], created:"Just now" }], incoming:[] },
    };
    const instance = {
      id:instId, name: name || conn.name,
      connectorId:conn.id, connectorName:conn.name, group:conn.group,
      targets, creds, script, frequency:"Custom", intervalHours,
      status:"Ready", lastChecked:"Just now", lastRun:day, lastRunStatus:"ok", lastRunError:null,
      createdAt:day, updatedAt:day,
      dataSourceIds:[parent.id, child.id],
    };
    onCreate(instance, [parent, child]);
  };

  if (phase === 1){
    return <ScriptNameTargetStep conn={conn} tmpl={tmpl} editing={editing} name={name} setName={setName} targets={targets} setTargets={setTargets}
      onCancel={onCancel} onBack={onBackToConnectors} onContinue={()=>setPhase(2)} />;
  }
  if (phase === 2){
    return <ScriptCredentialsStep conn={conn} tmpl={tmpl} creds={creds} setCreds={setCreds}
      onCancel={onCancel} onBack={()=>setPhase(1)} onContinue={()=>{
        if (script === scriptStarterTemplate(conn.name, "")) setScript(scriptStarterTemplate(name || conn.name, targets[0] || ""));
        setPhase(3);
      }} />;
  }
  if (phase === 3){
    return <ScriptEditorStep conn={conn} tmpl={tmpl} script={script} setScript={setScript} testResult={testResult} onTest={runTest}
      onCancel={onCancel} onBack={()=>setPhase(2)} onContinue={()=>setPhase(4)} />;
  }
  if (phase === 4){
    return <ScriptScheduleStep conn={conn} tmpl={tmpl} intervalHours={intervalHours} setIntervalHours={setIntervalHours}
      onCancel={onCancel} onBack={()=>setPhase(3)} onContinue={()=>setPhase(5)} />;
  }
  return <ScriptDeclareStep conn={conn} tmpl={tmpl}
    parentDraft={parentDraft} setParentDraft={setParentDraft} childDraft={childDraft} setChildDraft={setChildDraft} testResult={testResult}
    onCancel={onCancel} onBack={()=>setPhase(4)} onContinue={finish} />;
}


function NewConnector({ onCancel, onCreate, editInstance, existingSources=[], existingConnectors=[], onSave, onOpenSource, initialStep, presetConnectorId, presetTargetSourceId }){
  const editing = !!editInstance;
  const editConn = editing ? CONNECTORS.find(c => c.id === editInstance.connectorId) : null;
  const editTmpl = editConn ? CONNECTOR_TEMPLATES[editConn.id] : null;
  const editExisting = editing ? (editInstance.dataSourceIds || []).map(id => existingSources.find(s => s.id === id)).filter(Boolean) : [];
  const existingByName = {}; editExisting.forEach(ds => { existingByName[ds.templateSourceKey || ds.name] = ds; }); // matches by the stable template source key set at creation time, not a recomputed name — survives renames
  const openExisting = (templateName) => { const ds = existingByName[templateName]; if (ds && onOpenSource) onOpenSource(ds.id); };
  const singlePageScheduleKinds = new Set(["s3","inbox","script"]);
  const effectiveInitialStep = (editTmpl && singlePageScheduleKinds.has(editTmpl.kind)) ? null : initialStep;

  const [step, setStep] = useState(editing ? (effectiveInitialStep || 2) : (presetConnectorId ? 2 : 1));
  const [group, setGroup] = useState("All");
  const [prioFilter, setPrioFilter] = useState([]);
  const [selected, setSelected] = useState(editing ? editInstance.connectorId : (presetConnectorId || null));
  const [name, setName] = useState(editing ? editInstance.name : (presetConnectorId ? ((CONNECTORS.find(c => c.id === presetConnectorId) || {}).name || "") : ""));
  const [creds, setCreds] = useState(editing ? (editInstance.creds || (editInstance.apiKey ? { apiKey: editInstance.apiKey } : {}))
    : (presetConnectorId ? (() => { const t = CONNECTOR_TEMPLATES[presetConnectorId]; return (t && t.kind === "s3" && t.connForm) ? pullFormDefaults(t.connForm) : {}; })() : {}));
  const [verified, setVerified] = useState(editing);
  const [picks, setPicks] = useState(editing && editTmpl && editTmpl.sources ? Object.fromEntries(editTmpl.sources.map(s => [s.name, !!existingByName[s.name]])) : {});
  const [startDates, setStartDates] = useState(editing && editTmpl && editTmpl.sources ? Object.fromEntries(editTmpl.sources.map(s => [s.name, (editInstance.startDates && editInstance.startDates[s.name]) || s.firstDate])) : {});
  const [sched, setSched] = useState(() => (editing && editInstance.automationTrigger) || newWizardTrigger());
  const [sftpTemplateId, setSftpTemplateId] = useState(editing ? (editInstance.templateSourceId || null) : null);
  const editManaged = editing ? existingSources.find(s => s.id === editInstance.dataSourceId) : null;
  const [managedName, setManagedName] = useState(editing ? (editManaged ? editManaged.name : (editInstance.managedName || "")) : "");
  const [managedNameEdited, setManagedNameEdited] = useState(editing);
  const editManagedName = (v) => { setManagedName(v); setManagedNameEdited(true); };
  const editTmplForCreds = editing && editInstance ? CONNECTOR_TEMPLATES[editInstance.connectorId] : null;
  const [pushCreds, setPushCreds] = useState(() => editing ? (editInstance.push || editInstance.sftp || (editTmplForCreds && editTmplForCreds.makeCreds ? editTmplForCreds.makeCreds() : {})) : {});
  const conn = CONNECTORS.find(c => c.id === selected);
  const tmpl = conn ? CONNECTOR_TEMPLATES[conn.id] : null;
  const isWarehouse = !!(conn && conn.group === "Data Warehouse");
  const isPush = !!(tmpl && tmpl.kind === "push");
  const isPull = !!(tmpl && tmpl.kind === "pull");
  const isS3 = !!(tmpl && tmpl.kind === "s3");
  const isStream = !!(tmpl && tmpl.kind === "stream");
  const isInbox = !!(tmpl && tmpl.kind === "inbox");
  const isScript = !!(tmpl && tmpl.kind === "script");
  const isApiConnector = !!(conn && ["samsara","geotab","fleetio"].includes(conn.id));
  const isSnowflakeConn = !!(conn && conn.id === "snowflake");
  const isTemplateKind = isPush || isPull;
  const fileSources = existingSources.filter(s => s.origin === "Data Files");
  const list = CONNECTORS
    .filter(c => (group === "All" || c.group === group) && (prioFilter.length === 0 || prioFilter.includes(c.priority)))
    .slice()
    .sort((a, b) => PRIORITIES.indexOf(a.priority) - PRIORITIES.indexOf(b.priority));
  const existingNames = editing && tmpl && tmpl.sources ? tmpl.sources.filter(s => existingByName[s.name]).map(s => s.name) : [];
  const requiresConfig = !!(tmpl && tmpl.requiresConfig);
  const [configs, setConfigs] = useState({});   // template source name -> config patch (in-wizard)
  const [configuring, setConfiguring] = useState(null); // template source name being configured

  // Push/pull connectors: prefill the managed data name from the chosen template until edited.
  React.useEffect(() => {
    if (isTemplateKind && sftpTemplateId && !managedNameEdited){
      const t = existingSources.find(s => s.id === sftpTemplateId);
      if (t) setManagedName(connSlug(t.name) + "_" + conn.id);
    }
  }, [sftpTemplateId, isTemplateKind]);

  const buildRecord = (s, instId) => {
    let rec = { ...connectorDataSourceRecord(name || conn.name, s, { connId: conn.id, rawPrefix: !requiresConfig }), connectorInstanceId: instId, lastSynced:"Not synced yet", templateSourceKey: s.name };
    if (!isWarehouse) rec.startDate = startDates[s.name] || s.firstDate;
    if (requiresConfig){
      const cfg = configs[s.name];
      rec = cfg ? { ...rec, ...cfg, configured:true, status:"Ready" } : { ...rec, configured:false, status:"Needs configuration" };
    } else {
      const cfg = configs[s.name];   // optional reconfigure (rename columns / import filters)
      rec = cfg ? { ...rec, ...cfg, configured:true } : { ...rec, configured:true };
    }
    return rec;
  };

  const chooseConnector = (id) => {
    setSelected(id);
    const c = CONNECTORS.find(x => x.id === id);
    const t = CONNECTOR_TEMPLATES[id];
    setName(c ? c.name : "");
    setVerified(false); setConfigs({});
    setCreds(t && t.kind === "pull" ? pullFormDefaults(t.form) : (t && t.kind === "s3" && t.connForm ? pullFormDefaults(t.connForm) : {}));
    setSftpTemplateId(null); setManagedName(""); setManagedNameEdited(false);
    setPushCreds(t && t.makeCreds ? t.makeCreds() : {});
    setPicks(t && t.sources ? Object.fromEntries(t.sources.map(s => [s.name, true])) : {});
    setStartDates(t && t.sources ? Object.fromEntries(t.sources.map(s => [s.name, s.firstDate])) : {});
    setStep(2);
  };

  const create = () => {
    const instId = "conn_" + Math.random().toString(36).slice(2,10);
    const chosen = tmpl.sources.filter(s => picks[s.name]);
    const dsRecords = chosen.map(s => buildRecord(s, instId));
    const day = todayStr();
    const instance = {
      id: instId,
      name: name || conn.name,
      connectorId: conn.id, connectorName: conn.name, group: conn.group,
      creds,
      automationTrigger: sched, ...triggerToSyncFields(sched),
      startDates: isWarehouse ? {} : Object.fromEntries(chosen.map(s => [s.name, startDates[s.name] || s.firstDate])),
      status: "Ready", lastChecked: "Just now",
      createdAt: day, updatedAt: day, lastRun: "Never",
      dataSourceIds: dsRecords.map(d => d.id),
    };
    onCreate(instance, dsRecords);
  };

  const pushCreate = () => {
    const instId = "conn_" + Math.random().toString(36).slice(2,10);
    const day = todayStr();
    const template = existingSources.find(s => s.id === sftpTemplateId);
    const managed = sftpManagedSource(template, managedName, conn.name, instId, day);
    const instance = {
      id: instId,
      name: name || conn.name,
      connectorId: conn.id, connectorName: conn.name, group: conn.group,
      push: pushCreds, templateSourceId: sftpTemplateId, managedName: managed.name, dataSourceId: managed.id,
      noSchedule: true, status: "Ready", lastChecked: "Just now",
      createdAt: day, updatedAt: day, lastRun: day,
      dataSourceIds: [managed.id],
    };
    onCreate(instance, [managed]);
  };
  const pushSave = () => {
    const dn = displayNamesFromName(managedName);
    const updated = { ...editInstance, name: name || conn.name, push: pushCreds, templateSourceId: sftpTemplateId,
      managedName: connSlug(managedName), updatedAt: todayStr() };
    const sourceUpdates = editInstance.dataSourceId
      ? [{ id: editInstance.dataSourceId, patch: { name: connSlug(managedName), singular: dn.singular, plural: dn.plural } }]
      : [];
    onSave(updated, { newRecords: [], deleteIds: [], sourceUpdates });
  };

  const pullCreate = () => {
    const instId = "conn_" + Math.random().toString(36).slice(2,10);
    const day = todayStr();
    const template = existingSources.find(s => s.id === sftpTemplateId);
    const managed = sftpManagedSource(template, managedName, conn.name, instId, day, false); // pulled on schedule, no seed
    const instance = {
      id: instId,
      name: name || conn.name,
      connectorId: conn.id, connectorName: conn.name, group: conn.group,
      creds, templateSourceId: sftpTemplateId, managedName: managed.name, dataSourceId: managed.id,
      automationTrigger: sched, ...triggerToSyncFields(sched),
      status: "Ready", lastChecked: "Just now",
      createdAt: day, updatedAt: day, lastRun: "Never",
      dataSourceIds: [managed.id],
    };
    onCreate(instance, [managed]);
  };
  const pullSave = () => {
    const dn = displayNamesFromName(managedName);
    const updated = { ...editInstance, name: name || conn.name, creds, templateSourceId: sftpTemplateId,
      managedName: connSlug(managedName),
      automationTrigger: sched, ...triggerToSyncFields(sched), updatedAt: todayStr() };
    const sourceUpdates = editInstance.dataSourceId
      ? [{ id: editInstance.dataSourceId, patch: { name: connSlug(managedName), singular: dn.singular, plural: dn.plural } }]
      : [];
    onSave(updated, { newRecords: [], deleteIds: [], sourceUpdates });
  };

  const streamCreate = () => {
    const instId = "conn_" + Math.random().toString(36).slice(2,10);
    const day = todayStr();
    const dsRecords = tmpl.sources.map(s => ({ ...connectorDataSourceRecord(conn.name, s), configured:true, connectorInstanceId: instId, status:"Waiting for data" }));
    const instance = {
      id: instId,
      name: name || conn.name,
      connectorId: conn.id, connectorName: conn.name, group: conn.group,
      push: pushCreds,
      noSchedule: true, status: "Ready", lastChecked: "Just now",
      createdAt: day, updatedAt: day, lastRun: "—",
      dataSourceIds: dsRecords.map(d => d.id),
    };
    onCreate(instance, dsRecords);
  };
  const streamSave = () => {
    const updated = { ...editInstance, name: name || conn.name, push: pushCreds, updatedAt: todayStr() };
    onSave(updated, { newRecords: [], deleteIds: [], sourceUpdates: [] });
  };

  const save = () => {
    const keptIds = []; const newRecords = []; const deleteIds = [];
    tmpl.sources.forEach(s => {
      const ex = existingByName[s.name];
      if (picks[s.name]){
        if (ex) keptIds.push(ex.id);
        else newRecords.push(buildRecord(s, editInstance.id));
      } else if (ex){
        deleteIds.push(ex.id);
      }
    });
    const chosen = tmpl.sources.filter(s => picks[s.name]);
    const updated = {
      ...editInstance,
      name: name || conn.name, creds,
      automationTrigger: sched, ...triggerToSyncFields(sched),
      startDates: isWarehouse ? {} : Object.fromEntries(chosen.map(s => [s.name, startDates[s.name] || s.firstDate])),
      updatedAt: todayStr(),
      dataSourceIds: [...keptIds, ...newRecords.map(r => r.id)],
    };
    onSave(updated, { newRecords, deleteIds });
  };

  if (configuring && tmpl && tmpl.sources){
    const s = tmpl.sources.find(x => x.name === configuring);
    const apiManaged = !requiresConfig;   // API connectors: reconfigure only, schema fixed by the API
    const base = connectorDataSourceRecord(name || conn.name, s, { connId: conn.id, rawPrefix: apiManaged });
    const draft = configs[configuring] ? { ...base, ...configs[configuring] } : base;
    // Only Snowflake, and only the first time this table is configured, offers "populate an existing
    // Data" — re-configuring an already-mapped table just edits it in place, same as before.
    const offerPopulateExisting = conn.id === "snowflake" && !configs[configuring];
    return <WarehouseConfigureStep key={configuring} tableName={s.name} draft={draft} connectorName={name || conn.name}
      existingSources={existingSources} offerPopulateExisting={offerPopulateExisting}
      title={(apiManaged ? "Reconfigure " : "Configure ") + s.name}
      sub={apiManaged
        ? "Only the column name and filter can be changed here — type and key options are fixed by the API."
        : "Set column parameters for this table. It stays inactive until it is configured."}
      submitLabel={apiManaged ? "Save changes" : "Save configuration"}
      lockedKeys={apiManaged ? ALL_OPTION_KEYS : []}
      lockColType={apiManaged}
      lockName={editing} noRenameRemove={editing} allowAddColumns={editing && !apiManaged}
      onCancel={()=>setConfiguring(null)}
      onSave={(patch)=>{ setConfigs(c => ({ ...c, [configuring]: patch })); setConfiguring(null); }} />;
  }

  if (step === 1){
    return (
      <div className="vds-content">
        <PageHead title="Connectors" sub="Origin: Connectors" onCancel={onCancel} />
        <Stepper current={1} steps={CONNECTOR_WIZARD_STEPS} />
        <div className="vds-alert vds-alert--info proto-note">Connectors create data tables from external systems and keep them up to date by syncing on a schedule you define. Select a connector, configure the connection, and set its sync schedule.</div>
        <div className="vds-h4 proto-section-title">Choose a connector</div>
        <div className="vds-b2 proto-muted proto-section-note">Filter by group or Q3 priority — click multiple priorities to see them together — then select a connector.</div>
        <div className="prio-filter-row">
          <span className="prio-filter-label">Q3 priority</span>
          <button className={"vds-btn vds-btn--sm proto-toggle" + (prioFilter.length===0 ? " active all" : "")} onClick={()=>setPrioFilter([])}>All</button>
          {PRIORITIES.map(p => (
            <button key={p} className={"vds-btn vds-btn--sm proto-toggle" + (prioFilter.includes(p) ? " active " + p.toLowerCase() : "")}
              onClick={()=>setPrioFilter(pf => pf.includes(p) ? pf.filter(x=>x!==p) : [...pf, p])}>{p}</button>
          ))}
          {prioFilter.length > 0 && <span className="vds-caption">{list.length} of {CONNECTORS.length} connectors</span>}
        </div>
        <div className="filter-pills">
          {CONN_GROUPS.map(g => (
            <button key={g} className={"vds-btn vds-btn--sm proto-toggle" + (group===g ? " active" : "")} onClick={()=>setGroup(g)}>{g}</button>
          ))}
        </div>
        <div className="conn-grid">
          {list.map(c => (
            <button key={c.id} className={"vds-card proto-conn-card" + (selected===c.id ? " selected" : "") + (c.priority==="P3" ? " p3" : "")} onClick={()=>chooseConnector(c.id)}>
              <span className="conn-ico"><Icon name={c.icon} size={20} /></span>
              <span className="conn-meta">
                <span className="conn-name">{c.name}</span>
                <span className="conn-group">{c.group}</span>
              </span>
              <span className={"vds-chip vds-chip--sm proto-corner-tag " + c.priority.toLowerCase()}>{c.priority}</span>
            </button>
          ))}
        </div>
        <div className="wiz-footer">
          <button className="vds-btn" onClick={onCancel}><Icon name="arrowLeft" size={17} />Back</button>
        </div>
      </div>
    );
  }

  if (step === 2){
    if (isApiConnector){
      return <ApiConnectorFlow conn={conn} tmpl={tmpl} editing={editing} editInstance={editInstance}
        existingSources={existingSources} existingConnectors={existingConnectors} onOpenSource={onOpenSource} presetTargetId={presetTargetSourceId}
        onCancel={onCancel} onBackToConnectors={editing ? onCancel : (()=>setStep(1))}
        onCreate={onCreate} onSave={onSave} />;
    }
    if (isSnowflakeConn){
      return <SnowflakeConnectorFlow conn={conn} tmpl={tmpl} editing={editing} editInstance={editInstance}
        existingSources={existingSources} existingConnectors={existingConnectors} onOpenSource={onOpenSource} presetTargetId={presetTargetSourceId}
        onCancel={onCancel} onBackToConnectors={editing ? onCancel : (()=>setStep(1))}
        onCreate={onCreate} onSave={onSave} />;
    }
    if (isScript){
      return <ScriptConnectorFlow conn={conn} tmpl={tmpl} editing={editing} editInstance={editInstance}
        existingSources={existingSources} onOpenSource={onOpenSource}
        onCancel={onCancel} onBackToConnectors={editing ? onCancel : (()=>setStep(1))}
        onCreate={onCreate} onSave={onSave} />;
    }
    if (isInbox){
      return <EmailInboxFlow conn={conn} tmpl={tmpl} editing={editing} editInstance={editInstance}
        existingSources={existingSources} existingConnectors={existingConnectors} onOpenSource={onOpenSource}
        onCancel={onCancel} onBackToConnectors={editing ? onCancel : (()=>setStep(1))}
        onCreate={onCreate} onSave={onSave} />;
    }
    if (isS3){
      return <S3ConnectorFlow conn={conn} tmpl={tmpl} editing={editing} editInstance={editInstance}
        existingSources={existingSources} existingConnectors={existingConnectors} onOpenSource={onOpenSource} presetTargetId={presetTargetSourceId}
        onCancel={onCancel} onBackToConnectors={editing ? onCancel : (()=>setStep(1))}
        onCreate={onCreate} onSave={onSave} />;
    }
    if (isPush){
      return <PushConfigureStep conn={conn} tmpl={tmpl} name={name} setName={setName} sources={fileSources}
        templateId={sftpTemplateId} setTemplateId={setSftpTemplateId} managedName={managedName} setManagedName={editManagedName} creds={pushCreds} editing={editing}
        onCancel={onCancel} onBack={editing ? onCancel : (()=>setStep(1))} onContinue={()=>setStep(3)} />;
    }
    if (isPull){
      return <PullConfigureStep conn={conn} tmpl={tmpl} name={name} setName={setName} sources={fileSources}
        templateId={sftpTemplateId} setTemplateId={setSftpTemplateId} managedName={managedName} setManagedName={editManagedName} creds={creds} setCreds={setCreds} editing={editing}
        onCancel={onCancel} onBack={editing ? onCancel : (()=>setStep(1))} onContinue={()=>setStep(3)} />;
    }
    if (isStream){
      return <StreamConfigureStep conn={conn} tmpl={tmpl} name={name} setName={setName} creds={pushCreds} editing={editing}
        onCancel={onCancel} onBack={editing ? onCancel : (()=>setStep(1))} onContinue={()=>setStep(3)} />;
    }
    if (!tmpl){
      return (
        <div className="vds-content">
          <PageHead title={"Connect " + conn.name} sub={"Origin: Connectors · " + conn.name} onCancel={onCancel} />
          <Stepper current={2} steps={CONNECTOR_STEPS} />
          <div className="vds-h4 proto-section-title">Configure {conn.name}</div>
          <div className="vds-alert vds-alert--info proto-note proto-plain-note">The connection form for <strong>{conn.name}</strong> ({conn.group}) will be built next — each connector type has its own fields (credentials, endpoints, buckets, and so on).</div>
          <div className="wiz-footer"><button className="vds-btn" onClick={()=>setStep(1)}><Icon name="arrowLeft" size={17} />Back</button></div>
        </div>
      );
    }
    return <ConfigureStep conn={conn} tmpl={tmpl} name={name} setName={setName} creds={creds} setCreds={setCreds}
      verified={verified} setVerified={setVerified} picks={picks} setPicks={setPicks} startDates={startDates} setStartDates={setStartDates}
      configs={configs} onConfigure={(nm)=>setConfiguring(nm)}
      editing={editing} existingNames={existingNames} onOpenExisting={openExisting}
      onCancel={onCancel} onBack={editing ? onCancel : (()=>setStep(1))} onContinue={()=>setStep(3)} />;
  }

  if (isPush){
    return <PushScheduleStep conn={conn} editing={editing} onCancel={onCancel} onBack={()=>setStep(2)} onCreate={editing ? pushSave : pushCreate} />;
  }
  if (isStream){
    return <PushScheduleStep conn={conn} editing={editing} note="Devices stream data to the MQTT broker in real time — no schedule needed. The data tables populate automatically as your devices connect and publish." onCancel={onCancel} onBack={()=>setStep(2)} onCreate={editing ? streamSave : streamCreate} />;
  }
  return <ScheduleStep conn={conn} sched={sched} setSched={setSched} editing={editing} onCancel={onCancel} onBack={()=>setStep(2)} onCreate={editing ? (isPull ? pullSave : save) : (isPull ? pullCreate : create)} />;
}

/* ---------------- Connector details ---------------- */
function ConnectorDetails({ conn, sources, onBack, onUpdate, onOpenSource }){
  const [name, setName] = useState(conn.name || "");
  const [sched, setSched] = useState({ frequency:conn.frequency, timeOfDay:conn.timeOfDay, dayOfWeek:conn.dayOfWeek || "Monday" });
  const set = (patch) => setSched(s => ({ ...s, ...patch }));
  const dirty = name !== conn.name || sched.frequency !== conn.frequency || sched.timeOfDay !== conn.timeOfDay || (sched.dayOfWeek || "Monday") !== (conn.dayOfWeek || "Monday");
  const save = () => onUpdate(conn.id, { name: name || conn.name, frequency:sched.frequency, timeOfDay:sched.timeOfDay, dayOfWeek:sched.dayOfWeek });
  const cancel = () => { setName(conn.name || ""); setSched({ frequency:conn.frequency, timeOfDay:conn.timeOfDay, dayOfWeek:conn.dayOfWeek || "Monday" }); };
  const dsList = (conn.dataSourceIds || []).map(id => sources.find(s => s.id === id)).filter(Boolean);

  return (
    <div className="vds-content">
      <button className="vds-btn vds-btn--text vds-btn--sm proto-back-link" onClick={onBack}><Icon name="arrowLeft" size={16} />Connections</button>
      <div className="vds-page-header proto-sticky-head">
        <div>
          <h1 className="vds-page-title">{conn.name}</h1>
        </div>
        <span className="vds-chip vds-chip--sm proto-status-pill"><span className="dot"></span>{conn.status}</span>
      </div>

      <div className="form-grid">
        <div className="field">
          <label className="vds-label">Connector name</label>
          <input className="vds-input" value={name} onChange={(e)=>setName(e.target.value)} />
        </div>
      </div>
      <div className="meta-grid">
        <div className="form-grid">
          <div className="field">
            <label className="vds-label">Sync frequency</label>
            <select className="vds-select" value={sched.frequency} onChange={(e)=>set({frequency:e.target.value})}>
              <option>Ad-hoc</option><option>Hourly</option><option>Daily</option><option>Weekly</option>
            </select>
          </div>
        </div>
        {sched.frequency !== "Hourly" && sched.frequency !== "Ad-hoc" && (
          <div className="form-grid">
            <div className="field">
              <label className="vds-label">Time of day (UTC)</label>
              <input className="vds-input" type="time" value={sched.timeOfDay} onChange={(e)=>set({timeOfDay:e.target.value})} />
            </div>
          </div>
        )}
      </div>
      {sched.frequency === "Weekly" && (
        <div className="form-grid">
          <div className="field">
            <label className="vds-label">Day of week</label>
            <select className="vds-select" value={sched.dayOfWeek} onChange={(e)=>set({dayOfWeek:e.target.value})}>
              {WEEKDAYS.map(d => <option key={d}>{d}</option>)}
            </select>
          </div>
        </div>
      )}

      {dirty && (
        <div className="vds-alert vds-alert--info proto-save-bar">
          <span className="save-note">You have unsaved changes</span>
          <div style={{display:"flex", gap:10}}>
            <button className="vds-btn" onClick={cancel}>Cancel</button>
            <button className="vds-btn vds-btn--primary vds-btn--sm" onClick={save}><Icon name="check" size={16} />Save changes</button>
          </div>
        </div>
      )}

      <div className="vds-h4 proto-section-title" style={{marginTop:34}}>Data tables</div>
      <div className="vds-b2 proto-muted proto-section-note">Data tables this connector keeps in sync. Select one to open its details.</div>
      <div className="vds-table-container">
        {dsList.length === 0 && <div className="conn-ds-item"><span className="ds-none">No data tables — they may have been deleted.</span></div>}
        {dsList.map(ds => (
          <div className="conn-ds-item" key={ds.id}>

// ---- Tokenizer ----
function tokenizeFormula(src){

function TransformStep({ step, index, cols, inRows, sources, showSQL, fromRel, onChange, onDelete, onUp, onDown, canUp, canDown }){

        </span>
      </div>
      <div className="xf-step-body">
        {step.typeId === "join" && (<>
          <div className="xf-row">
            <div className="xf-fld"><span className="vds-label">Join data table</span>

              <div className="xf-fld"><input className="vds-input" placeholder="value" value={c.val || ""} onChange={e => setClause(ci, { val:e.target.value })} /></div>

        </>)}

      {showSQL && <div className="xf-sql">{xfStepSQL(step, fromRel, sources)}</div>}
    </div>
  );

function TransformBuilder({ sources, inputId, setInputId, steps, setSteps, outputMode, setOutputMode, outName, setOutName, outTargetId, setOutTargetId, showSQL, setShowSQL }){
  const [adding, setAdding] = useState(false);
  const input = sources.find(s => s.id === inputId);
  const addStep = (typeId) => {
    const t = TRANSFORM_TYPES.find(x => x.id === typeId);
    setSteps([...steps, { id:"xf_" + Math.random().toString(36).slice(2,8), typeId, name:t.label, params:defaultStepParams(typeId) }]);
    setAdding(false);
  };
  const updateStep = (i, ns) => setSteps(steps.map((s, idx) => idx === i ? ns : s));
  const delStep = (i) => setSteps(steps.filter((_, idx) => idx !== i));
  const move = (i, dir) => { const j = i + dir; if (j < 0 || j >= steps.length) return; const cp = steps.slice(); const tmp = cp[i]; cp[i] = cp[j]; cp[j] = tmp; setSteps(cp); };
  const inputSlug = input ? connSlug(input.name) : "source";
  const relFor = (i) => i === 0 ? inputSlug : "step_" + i;

  // Live preview: the cumulative result of every step so far, over the loaded sample data. With no
  // steps yet this is simply the raw input table — a live, client-side reflection, not a re-fetch.

  const previewRows = exec.rows.slice(0, 25);

  const grain = pipelineGrainEffect(steps);

  const canExpand = steps.some(s => s.typeId === "union");

      <div className="vds-h4 proto-section-title" style={{display:"flex", alignItems:"center"}}>Transformations

      </div>
      <div className="vds-b2 proto-muted proto-section-note">A linear sequence of steps — each one transforms the output of the step before it. A step needing a second table (Join, Union) prompts for it right there. Define each step in the UI; no code required.</div>

      <div className="xf-flow">
        <div className="vds-card proto-xf-node io"><span className="xf-ic"><Icon name="database" size={17} /></span><span><div className="xf-nm">{input ? input.name : "No input selected"}</div><div className="xf-sub">{input ? ("Input · " + input.records + " records") : "Pick an input above"}</div></span></div>
        {steps.map((s, i) => (
          <React.Fragment key={s.id}>
            <div className="xf-conn"></div>
            <TransformStep step={s} index={i} cols={availableColsTyped(input, steps, i, sources).map(c => c.name)} inRows={input ? runTransform(input, steps.slice(0, i), sources).rows.slice(0, 8) : []} sources={sources.filter(s2 => s2.id !== inputId)} showSQL={showSQL} fromRel={relFor(i)}
              onChange={ns => updateStep(i, ns)} onDelete={() => delStep(i)} onUp={() => move(i, -1)} onDown={() => move(i, 1)} canUp={i > 0} canDown={i < steps.length - 1} />

          <Icon name="plus" size={16} /><span>Add column to existing</span>
        </button>
        <button className={"xf-outmode" + (outputMode === "expand" ? " on" : "") + (!canExpand ? " disabled" : "")} disabled={!canExpand} title={!canExpand ? "Only available when this data transformation stacks rows via Union / append." : undefined} onClick={() => canExpand && setOutputMode("expand")}>
          <Icon name="layers" size={16} /><span>Expand existing with rows</span>
        </button>
      </div>
      {!canAddCol && <div className="vds-helper-text" style={{marginBottom:12}}>{grainReason || "Add a transformation to see which output modes are legal."}</div>}

      {outputMode === "addcol" && input && (

            <input className="vds-input locked" value={input.name} readOnly title="Grain preserved — writes back to the data transformation's input" />
            <div className="vds-helper-text">Grain preserved (one output row per input row, same key) — {newCols.length ? ("adds " + newCols.map(c=>"\""+c+"\"").join(", ")) : "adds the new column(s)"} to {input.name} without touching its existing rows or columns. If {input.name} is connector-synced, the connector's own columns keep syncing untouched.</div>
          </div>
        </div>
      )}
      {outputMode === "expand" && (
        <div className="form-grid">

            <label className="vds-label">Target table to expand</label>
            <select className="vds-select" value={outTargetId || ""} onChange={e => setOutTargetId(e.target.value)}>
              <option value="">Select data table</option>
              {sources.filter(s => !input || s.id !== input.id).map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
            </select>

              <span className={"vds-chip vds-chip--sm proto-corner-tag" + (t.scopeTag === "P0" ? " p0" : " tbd")}>{t.scopeTag}</span>
            </button>
          ))}
        </div>
        <div className="wiz-footer"><button className="vds-btn" onClick={onCancel}><Icon name="arrowLeft" size={17} />Back</button></div>
      </div>
    );
  }

  if (step === 3 && isXfNew && outDraft){
    return <ConfigureSource source={outDraft}
      stepper={<Stepper current={3} steps={PIPELINE_STEPS_XF_NEW} />}
      title="Configure output data table"
      sub={"Set the columns, types, and primary key for the data table this data transformation creates — this is the only place the schema can be configured. The transformations were run on the sample data — " + outDraft.parsed.rows.length + " rows produced."}
      submitLabel="Continue"
      lockName={true}
      onCancel={() => setStep(2)}
      onSave={(patch) => { setOutCfg(patch); setStep(4); }} />;
  }

  if (step === scheduleStepN){
    return (
      <div className="vds-content">
        <PageHead title={(editing ? "Edit " : "New ") + type.label} sub={"Data transformation · " + type.label} onCancel={onCancel} />
        <Stepper current={scheduleStepN} steps={pipeSteps} />
        <div className="vds-h4 proto-section-title">Automate</div>
        <div className="vds-b2 proto-muted proto-section-note">{isDir ? "How often this saved prompt runs in the agent harness." : isXf ? "How this data transformation reruns — plus a manual Run now, always available from the Automations page." : "How often this data transformation runs."}</div>
        {isXf && (
          <div className="xf-outmode-row">
            <button className={"xf-outmode" + (triggerMode === "input" ? " on" : "")} onClick={() => setTriggerMode("input")}><Icon name="broadcast" size={16} /><span>On input update</span></button>
            <button className={"xf-outmode" + (triggerMode === "schedule" ? " on" : "")} onClick={() => setTriggerMode("schedule")}><Icon name="clock" size={16} /><span>On schedule</span></button>
          </div>
        )}
        {isXf && triggerMode === "input" && (<>
          <div className="vds-b2 proto-muted proto-section-note" style={{marginTop:0}}>Reruns automatically whenever a subscribed input data table gets new data — chained off that source's own connector sync. Deselect slow-moving inputs (e.g. catalogs) that shouldn't force a rerun.</div>
          <div className="xf-chips" style={{marginBottom:12}}>
            {xfInputIds.map(id => {
              const s = sources.find(x => x.id === id);

            {xfInputIds.length === 0 && <span className="vds-helper-text">Pick an input in step 2 first.</span>}

        </>)}
        {(!isXf || triggerMode === "schedule") && (<>
          <div style={{display:"flex", gap:12, flexWrap:"wrap", alignItems:"flex-end"}}>
            <div className="form-grid">
              <div className="field" style={{flex:"1 1 170px", margin:0}}>

            </div>}
            {dirSched.frequency !== "Hourly" && dirSched.frequency !== "Manually" && dirSched.frequency !== "By Minute" && <div className="field" style={{flex:"1 1 150px", margin:0}}>
              <label className="vds-label">Time (UTC)</label>
              <input className="vds-input" type="time" value={dirSched.timeOfDay} onChange={e => setDirSched({ ...dirSched, timeOfDay:e.target.value })} />

            {dirSched.frequency === "Weekly" && <div className="field" style={{flex:"1 1 150px", margin:0}}>
              <label className="vds-label">Day</label>

              </select>
            </div>}
          </div>
          <div className="vds-b2 proto-muted proto-section-note" style={{marginTop:10}}>Runs {syncSummary(dirSched)} · next run {computeNextRun(dirSched)}</div>
        </>)}
        {cycleError && <div className="vds-alert vds-alert--error proto-note">{cycleError}</div>}
        <div className="wiz-footer">
          <button className="vds-btn" onClick={()=>setStep(isXfNew ? 3 : 2)}><Icon name="arrowLeft" size={17} />Back</button>
          <button className="vds-btn vds-btn--primary" onClick={commit}><Icon name="check" size={17} />{editing ? "Save changes" : "Create data transformation"}</button>
        </div>
      </div>
    );
  }

  return (
    <div className="vds-content">
      <PageHead title={(editing ? "Edit " : "New ") + type.label} sub={"Data transformation · " + type.label} onCancel={onCancel} />
      <Stepper current={2} steps={pipeSteps} />

      <div className="form-grid">
        <div className="field">
          <label className="vds-label">Data transformation name</label>
          <input className={"vds-input" + (name.trim() && nameTaken(name) ? " err" : "")} placeholder={"e.g. " + (isXf ? "normalize_work_orders" : isEmbed ? "work_order_embeddings" : isDir ? "nightly_triage" : typeId === "smart" ? "high_risk_vehicles" : "tpms_issues")} value={name} onChange={(e)=>setName(e.target.value)} />

      {isXf ? (
        <TransformBuilder sources={sources} inputId={sourceId} setInputId={setSourceId}

            {pcolObjs.length > 0 && preview.length > 0 && <div className="vds-table-container proto-scroll-wrap"><table className="vds-table proto-preview-table">
              <thead><tr>{pcolObjs.map(c => <th key={c.name}>{c.display || c.name}</th>)}</tr></thead>

            <div className="form-grid">
              <div className="field" style={{marginTop:20}}>
                <label className="vds-label">Output column name</label>

                  ? ("Matches the input — the " + (outputCol || "smart_groups") + " column is added to the original data table, " + chosenSource.name + ".")
                  : ((chosenSource ? ("Use the same name as the input (" + chosenSource.name + ") to add the " + (outputCol || "smart_groups") + " column to the original data table. ") : "") + "Use a different name to create new Data containing the input rows plus the " + (outputCol || "smart_groups") + " column.")}</div>
              </div>
            </div>
          </>);
        })() : (
          <div className="vds-alert vds-alert--info proto-note proto-plain-note" style={{marginTop:18}}>Pick event-type data table to configure smart groups.</div>
        )}
      </>) : isIssue ? (() => {

        if (eventSources.length === 0){
          return (<>
            <div className="vds-alert vds-alert--info proto-note proto-plain-note" style={{marginBottom:14}}>This data transformation reads TPMS sensor values from a data table and creates Issues for sensor values demonstrating various leak behaviors. Issues are shown elsewhere in the app (out of scope for this prototype).</div>
            <div className="vds-h4 proto-section-title">Input data table</div>
            <div className="vds-alert vds-alert--info proto-note proto-plain-note" style={{marginTop:12}}>TPMS Issue Detection requires <b>event-type</b> data table. None are available yet — create one first, then set up this data transformation.</div>
          </>);
        }
        const cols = chosenSource ? definedCols(chosenSource) : [];
        return (<>
          <div className="vds-alert vds-alert--info proto-note proto-plain-note" style={{marginBottom:16}}>This data transformation reads TPMS sensor values from a data table and creates Issues for sensor values demonstrating various leak behaviors. Issues are shown elsewhere in the app (out of scope for this prototype).</div>

          <div className="vds-h4 proto-section-title">Input data table</div>
          <div className="vds-b2 proto-muted proto-section-note">Only event-type data tables can be used for TPMS Issue Detection.</div>
          <DataSourcePicker sources={eventSources} valueId={sourceId} onChange={(id)=>{ setSourceId(id); setColUses({}); }} />

          {chosenSource ? (<>
            <div className="vds-h4 proto-section-title">Columns</div>
            <div className="vds-b2 proto-muted proto-section-note">Select the columns the algorithm should use and assign each a purpose. The <b>TPMS sensor value</b> column is required; Unit, Latitude, and Longitude are optional.</div>
            <div className="embed-list">
              {cols.map(c => { const on = colUses[c.name] != null; const full = Object.keys(colUses).length >= TPMS_USES.length; const lock = !on && full; return (
                <div key={c.name} className={"embed-row" + (on ? " on" : "")} style={lock ? {opacity:0.5} : null}>
                  <input type="checkbox" className="vds-checkbox" checked={on} disabled={lock} onChange={() => toggleIssueCol(c.name)} />
                  <span className="embed-row-name" style={{cursor: lock ? "default" : "pointer"}} onClick={() => { if (!lock) toggleIssueCol(c.name); }}>{c.display || c.name}</span>
                  <span className="embed-row-type">{c.type || "string"}</span>
                  {on && (() => {
                    const takenElsewhere = new Set(Object.keys(colUses).filter(k => k !== c.name).map(k => colUses[k]));
                    return (
                      <select className="vds-select" style={{maxWidth:210, marginLeft:12, height:34, padding:"4px 10px"}} value={colUses[c.name]} onChange={e => setIssueUse(c.name, e.target.value)}>
                        {TPMS_USES.map(u => <option key={u} value={u} disabled={takenElsewhere.has(u)}>{u}{takenElsewhere.has(u) ? " (assigned)" : ""}</option>)}
                      </select>
                    );
                  })()}
                </div>
              ); })}
            </div>
            {Object.values(colUses).indexOf("TPMS sensor value") === -1 && (
              <div className="vds-alert vds-alert--info proto-note proto-plain-note" style={{marginTop:10}}>Assign one column the <b>TPMS sensor value</b> purpose to continue.</div>
            )}
          </>) : (
            <div className="vds-alert vds-alert--info proto-note proto-plain-note" style={{marginTop:18}}>Pick event-type data table to choose and assign its columns.</div>
          )}
        </>);
      })() : (<>
        <div className="vds-h4 proto-section-title">Applies to data table</div>
        <div className="vds-b2 proto-muted proto-section-note">The data table this data transformation analyzes.</div>
        <DataSourcePicker sources={sources} valueId={sourceId} onChange={setSourceId} />
        <div className="vds-alert vds-alert--info proto-note proto-plain-note" style={{marginTop:22}}>The full {type.label} builder will be built next. For now this creates the data transformation so it appears in the list.</div>
      </>)}

      <div className="wiz-footer">
        <button className="vds-btn" onClick={editing ? onCancel : (()=>setStep(1))}><Icon name="arrowLeft" size={17} />Back</button>
        <button className="vds-btn vds-btn--primary" disabled={!canCommit} onClick={isXfNew ? goConfigureOutput : (()=>setStep(3))}>Continue<Icon name="arrowRight" size={17} /></button>
      </div>
    </div>
  );
}

/* ---------------- Schedule run history ---------------- */
const RUN_ERRORS = [
  "Source endpoint timed out after 30s",
  "Authentication failed (401 Unauthorized)",
  "Schema mismatch: expected column 'vehicle_id' was not present",
  "Rate limit exceeded (429) from provider",
  "Source returned HTTP 500 (Internal Server Error)",
  "Connection reset while streaming rows",
];
const RUN_PENDING = [
  "Unresolved dependency: upstream data table hasn't delivered new records yet. This run is queued and will retry automatically when they arrive.",
  "Waiting on input from linked data table. Nothing new to process — the job will retry once new data arrives.",
];
function simulateRunOutcome(){
  const r = Math.random();
  if (r < 0.08) return { status:"error", msg: RUN_ERRORS[Math.floor(Math.random() * RUN_ERRORS.length)] };
  if (r < 0.22) return { status:"pending", msg: RUN_PENDING[Math.floor(Math.random() * RUN_PENDING.length)] };
  return { status:"ok" };
}
function runStatusMeta(status){
  switch(status){
    case "progress": return { label:"In progress", icon:"refresh", cls:"progress" };
    case "pending": return { label:"Waiting on data — will retry", icon:"clock", cls:"pending" };
    case "error": return { label:"Error", icon:"alert", cls:"error" };
    default: return { label:"Success", icon:"check", cls:"ok" };
  }
}
function statusWord(st){ return runStatusMeta(st).label; }
function fmtRunTs(ts){
  if (!ts) return "—";
  return new Date(ts).toLocaleString("en-US", { month:"short", day:"numeric", hour:"numeric", minute:"2-digit", second:"2-digit" });
}
function fmtDuration(startedTs, finishedTs){
  if (!startedTs) return "—";
  const end = finishedTs || Date.now();
  const ms = Math.max(0, end - startedTs);
  const s = Math.round(ms/1000);
  if (s < 60) return s + "s";
  const m = Math.floor(s/60), rs = s % 60;
  if (m < 60) return m + "m" + (rs ? " " + rs + "s" : "");
  const h = Math.floor(m/60), rm = m % 60;
  return h + "h" + (rm ? " " + rm + "m" : "");
}
// Coarse 3-way classification for the History table (distinct from the more granular Schedules-tab type).
function histRowType(sched, pipelines){
  if (sched.connectorId) return "connection";
  const pipe = sched.pipelineId ? pipelines.find(p => p.id === sched.pipelineId) : null;
  return (pipe && pipe.typeId === "directive") ? "saved prompt" : "data transformation";
}
// Flatten schedule-level runs into one row per data for connector runs (a single connector
// sync covers several tables), and one row per run for pipeline/directive runs.
function buildHistoryRows(runs, automations, connectors, pipelines, sources){
  const schedById = {}; automations.forEach(a => { schedById[a.id] = a; });
  const rows = [];
  runs.forEach(run => {
    const sched = schedById[run.automationId];
    if (!sched) return; // automation since deleted
    const type = histRowType(sched, pipelines);
    if (type === "connection"){
      const conn = connectors.find(c => c.id === sched.connectorId);
      if (!conn) return;
      const dsIds = (conn.dataSourceIds || []).filter(id => { const src = sources.find(s => s.id === id); return src && src.configured !== false; });
      if (dsIds.length === 0){
        rows.push({ key: run.id, run, type, name: sched.name, navKind:"connector", navId: sched.connectorId });
      } else {
        dsIds.forEach(id => {
          const src = sources.find(s => s.id === id);
          rows.push({ key: run.id + "::" + id, run, type, name: src ? src.name : sched.name, navKind:"connector", navId: sched.connectorId });
        });
      }
    } else {
      rows.push({ key: run.id, run, type, name: sched.name, navKind:"pipeline", navId: sched.pipelineId });
    }
  });
  rows.sort((a,b) => b.run.startedTs - a.run.startedTs);
  return rows;
}
function argoStepsFor(type){
  if (type === "connection") return ["fetch-credentials","discover-schema","extract-records","transform-batch","load-destination"];
  if (type === "directive") return ["load-context","run-agent-prompt","apply-tool-calls","write-results"];
  return ["read-inputs","apply-transform","write-output"];
}
// Fabricated Argo Workflow-style pod log for a run, shaped by its status and elapsed time.
function genArgoLogs(row){
  const run = row.run;
  const wf = "wf-" + run.id.replace(/^run_/, "");
  const steps = argoStepsFor(row.type);
  const start = run.startedTs;
  const end = run.finishedTs || Date.now();
  const span = Math.max(end - start, steps.length * 400);
  let doneCount = steps.length;
  if (run.status === "progress") doneCount = Math.max(1, Math.floor(steps.length * 0.6));
  if (run.status === "error") doneCount = Math.max(1, steps.length - 1);
  const lines = [];
  for (let i = 0; i < doneCount; i++){
    const t = start + Math.round(((i+1)/steps.length) * span);
    lines.push({ ts:t, pod: wf + "-" + steps[i], level:"info", text: "step \"" + steps[i] + "\" succeeded" });
  }
  if (run.status === "ok"){
    lines.push({ ts:end, pod: wf, level:"info", text: "workflow completed successfully" });
  } else if (run.status === "pending"){
    const stepName = steps[doneCount] || steps[steps.length-1];
    lines.push({ ts:end, pod: wf + "-" + stepName, level:"warn", text: run.msg || "Waiting on data — will retry" });
    lines.push({ ts:end, pod: wf, level:"warn", text: "workflow suspended — will resume automatically when new data arrives" });
  } else if (run.status === "error"){
    const failStep = steps[doneCount] || steps[steps.length-1];
    lines.push({ ts:end, pod: wf + "-" + failStep, level:"error", text: run.msg || "step failed" });
    lines.push({ ts:end, pod: wf, level:"error", text: "workflow failed: step \"" + failStep + "\" exited with an error" });
  } else {
    const nextStep = steps[doneCount] || steps[steps.length-1];
    lines.push({ ts:end, pod: wf + "-" + nextStep, level:"info", text: "step \"" + nextStep + "\" running…" });
  }
  return lines;
}

   Only the first step picks a trigger; later steps run after the one before
   them, so all they show is the optional delay. */
/* Status chip for one run. Warning and error carry an explanation, so their label
   gets a dashed underline and hover text; Running spins. */
function RunStatusChip({ status, message }){
  const cls = status === "ok" ? " vds-chip--success"
            : status === "warn" ? " vds-chip--warning"
            : status === "error" ? " vds-chip--error" : "";
  const icon = status === "running" ? "spinner"
             : status === "ok" ? "check"
             : status === "warn" ? "alert" : "x";
  const label = RUN_STATUS_LABEL[status] || status;
  const explained = status === "warn" || status === "error";
  return (
    <span className={"vds-chip vds-chip--sm proto-run-chip" + cls}>
      <Icon name={icon} size={14} className={status === "running" ? "run-spin" : undefined} />
      {explained && message
        ? <span className="proto-dashed-underline" title={message}>{label}</span>
        : <span>{label}</span>}
    </span>
  );
}

/* Past runs of one automation, with mutually exclusive status filters. */
function AutomationRunHistory({ automation }){
  const [filter, setFilter] = useState("all");
  const runs = automation.runList || [];
  const counts = {
    all: runs.length,
    ok: runs.filter(r => r.status === "ok").length,
    warn: runs.filter(r => r.status === "warn").length,
    error: runs.filter(r => r.status === "error").length,
    running: runs.filter(r => r.status === "running").length,
  };
  const shown = filter === "all" ? runs : runs.filter(r => r.status === filter);
  const FILTERS = [["all","All"],["ok","Success"],["warn","Warning"],["error","Error"],["running","Running"]];
  return (
    <div>
      <div className="runh-filters" style={{margin:"0 0 16px"}}>
        {FILTERS.map(([v,label]) => (
          <button key={v} className={"vds-btn vds-btn--sm proto-toggle" + (filter === v ? " on" : "")}
            aria-pressed={filter === v} onClick={()=>setFilter(v)}>{label} {counts[v]}</button>
        ))}
      </div>
      {shown.length === 0 ? (
        <div className="vds-alert vds-alert--info proto-note">No runs match this filter.</div>
      ) : (
        <div className="vds-table-container">
          <div className="thead" style={{gridTemplateColumns:"1.3fr 1fr 0.9fr 1fr"}}>
            <div className="th">Last run</div><div className="th">Status</div>
            <div className="th">Duration</div><div className="th">Triggered by</div>
          </div>
          <div className="tbody">
            {shown.map(r => (
              <div className="trow" style={{gridTemplateColumns:"1.3fr 1fr 0.9fr 1fr"}} key={r.id}>
                <div className="td">{fmtRunAt(r.at)}</div>
                <div className="td"><RunStatusChip status={r.status} message={r.message} /></div>
                <div className="td">{r.status === "running" ? "—" : fmtRunDuration(r.durationMin)}</div>
                <div className="td">{TRIGGERED_BY_LABEL[r.triggeredBy] || "Schedule"}</div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}
