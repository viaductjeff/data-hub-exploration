                            disabled={step.actions.length <= 1}
                            onClick={()=>removeAction(step.id, act.id)}><Icon name="x" size={16} /></button>
                        </div>
                      ))}
                    </div>
                    <button className="vds-btn vds-btn--sm vds-btn--start-icon" style={{marginTop:8}}
                      onClick={()=>addAction(step.id)}><Icon name="plus" size={16} />Add action</button>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}
      {draft.steps.length > 0 && (
        <div style={{marginTop:16}}>
          <button className="vds-btn vds-btn--start-icon" onClick={addStep}><Icon name="plus" size={18} />Add step</button>
        </div>
      )}
      </>)}
    </div>
  );
}

function RunHistory({ cfg, automations, runs, connectors, pipelines, sources, tabBar, onOpenConnector, onOpenPipeline }){
  const [statusF, setStatusF] = useState("all");
  const [typeF, setTypeF] = useState("all");
  const [query, setQuery] = useState("");
  const [openKey, setOpenKey] = useState(null);
  const [, setTick] = useState(0);
  const now = Date.now();

  const allRows = buildHistoryRows(runs, automations, connectors, pipelines, sources);
  const hasInProgress = allRows.some(r => r.run.status === "progress");
  React.useEffect(() => {
    if (!hasInProgress) return;
    const t = setInterval(() => setTick(x => x+1), 1000);
    return () => clearInterval(t);
  }, [hasInProgress]);

  const rows = allRows.filter(r => {
    if (statusF !== "all" && r.run.status !== statusF) return false;
    if (typeF !== "all" && r.type !== typeF) return false;
    const q = query.trim().toLowerCase();
    if (q && !r.name.toLowerCase().includes(q)) return false;
    return true;
  });

  // Metrics — rolling 1-month window, based on finished schedule-level runs (not exploded rows).
  const monthStart = now - 30*864e5;
  const finished = runs.filter(r => r.finishedTs != null);
  const monthRuns = finished.filter(r => r.startedTs >= monthStart);
  const total = monthRuns.length;
  const okCount = monthRuns.filter(r => r.status === "ok").length;
  const successRate = total ? Math.round(okCount/total*100) : null;

  const openRow = openKey ? allRows.find(r => r.key === openKey) : null;
  const goToConfigurator = (row) => { if (row.navKind === "connector") onOpenConnector(row.navId); else onOpenPipeline(row.navId); };

  if (openRow){
    return <RunDetailsPage row={openRow} onBack={()=>setOpenKey(null)} onOpenConfigurator={goToConfigurator} />;
  }

  return (
    <div className="vds-content">
      <div className="vds-page-header">
        <div><h1 className="vds-page-title">{cfg.title}</h1></div>
      </div>
      {tabBar}
      <div className="tab-body" style={{minHeight:0}}>
        <div className="hist-metrics">
          <div className="vds-card proto-stat-card"><div className="stat-label">Runs (30d)</div><div className="stat-value">{total}</div><div className="stat-sub">rolling 1-month window</div></div>
          <div className="vds-card proto-stat-card"><div className="stat-label">Success rate (30d)</div><div className="stat-value">{successRate == null ? "—" : successRate + "%"}</div><div className="stat-sub">{total ? okCount + " of " + total + " runs succeeded" : "no runs yet"}</div></div>
        </div>

        {automations.length === 0 ? (
          <div className="empty">
            <div className="empty-tile"><Icon name="clock" size={30} /></div>
            <h2>No automations yet</h2>
            <p>Automations created by connectors and data transformations will show their run history here.</p>
          </div>
        ) : (<>
          <div className="vds-b2 proto-muted proto-section-note" style={{marginTop:0}}>Every data table, data transformation, and saved prompt that has run on the platform, one row per run. A connector run shows up here once per data table it syncs.</div>
          <div className="runh-toolbar">
            <div className="vds-table-toolbar__count"><b>{rows.length}</b> runs</div>
            <div className="runh-filters">
              <div className="pubfilter">
                <select className="vds-select" value={statusF} onChange={(e)=>setStatusF(e.target.value)} aria-label="Filter by status">
                  <option value="all">All statuses</option>
                  <option value="progress">In progress</option>
                  <option value="ok">Success</option>
                  <option value="pending">Waiting on data</option>
                  <option value="error">Error</option>
                </select>
              </div>
              <div className="pubfilter">
                <select className="vds-select" value={typeF} onChange={(e)=>setTypeF(e.target.value)} aria-label="Filter by type">
                  <option value="all">All types</option>
                  {RUNH_TYPES.map(t => <option key={t} value={t}>{t}</option>)}
                </select>
              </div>
              <div className="filter" style={{width:220}}><span className="s-icon"><Icon name="search" size={16} /></span>
                <input className="vds-input" placeholder="Filter by name…" aria-label="Filter by name" value={query} onChange={(e)=>setQuery(e.target.value)} />
              </div>
            </div>
          </div>

          {rows.length === 0 ? (
            <div className="vds-alert vds-alert--info proto-note">{allRows.length === 0 ? (<>No runs recorded yet. Go to the <strong>Automations</strong> tab and use <strong>Run now</strong> — each run adds rows here.</>) : "No runs match the current filters."}</div>
          ) : (
            <div className="vds-table-container">
              <div className="thead" style={{gridTemplateColumns:"52px 1.6fr 1.1fr 1.3fr 1.3fr 0.9fr"}}>
                <div className="th"></div>
                <div className="th">Name</div>
                <div className="th">Type</div>
                <div className="th">Started</div>
                <div className="th">Finished</div>
                <div className="th">Duration</div>
              </div>
              <div className="tbody">
                {rows.map(r => {
                  const meta = runStatusMeta(r.run.status);
                  return (
                    <div className="trow runh-row" style={{gridTemplateColumns:"52px 1.6fr 1.1fr 1.3fr 1.3fr 0.9fr"}} key={r.key} onClick={()=>setOpenKey(r.key)}>
                      <div className="td"><span className={"run-status " + meta.cls} title={meta.label}><Icon name={meta.icon} size={15} /></span></div>
                      <div className="td td-name">{r.name}</div>
                      <div className="td"><button className="runh-type-link" onClick={(e)=>{ e.stopPropagation(); goToConfigurator(r); }}>{r.type}</button></div>
                      <div className="td">{fmtRunTs(r.run.startedTs)}</div>
                      <div className="td">{fmtRunTs(r.run.finishedTs)}</div>
                      <div className="td">{fmtDuration(r.run.startedTs, r.run.finishedTs)}</div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </>)}
      </div>
    </div>
  );
}

/* ---------------- App ---------------- */
function App(){
  const [collapsed, setCollapsed] = useState(false);
  const [activeId, setActiveId] = useState("datasources");
  const [openSections, setOpenSections] = useState({});
  const [creating, setCreating] = useState(false);
  const [sources, setSources] = useState([]);
  const [detailId, setDetailId] = useState(null);
  const [updatingId, setUpdatingId] = useState(null);
  const [connCreating, setConnCreating] = useState(false);
  const [connectors, setConnectors] = useState([]);
  const [connDetailId, setConnDetailId] = useState(null);
  const [connDetailStep, setConnDetailStep] = useState(null);
  const [automations, setAutomations] = useState([]);
  const [editingAutoId, setEditingAutoId] = useState(null);
  const [configuringId, setConfiguringId] = useState(null);
  const [pipelines, setPipelines] = useState([]);
  const [pipeCreating, setPipeCreating] = useState(false);
  const [pipeEditId, setPipeEditId] = useState(null);
  const [runs, setRuns] = useState([]);
  const [connectDataFor, setConnectDataFor] = useState(null); // { targetId, connId } while launching a preset "Connect data table" flow
  const toggleSection = (k) => setOpenSections(s => ({ ...s, [k]: s[k] === false ? true : false }));
  const goTo = (id) => { setCreating(false); setDetailId(null); setUpdatingId(null); setConnCreating(false); setConnDetailId(null); setConnDetailStep(null); setConfiguringId(null); setPipeCreating(false); setPipeEditId(null); setEditingAutoId(null); setConnectDataFor(null); setActiveId(id); };
  const updateSource = (id, patch) => setSources(ss => ss.map(s => s.id===id ? {...s, ...patch} : s));
  const deleteSource = (id) => { setSources(ss => ss.filter(s => s.id !== id)); setDetailId(d => d===id ? null : d); setUpdatingId(u => u===id ? null : u); setConfiguringId(c => c===id ? null : c); };
  const updateConnector = (id, patch) => {
    setConnectors(cs => cs.map(c => {
      if (c.id !== id) return c;
      const merged = { ...c, ...patch };
      return merged;
    }));
  };
  const deleteConnector = (id) => {
    setConnectors(cs => cs.filter(c => c.id !== id));
    setAutomations(as => as.filter(a => a.connectorId !== id));
    setConnDetailId(d => d===id ? null : d);
  };
  const openSource = (id) => { setConnCreating(false); setConnDetailId(null); setUpdatingId(null); setCreating(false); setActiveId("datasources"); setDetailId(id); };
  const openConnector = (id, startStep) => { setCreating(false); setDetailId(null); setUpdatingId(null); setConnCreating(false); setActiveId("dataconnectors"); setConnDetailId(id); setConnDetailStep(startStep || null); };
  const runAutomation = (autoIdArg) => {
    const s = automations.find(x => x.id === autoIdArg);
    if (!s) return;
    const runId = "run_" + Math.random().toString(36).slice(2,10);
    const startedTs = Date.now();
    setRuns(rs => [...rs, { id:runId, automationId: autoIdArg, status:"progress", startedTs, finishedTs:null, msg:null }]);
    setAutomations(as => as.map(x => x.id===autoIdArg ? { ...x, lastRunStatus:"progress",
      runList: [{ id:runId, at: startedTs, status:"running", durationMin:null, triggeredBy:"manual", message:null },
                ...(x.runList || [])] } : x));
    const delay = 1400 + Math.random()*1800;
    setTimeout(() => {
      const ts = Date.now();
      const stamp = new Date(ts).toLocaleString("en-US", { month:"short", day:"numeric", hour:"numeric", minute:"2-digit" });
      const conn = s.connectorId ? connectors.find(c => c.id === s.connectorId) : null;
      const connTmpl = conn ? CONNECTOR_TEMPLATES[conn.connectorId] : null;
      const isScriptConn = !!(connTmpl && connTmpl.kind === "script");
      const isS3Conn = !!(connTmpl && connTmpl.kind === "s3");
      const isInboxConn = !!(connTmpl && connTmpl.kind === "inbox");
      const outcome = isScriptConn ? simulateScriptRunOutcome() : simulateRunOutcome();
      setRuns(rs => rs.map(r => r.id===runId ? { ...r, status: outcome.status, finishedTs: ts, msg: outcome.msg || null } : r));
      setAutomations(as => as.map(x => x.id===autoIdArg
        ? { ...x, lastRunStatus: outcome.status, lastRunAt: todayISO(), lastRunBy: CURRENT_USER,
            runList: (x.runList || []).map(r => r.id === runId
              ? { ...r, status: outcome.status === "pending" ? "warn" : outcome.status,
                  durationMin: Math.max(1, Math.round((ts - startedTs)/60000)), message: outcome.msg || null }
              : r) } : x));
      if (conn){
        setConnectors(cs => cs.map(c => c.id===conn.id ? {
          ...c, lastRunStatus: outcome.status, lastRunError: outcome.status !== "ok" ? outcome.msg : null,
          ...(outcome.status === "ok" ? { lastRun: stamp, lastChecked:"Just now" } : {}),
        } : c));
      }
      if (outcome.status === "ok"){
        if (conn){
          if (isScriptConn){
            const [pId, cId] = conn.dataSourceIds || [];
            setSources(ss => {
              const parentSrc = ss.find(x => x.id === pId), childSrc = ss.find(x => x.id === cId);
              if (!parentSrc || !childSrc) return ss;
              const { parent, child } = simulateScriptRun(parentSrc, childSrc);
              return ss.map(x => x.id===pId ? parent : x.id===cId ? child : x);
            });
          } else if (isS3Conn){
            const extra = s3SimulateNewFileArrival(conn);
            const baseFiles = s3DiscoveredFiles(conn.creds);
            const allFiles = extra ? baseFiles.concat([extra]) : baseFiles;
            const ids = new Set(conn.dataSourceIds || []);
            // Each Data is processed independently — one failing wouldn't block the others.
            setSources(ss => ss.map(src => ids.has(src.id) ? simulateS3Ingest(src, allFiles) : src));
          } else if (isInboxConn){
            const [pId, cId] = conn.dataSourceIds || [];
            let receivedAt = null;
            setSources(ss => {
              const parentSrc = ss.find(x => x.id === pId), childSrc = ss.find(x => x.id === cId);
              if (!parentSrc || !childSrc) return ss;
              const result = simulateEmailIngest(parentSrc, childSrc);
              receivedAt = result.receivedAt;
              return ss.map(x => x.id===pId ? result.parent : x.id===cId ? result.child : x);
            });
            setConnectors(cs => cs.map(c => c.id===conn.id ? { ...c, lastReceived: receivedAt || c.lastReceived, messageCount: (c.messageCount || 0) + 1 } : c));
          } else {
            const ids = new Set(conn.dataSourceIds || []);
            setSources(ss => ss.map(src => (ids.has(src.id) && src.configured !== false) ? simulateSource(src) : src));
          }
        } else if (s.pipelineId){
          const pipe = pipelines.find(p => p.id === s.pipelineId);
          if (pipe && pipe.typeId === "transform"){
            const inputId = pipe.sourceId;
            const outputId = (pipe.outputSourceIds || [])[0];
            if (outputId){
              setSources(ss => {
                const inputSrc = ss.find(x => x.id === inputId);
                if (!inputSrc) return ss;
                const exec = runTransform(inputSrc, pipe.steps || [], ss);
                return ss.map(x => x.id === outputId ? { ...x,
                  columns: buildColConfig(exec.columns, exec.typeByCol),
                  parsed: { fileName: x.name, columns: exec.columns, typeByCol: exec.typeByCol, rows: exec.rows },
                  recordCount: exec.rows.length, records: exec.rows.length.toLocaleString("en-US"),
                  status: exec.rows.length ? "Ready" : "Waiting for data", lastSynced: "Just now" } : x);
              });
            }
          } else if (pipe && (pipe.typeId === "embed" || pipe.typeId === "smart")){
            const inputId = pipe.sourceId;
            const outputId = (pipe.outputSourceIds || [])[0];
            if (outputId){
              setSources(ss => {
                const inputSrc = ss.find(x => x.id === inputId);
                if (!inputSrc) return ss;
                const patch = pipe.typeId === "smart"
                  ? applySmartGroups(inputSrc, pipe.textColumns || [], pipe.outputColumn || "smart_groups")
                  : applyEmbeddings(inputSrc, pipe.textColumns || [], pipe.outputColumn || "vector_embedding");
                return ss.map(x => x.id === outputId ? { ...x,
                  columns: patch.columns,
                  parsed: { ...(patch.parsed || {}), fileName: x.name },
                  recordCount: patch.recordCount, records: patch.records,
                  status: patch.recordCount ? "Ready" : "Waiting for data", lastSynced: "Just now" } : x);
              });
            }
          } else if (pipe && pipe.typeId === "directive"){
            const dir = DIRECTIVES.find(d => d.id === pipe.directiveId);
            const inputId = (pipe.inputSourceIds || [])[0];
            const outputId = (pipe.outputSourceIds || [])[0];
            if (outputId){
              setSources(ss => {
                const inputSrc = ss.find(x => x.id === inputId);
                const out = runDirectiveOutput(inputSrc, dir);
                return ss.map(x => x.id === outputId ? { ...x,
                  columns: buildColConfig(out.columns, out.typeByCol),
                  parsed: { fileName: x.name, columns: out.columns, typeByCol: out.typeByCol, rows: out.rows },
                  recordCount: out.rows.length, records: out.rows.length.toLocaleString("en-US"),
                  status: out.rows.length ? "Ready" : "Waiting for data", lastSynced: "Just now" } : x);
              });
            }
          }
          setPipelines(ps => ps.map(p => p.id===s.pipelineId ? { ...p, lastRun: stamp } : p));
        }
      }
    }, delay);
  };
  const deleteAutomation = (id) => setAutomations(as => as.filter(a => a.id !== id));
  const syncConnectorAutomation = (inst, lookupName, removedIds) => setAutomations(as => {
    if (inst.noSchedule) return as.filter(a => a.connectorId !== inst.id);
    const ids = (inst.dataSourceIds || []).filter(id => !(removedIds || []).includes(id));
    const names = ids.map(id => lookupName(id)).filter(Boolean);
    const label = names.length === 1 ? names[0] : inst.name;
    const actions = (names.length ? names : [inst.name]).map(n => ({ ...newAutomationAction("import_table"), refName:n }));
    if (!as.some(a => a.connectorId === inst.id)) return [automationFromConnector(inst, inst.automationTrigger, ids, lookupName), ...as];
    return as.map(a => a.connectorId === inst.id
      ? { ...a, name:"Sync " + label, steps:a.steps.map((st,i) => i===0
          ? { ...st, name:"Sync from " + inst.name, ...(inst.automationTrigger ? { trigger:inst.automationTrigger } : {}), actions } : st) }
      : a);
  });
  const upsertAutomation = (auto) => setAutomations(as => as.some(a => a.id===auto.id) ? as.map(a => a.id===auto.id ? auto : a) : [auto, ...as]);
  const openPipeline = (id) => { setCreating(false); setDetailId(null); setUpdatingId(null); setConnCreating(false); setConnDetailId(null); setConfiguringId(null); setPipeCreating(false); setActiveId("datapipelines"); setPipeEditId(id); };
  const deletePipeline = (id) => { setPipelines(ps => ps.filter(p => p.id !== id)); setAutomations(as => as.filter(a => a.pipelineId !== id)); setPipeEditId(e => e===id ? null : e); };

  const editingAuto = automations.find(a => a.id === editingAutoId);
  const cfg = HUB_PAGE[activeId];
  const item = ALL_ITEMS.find(i => i.id === activeId) || { label:"Help" };
  const selected = sources.find(s => s.id === detailId);
  const updating = sources.find(s => s.id === updatingId);
  const connDetail = connectors.find(c => c.id === connDetailId);

  const configuringSource = sources.find(s => s.id === configuringId);

  let page;
  if (connectDataFor){
    const reuseInstance = connectDataFor.instanceId ? connectors.find(c => c.id === connectDataFor.instanceId) : null;
    page = <NewConnector existingSources={sources} existingConnectors={connectors}
      editInstance={reuseInstance}
      presetConnectorId={connectDataFor.connId} presetTargetSourceId={connectDataFor.targetId}
      onCancel={() => { const id = connectDataFor.targetId; setConnectDataFor(null); openSource(id); }}
      onCreate={(inst, dsRecords, sourceUpdates) => {
        setSources(s => {
          let next = mergeSourceRecords(s, dsRecords);
          (sourceUpdates||[]).forEach(su => { next = next.map(x => x.id===su.id ? { ...x, ...su.patch } : x); });
          return next;
        });
        setConnectors(c => [inst, ...c]);
        if (!inst.noSchedule) setAutomations(as => [automationFromConnector(inst, inst.automationTrigger, inst.dataSourceIds, (id)=>(dsRecords.find(r=>r.id===id)||{}).name), ...as]);
        const id = connectDataFor.targetId;
        setConnectDataFor(null);
        openSource(id);
      }}
      onSave={(updated, { newRecords, deleteIds, sourceUpdates }) => {
        setSources(s => {
          let next = mergeSourceRecords(s.filter(x => !(deleteIds||[]).includes(x.id)), newRecords||[]);
          (sourceUpdates||[]).forEach(su => { next = next.map(x => x.id===su.id ? { ...x, ...su.patch } : x); });
          return next;
        });
        setConnectors(cs => cs.map(c => c.id===updated.id ? updated : c));
        syncConnectorAutomation(updated, (id) => {
          const src = (newRecords||[]).find(r=>r.id===id) || sources.find(x=>x.id===id);
          return src && src.name;
        }, deleteIds);
        const id = connectDataFor.targetId;
        setConnectDataFor(null);
        openSource(id);
      }} />;
  } else if (activeId === "datasources" && configuringId && configuringSource){
    page = <ConfigureSource source={configuringSource}
      title="Configure Data Table"
      sub={"Set column parameters for this table. It stays inactive until it is configured."}
      submitLabel="Save configuration"
      onCancel={() => setConfiguringId(null)}
      onSave={(patch) => { updateSource(configuringId, patch); setConfiguringId(null); }} />;
  } else if (activeId === "datasources" && detailId && selected){
    page = <DataSourceDetails source={selected} allSources={sources} connectors={connectors} automations={automations} onBack={() => setDetailId(null)} onUpdate={updateSource}
      onConnectData={(connId, instanceId) => setConnectDataFor({ targetId: selected.id, connId, instanceId })} />;
  } else if (activeId === "datasources" && updatingId && updating){
    page = <UpdateDataSource source={updating} onCancel={() => setUpdatingId(null)} onDone={() => setUpdatingId(null)} onUpdate={updateSource} />;
  } else if (activeId === "datasources" && creating){
    page = <NewDataSource onCancel={() => setCreating(false)} onCreate={(rec) => { setSources(s => [rec, ...s]); setCreating(false); }} />;
  } else if (activeId === "dataconnectors" && connDetailId && connDetail){
    page = <NewConnector editInstance={connDetail} existingSources={sources} existingConnectors={connectors} onOpenSource={openSource} initialStep={connDetailStep} onCancel={() => setConnDetailId(null)}
      onSave={(updated, { newRecords, deleteIds, sourceUpdates }) => {
        setSources(s => {
          let next = mergeSourceRecords(s.filter(x => !(deleteIds||[]).includes(x.id)), newRecords||[]);
          (sourceUpdates||[]).forEach(su => { next = next.map(x => x.id===su.id ? { ...x, ...su.patch } : x); });
          return next;
        });
        setConnectors(cs => cs.map(c => c.id===updated.id ? updated : c));
        syncConnectorAutomation(updated, (id) => {
          const src = (newRecords||[]).find(r=>r.id===id) || sources.find(x=>x.id===id);
          return src && src.name;
        }, deleteIds);
        setConnDetailId(null);
      }} />;
  } else if (activeId === "dataconnectors" && connCreating){
    page = <NewConnector existingSources={sources} existingConnectors={connectors} onCancel={() => setConnCreating(false)} onCreate={(inst, dsRecords, sourceUpdates) => {
      setSources(s => {
        let next = mergeSourceRecords(s, dsRecords);
        (sourceUpdates||[]).forEach(su => { next = next.map(x => x.id===su.id ? { ...x, ...su.patch } : x); });
        return next;
      });
      setConnectors(c => [inst, ...c]);
      if (!inst.noSchedule) setAutomations(as => [automationFromConnector(inst, inst.automationTrigger, inst.dataSourceIds, (id)=>(dsRecords.find(r=>r.id===id)||{}).name), ...as]);
      setConnCreating(false);
    }} />;
  } else if (activeId === "datapipelines" && pipeEditId){
    const editing = pipelines.find(p => p.id === pipeEditId);
    page = editing
      ? <NewPipeline editInstance={editing} sources={sources} pipelines={pipelines} onCancel={() => setPipeEditId(null)}
          onSave={(updated, outSrc, migrate) => {
            setPipelines(ps => ps.map(p => p.id===updated.id ? updated : p));
            setSources(s => {
              let next = s;
              if (outSrc) next = next.some(x=>x.id===outSrc.id) ? next.map(x=>x.id===outSrc.id?outSrc:x) : [outSrc, ...next];
              if (migrate) next = next.map(x => x.id===migrate.id ? { ...x, ...migrate.patch } : x);
              const outIds = new Set(updated.outputSourceIds || []);
              next = next.filter(x => !(x.fromPipeline && x.pipelineId === updated.id && !outIds.has(x.id)));
              return next;
            });
            setAutomations(as => {
              const has = as.some(a => a.pipelineId === updated.id);
              if (updated.automationTrigger){
                return has
                  ? as.map(a => a.pipelineId===updated.id ? { ...a, name:"Run " + updated.name,
                      steps:a.steps.map((st,i) => i===0
                        ? { ...st, name:"Run " + updated.name, trigger:updated.automationTrigger,
                            actions:[{ ...newAutomationAction("pipeline"), refName:updated.name }] }
                        : st) } : a)
                  : [automationFromPipeline(updated, updated.automationTrigger), ...as];
              }
              return has ? as.filter(a => a.pipelineId !== updated.id) : as;
            });
            setPipeEditId(null);
          }} />
      : <SimplePage item={item} />;
  } else if (activeId === "datapipelines" && pipeCreating){
    page = <NewPipeline sources={sources} pipelines={pipelines} onCancel={() => setPipeCreating(false)}
      onCreate={(pipe, outSrc, migrate) => {
        setPipelines(ps => [pipe, ...ps]);
        setSources(s => { let next = s; if (outSrc) next = [outSrc, ...next]; if (migrate) next = next.map(x => x.id===migrate.id ? { ...x, ...migrate.patch } : x); return next; });
        if (pipe.automationTrigger) setAutomations(as => [automationFromPipeline(pipe, pipe.automationTrigger), ...as]);
        setPipeCreating(false);
      }} />;
  } else if (activeId === "automations"){
    page = editingAuto
      ? <AutomationEditor automation={editingAuto} automations={automations} sources={sources} pipelines={pipelines}
          onCancel={() => setEditingAutoId(null)}
          onSave={(a) => { upsertAutomation(a); setEditingAutoId(null); }} />
      : <HubPage cfg={cfg} onNew={() => { const a = newAutomation(""); upsertAutomation(a); setEditingAutoId(a.id); }}
          onOpen={(id) => setEditingAutoId(id)} onDelete={deleteAutomation} onRunNow={runAutomation} records={automations} />;
  } else if (cfg){
    page = <HubPage cfg={cfg}
      onNew={activeId==="datasources" ? () => setCreating(true) : (activeId==="dataconnectors" ? () => setConnCreating(true) : (activeId==="datapipelines" ? () => setPipeCreating(true) : undefined))}
      onOpen={activeId==="datasources" ? (id) => setDetailId(id) : (activeId==="dataconnectors" ? (id) => { setConnDetailId(id); setConnDetailStep(null); } : (activeId==="datapipelines" ? openPipeline : (activeId==="schedules" ? editSchedule : undefined)))}
      onUpdate={activeId==="datasources" ? (id) => setUpdatingId(id) : undefined}
      onDelete={activeId==="datasources" ? deleteSource : (activeId==="dataconnectors" ? deleteConnector : (activeId==="datapipelines" ? deletePipeline : (activeId==="schedules" ? deleteSchedule : undefined)))}
      onOpenSource={(activeId==="dataconnectors" || activeId==="schedules") ? openSource : undefined}
      onRunNow={activeId==="schedules" ? runSchedule : undefined}
      onConfigure={activeId==="datasources" ? (id) => setConfiguringId(id) : undefined}
      onConnectData={activeId==="datasources" ? (id, connId, instanceId) => setConnectDataFor({ targetId:id, connId, instanceId }) : undefined}
      allConnectors={connectors}
      lookupSource={activeId==="dataconnectors" ? (id) => sources.find(s => s.id === id) : undefined}
      records={activeId==="datasources" ? sources : (activeId==="dataconnectors" ? connectors : (activeId==="datapipelines" ? pipelines : (activeId==="schedules" ? schedules : [])))} />;
  } else {
    page = <SimplePage item={item} />;
  }

  return (
    <div className="vds-page">
      <Sidebar collapsed={collapsed} setCollapsed={setCollapsed} activeId={activeId} setActiveId={goTo} openSections={openSections} toggleSection={toggleSection} />
      <div className="vds-shell-main">
        <TopBar />
        <main className="main" style={{flex:"1 1 auto",display:"flex",minWidth:0,minHeight:0}}>{page}</main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
