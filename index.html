  const toggle = (n) => setPicks(p => ({ ...p, [n]: !p[n] }));
  const requestToggleOff = (s, isExisting) => { if (isExisting) setConfirmRemove(s.name); else toggle(s.name); };
  const pickedList = tmpl.sources.filter(s => picks[s.name]);
  const anyPicked = pickedList.length > 0;
  const allPicked = tmpl.sources.every(s => picks[s.name]);
  const toggleAll = () => { const v = !allPicked; setPicks(Object.fromEntries(tmpl.sources.map(s => [s.name, v]))); };
  const fmtRecords = (n) => n.toLocaleString("en-US");
  const willDelete = tmpl.sources.filter(s => existingNames.includes(s.name) && !picks[s.name]);
  const auth = tmpl.auth;
  const requiresConfig = !!tmpl.requiresConfig;
  const isWarehouse = !!(conn && conn.group === "Data Warehouse");
  const setCred = (k, v) => setCreds(c => ({ ...c, [k]: v }));
  const successText = (auth.success || "Connection verified.").replace("{n}", tmpl.sources.length);
  const dsNamePreview = (s) => dsNameForSource(s, conn.id, !requiresConfig);
  return (
    <div className="vds-content">
      <PageHead title={(editing ? "Edit " : "Connect ") + conn.name} sub={tmpl.tagline} onCancel={onCancel} />
      <Stepper current={2} steps={CONNECTOR_STEPS} />

      <div className="form-grid">
        <div className="field">
          <label className="vds-label">Connector name</label>
          <input className={"vds-input" + (editing ? " locked" : "")} value={name} readOnly={editing}
            title={editing ? "The connection name can't be changed after it's configured" : undefined}
            onChange={(e)=>{ if (editing) return; setName(e.target.value); }} />
          <div className="vds-helper-text">{editing ? "Set when the connection was created — can't be changed." : "A label for this connection — you can create several instances of the same connector."}</div>
        </div>
      </div>

      <div className="vds-h4 proto-section-title">{auth.title}</div>
      <div className="vds-b2 proto-muted proto-section-note">{auth.note}</div>
      <div className="cred-grid">
        {auth.fields.map(f => (
          <div className={"field" + (f.half ? "" : " full")} key={f.key} style={{margin:0}}>
            <label className="vds-label">{f.label}{f.optional && <span className="opt"> (optional)</span>}</label>
            {f.textarea
              ? <textarea className="vds-textarea proto-key-area" placeholder={f.placeholder} value={creds[f.key] || ""} onChange={(e)=>setCred(f.key, e.target.value)} />
              : <input className="vds-input" placeholder={f.placeholder} value={creds[f.key] || ""} onChange={(e)=>setCred(f.key, e.target.value)} />}
          </div>
        ))}
      </div>
      <div className="test-row">
        <button className="vds-btn" style={{height:44}} onClick={()=>setVerified(true)}>Test integration</button>
        {verified && <span className="verify-inline"><Icon name="check" size={16} />{successText}</span>}
      </div>

      {verified && (<>
        {["samsara","geotab","snowflake"].includes(conn.id) ? (<>
          <div className="vds-h4 proto-section-title">{conn.name} Data</div>
          <div className="vds-b2 proto-muted proto-section-note">Raw tables available in {conn.name}. Click "Create data table" to bring one into Viaduct — nothing is created until you do.</div>
          <div className="vds-table-container">
            <div className="dscreate-head" style={{gridTemplateColumns:"1.4fr 1fr 180px"}}>
              <div className="dscreate-h">Table name</div>
              <div className="dscreate-h">Count</div>
              <div className="dscreate-h">Action</div>
            </div>
            {tmpl.sources.map(s => {
              const isExisting = editing && existingNames.includes(s.name);
              const picked = !!picks[s.name];
              return (
                <div className="dscreate-row" style={{gridTemplateColumns:"1.4fr 1fr 180px"}} key={s.name}>
                  <span className="dscreate-name">{s.name}</span>
                  <span className="dscreate-num">{fmtRecords(s.records)}</span>
                  <span>
                    {picked ? (
                      <span className="dscreate-kind" style={{display:"inline-flex",alignItems:"center",gap:10}}>
                        <span style={{display:"inline-flex",alignItems:"center",gap:5}}><Icon name="check" size={14} />Added</span>
                        {!isExisting && <button className="vds-btn vds-btn--sm proto-cfg-btn subtle" onClick={()=>requestToggleOff(s, isExisting)}>Remove</button>}
                      </span>
                    ) : (
                      <button className="vds-btn vds-btn--sm proto-cfg-btn" onClick={()=>toggle(s.name)}>Create data table</button>
                    )}
                  </span>
                </div>
              );
            })}
          </div>

          <div className="vds-h4 proto-section-title" style={{marginTop:32}}>Viaduct data tables</div>
          <div className="vds-b2 proto-muted proto-section-note">Populated only by tables you've explicitly created above.{requiresConfig ? " Each needs its column parameters configured before it becomes active." : " Optionally configure one to rename its columns or filter which records are imported."}</div>
          {!anyPicked ? (
            <div className="vds-alert vds-alert--info proto-note proto-plain-note">No data created yet — click "Create data table" above to create one.</div>
          ) : (
            <div className="vds-table-container has-actions">
              <div className="dscreate-head" style={{gridTemplateColumns:"1.2fr 1.2fr 0.7fr 0.8fr 190px"}}>
                <div className="dscreate-h">Data table name</div>
                <div className="dscreate-h">{conn.name} origin table</div>
                <div className="dscreate-h">Type</div>
                <div className="dscreate-h">Count</div>
                <div className="dscreate-h">Actions</div>
              </div>
              {pickedList.map(s => {
                const isExisting = editing && existingNames.includes(s.name);
                const popCfg = configs[s.name] && configs[s.name].populatedExisting ? configs[s.name] : null;
                return (
                  <div className="dscreate-row" style={{gridTemplateColumns:"1.2fr 1.2fr 0.7fr 0.8fr 190px"}} key={s.name}>
                    <span className="dscreate-meta">
                      {popCfg
                        ? <button className="proto-name-link dscreate-name" onClick={()=>onOpenExisting && onOpenExisting(s.name)}>{popCfg.name}</button>
                        : isExisting
                        ? <button className="proto-name-link dscreate-name" onClick={()=>onOpenExisting && onOpenExisting(s.name)}>{dsNamePreview(s)}</button>
                        : <span className="dscreate-name">{dsNamePreview(s)}</span>}
                      {popCfg && <span className="dscreate-kind">Populates existing data table table</span>}
                      {!popCfg && isExisting && <span className="dscreate-kind">Created · view data table table</span>}
                    </span>
                    <span className="dscreate-num">{s.name}</span>
                    <span className="vds-chip vds-chip--sm">{s.type}</span>
                    <span className="dscreate-num">{fmtRecords(s.records)}</span>
                    <span style={{display:"flex", gap:6}}>
                      <button className="vds-btn vds-btn--sm proto-cfg-btn" onClick={()=>onConfigure && onConfigure(s.name)}>{popCfg ? "Edit mapping" : "Configure"}</button>
                      {!isExisting && <button className="vds-icon-btn vds-icon-btn--sm" title="Remove" onClick={()=>requestToggleOff(s, isExisting)}><Icon name="x" size={15} /></button>}
                    </span>
                  </div>
                );
              })}
            </div>
          )}
        </>) : (<>
        <div className="vds-h4 proto-section-title">{tmpl.dsHeader || "Data tables created"}</div>
        <div className="vds-b2 proto-muted proto-section-note">{tmpl.dsNote || ("Connecting " + conn.name + " will create the following data tables. Choose which to include:")}{requiresConfig ? " Each table needs its column parameters configured before it becomes active — configure it now or later from the Data Tables page." : " These data tables are ready to use as-is. Optionally configure one to rename its columns or filter which records are imported."}</div>
        <div className="vds-table-container has-actions">
          <div className="dscreate-head">
            <div className="cg-box cg-first"><input className="vds-checkbox" type="checkbox" checked={allPicked} onChange={toggleAll} aria-label={allPicked ? "Deselect all" : "Select all"} /></div>
            <div className="dscreate-h">Data table</div>
            <div className="dscreate-h">Origin</div>
            <div className="dscreate-h">Type</div>
            <div className="dscreate-h">Number of records</div>
            <div className="dscreate-h">Actions</div>
          </div>
          {tmpl.sources.map(s => {
            const isExisting = editing && existingNames.includes(s.name);
            const popCfg = configs[s.name] && configs[s.name].populatedExisting ? configs[s.name] : null;
            return (
            <div className="dscreate-row" key={s.name}>
              <div className="cg-box cg-first"><input className="vds-checkbox" type="checkbox" checked={!!picks[s.name]}
                onChange={()=>{ if (picks[s.name]) requestToggleOff(s, isExisting); else toggle(s.name); }} aria-label={"Create " + s.name} /></div>
              <span className="dscreate-meta">
                {popCfg
                  ? <button className="proto-name-link dscreate-name" onClick={()=>onOpenExisting && onOpenExisting(s.name)}>{popCfg.name}</button>
                  : isExisting
                  ? <button className="proto-name-link dscreate-name" onClick={()=>onOpenExisting && onOpenExisting(s.name)}>{dsNamePreview(s)}</button>
                  : <span className="dscreate-name">{dsNamePreview(s)}</span>}
                {popCfg && <span className="dscreate-kind">Populates existing data table table</span>}
                {!popCfg && isExisting && <span className="dscreate-kind">Created · view data table table</span>}
              </span>
              <span className="dscreate-num">{s.name}</span>
              <span className="vds-chip vds-chip--sm">{s.type}</span>
              <span className="dscreate-num">{fmtRecords(s.records)}</span>
              <span>
                {picks[s.name] && !isExisting && (
                  <button className="vds-btn vds-btn--sm proto-cfg-btn" onClick={()=>onConfigure && onConfigure(s.name)}>{popCfg ? "Edit mapping" : "Configure"}</button>
                )}
              </span>
            </div>
          );})}
        </div>
        </>)}

        {willDelete.length > 0 && (
          <div className="vds-alert vds-alert--error proto-note">
            <b>Heads up:</b> deselecting {willDelete.length === 1 ? "this data table" : "these data tables"} will <b>permanently delete</b> {willDelete.map(s => s.name).join(", ")} and any data {willDelete.length === 1 ? "it has" : "they have"} synced when you save.
          </div>
        )}
      </>)}

      {confirmRemove && (
        <ConfirmDialog
          title="Remove this data table?"
          body="This will remove the data table from the connector."
          confirmLabel="Remove" cancelLabel="Cancel" danger
          onConfirm={()=>{ toggle(confirmRemove); setConfirmRemove(null); }}
          onCancel={()=>setConfirmRemove(null)}
        />
      )}

      <div className="wiz-footer">
        <button className="vds-btn" onClick={onBack}><Icon name="arrowLeft" size={17} />Back</button>
        <button className="vds-btn vds-btn--primary" disabled={!verified || (!editing && !anyPicked)} onClick={onContinue}>Continue<Icon name="arrowRight" size={17} /></button>
      </div>
    </div>
  );
}
function ScheduleStep({ conn, sched, setSched, editing, onCancel, onBack, onCreate }){
  const set = (patch) => setSched(s => ({ ...s, ...patch }));
  return (
    <div className="vds-content">
      <PageHead title={(editing ? "Edit " : "Connect ") + conn.name} sub={"Origin: Connectors · " + conn.name} onCancel={onCancel} />
      <Stepper current={3} steps={CONNECTOR_STEPS} />
      <div className="vds-h4 proto-section-title">Automate</div>
      <div className="vds-b2 proto-muted proto-section-note">Choose the trigger for the automation this creates. Viaduct keeps the data tables current by running it.</div>
      <AutomateTriggerFields trigger={sched} setTrigger={setSched} allowEvent={false} />

      <div className="wiz-footer">
        <button className="vds-btn" onClick={onBack}><Icon name="arrowLeft" size={17} />Back</button>
        <button className="vds-btn vds-btn--primary" onClick={onCreate}><Icon name="check" size={17} />{editing ? "Save changes" : "Create"}</button>
      </div>
    </div>
  );
}
/* ---------------- Samsara connector: 3 distinct pages (Authenticate / Choose Data / Schedule) ---------------- */
const CONNECTOR_WIZARD_STEPS = [{n:1,label:"Select connection"},{n:2,label:"Set up connection"},{n:3,label:"Set up data table"},{n:4,label:"Automate"}];

function ApiConnectorFlow({ conn, tmpl, editing, editInstance, existingSources=[], existingConnectors=[], onOpenSource, onCancel, onBackToConnectors, onCreate, onSave, presetTargetId }){
  const { useState } = React;
  const editExisting = editing ? (editInstance.dataSourceIds || []).map(id => existingSources.find(s => s.id === id)).filter(Boolean) : [];
  const existingByName = {}; editExisting.forEach(ds => { existingByName[ds.templateSourceKey || ds.name] = ds; });
  const existingNames = editing ? tmpl.sources.filter(s => existingByName[s.name]).map(s => s.name) : [];
  const openExisting = (srcName) => { const ds = existingByName[srcName]; if (ds && onOpenSource) onOpenSource(ds.id); };
  const presetTarget = presetTargetId ? existingSources.find(s => s.id === presetTargetId) : null;

  const [page, setPage] = useState(editing ? "data" : "auth"); // auth -> data -> backfill -> schedule
  const [name, setName] = useState(editing ? editInstance.name : conn.name);
  const [apiKey, setApiKey] = useState(editing ? ((editInstance.creds && editInstance.creds.apiKey) || "") : "");
  const [testing, setTesting] = useState(false);
  // "Start with only the first table being checked" — every other source begins unpicked.
  const [picks, setPicks] = useState(() => editing
    ? Object.fromEntries(tmpl.sources.map(s => [s.name, !!existingByName[s.name]]))
    : Object.fromEntries(tmpl.sources.map((s, i) => [s.name, i === 0])));
  const [configs, setConfigs] = useState({}); // source name -> "Customize" patch (column names + filters)
  const [configuring, setConfiguring] = useState(null);
  const [configuringOpenCol, setConfiguringOpenCol] = useState(null); // auto-expand this column's filter in Customize
  const [sched, setSched] = useState(() => (editing && editInstance.automationTrigger) || newWizardTrigger());
  const [confirmRemove, setConfirmRemove] = useState(null);

  const nameTaken = (n) => (existingConnectors || []).some(c => c.name.trim().toLowerCase() === n.trim().toLowerCase() && (!editing || c.id !== editInstance.id));
  const nameError = !editing && name.trim() && nameTaken(name) ? "A connection with this name already exists — choose a unique name." : (!name.trim() ? "" : "");

  const toggle = (n) => setPicks(p => ({ ...p, [n]: !p[n] }));
  const requestToggleOff = (s) => { if (existingNames.includes(s.name)) setConfirmRemove(s.name); else toggle(s.name); };
  const pickedList = tmpl.sources.filter(s => picks[s.name]);
  const dsNamePreview = (s) => dsNameForSource(s, conn.id, true);
  const fmtRecords = (n) => n.toLocaleString("en-US");
  const fmtDateSlash = (iso) => { const d = new Date(iso); if (isNaN(d)) return iso; return String(d.getMonth()+1).padStart(2,"0") + "/" + String(d.getDate()).padStart(2,"0") + "/" + d.getFullYear(); };
  // Record counts aren't reliably available for these sources before a sync — show the data range
  // (what will be backfilled) instead. Only Event-type sources have a natural timestamp to backfill from.
  const dataRangeLabel = (s) => {
    const bfCol = backfillColFor(s);
    if (!bfCol) return "All time";
    const cfg = configs[s.name];
    if (cfg && cfg.columns){
      const col = cfg.columns.find(c => c.name === bfCol);
      if (col && col.filter && col.filter.op === ">" && col.filter.values && col.filter.values[0]) return "After " + fmtDateSlash(col.filter.values[0]);
      return "All time"; // customized, but the backfill filter was cleared
    }
    return "After " + fmtDateSlash(s.firstDate);
  };
  // If a customization added an active filter, the destination holds fewer rows than the raw source
  // — estimate how many by applying that filter to the source's sample rows and scaling the real count.
  const estimatedRecordCount = (s) => {
    const cfg = configs[s.name];
    if (!cfg || !cfg.columns || !cfg.columns.some(colFilterActive)) return s.records;
    const sample = connectorDataSourceRecord(name || conn.name, s, { connId: conn.id, rawPrefix:true }).parsed.previewRows || [];
    if (!sample.length) return s.records;
    const kept = applyColumnFilters(sample, cfg.columns);
    return Math.max(0, Math.round(s.records * (kept.length / sample.length)));
  };

  const backfillColFor = (s) => { const dt = (s.cols || []).find(c => c[1] === "date" || c[1] === "datetime"); return dt ? dt[0] : null; };
  const buildRecord = (s, instId) => {
    let rec = { ...connectorDataSourceRecord(name || conn.name, s, { connId: conn.id, rawPrefix:true }), connectorInstanceId: instId, lastSynced:"Not synced yet", templateSourceKey: s.name };
    rec.startDate = s.firstDate;
    const cfg = configs[s.name];
    if (cfg){ rec = { ...rec, ...cfg, configured:true }; }
    else {
      // Not customized — the backfill date defaults to the resource's standard start date until the
      // user opens Customize and changes the timestamp column's filter.
      const bfCol = backfillColFor(s);
      if (bfCol && rec.columns) rec.columns = rec.columns.map(c => c.name === bfCol ? { ...c, filter: { op:">", values:[s.firstDate] } } : c);
      rec.configured = true;
    }
    return rec;
  };

  // "Customize" — column names and filters only. Type, keys, and add/remove are fixed by the connector's API.
  // If a preset target is active (reached via a Data's Connections tab "Add connection"), this table
  // maps directly onto that existing Data instead of being customized/created fresh.
  if (configuring){
    const s = tmpl.sources.find(x => x.name === configuring);
    const base = connectorDataSourceRecord(name || conn.name, s, { connId: conn.id, rawPrefix:true });
    const opinionatedWrite = s.type === "Event" ? "Append" : "Update";
    const draft = configs[configuring] ? { ...base, ...configs[configuring] } : { ...base, writeMode: opinionatedWrite };

    if (presetTarget){
      const chosenIncoming = (draft.columns || []).filter(c => c.imp !== false).map(c => [c.name, c.type]);
      return <ColumnMappingStep targetSource={presetTarget} fromLabel={s.name} incomingCols={chosenIncoming}
        onCancel={()=>setConfiguring(null)} onBack={()=>setConfiguring(null)}
        onSave={({ columnMapping, rowFilters, writeMode }) => {
          setConfigs(c => ({ ...c, [configuring]: { ...presetTarget, columnMapping, rowFilters, writeMode, populatedExisting:true, origin: name || conn.name } }));
          setConfiguring(null);
        }} />;
    }

    return <ConfigureSource source={draft}
      title="Customize Data Table"
      sub={"This is customize ingestion — the data table name and filters can be changed here, but column names, type, and key options are fixed by " + conn.name + "'s API. (File-based sources allow customizing more.)"}
      submitLabel="Save customization"
      lockName={false} lockedKeys={ALL_OPTION_KEYS} lockColType={true} noRenameRemove={true} forceNameEditable={true} allowAddColumns={false}
      writeModeLocked={true} writeModeReadOnly={opinionatedWrite === "Append" ? "Append — new rows only, no deletion (event data)" : "Update — upsert on primary key (table data)"}
      originalNameLabel={conn.name} showRelationsTab={false}
      initialOpenFilterCol={configuringOpenCol}
      onCancel={()=>{ setConfiguring(null); setConfiguringOpenCol(null); }}
      onSave={(patch)=>{ setConfigs(c => ({ ...c, [configuring]: patch })); setConfiguring(null); setConfiguringOpenCol(null); }} />;
  }

  // ---- Page 1: Authenticate ----
  if (page === "auth"){
    const canContinue = !!name.trim() && !nameError && !!apiKey.trim();
    return (
      <div className="vds-content">
        <PageHead title={"Set up " + conn.name + " connection"} sub={tmpl.tagline} onCancel={onCancel} />
        <Stepper current={2} steps={CONNECTOR_WIZARD_STEPS} />
        <div className="form-grid">
          <div className="field">
            <label className="vds-label">Connection name</label>
            <input className={"vds-input" + (nameError ? " err" : "")} value={name} onChange={(e)=>setName(e.target.value)} />
            {nameError ? <div className="vds-helper-text vds-helper-text--error">{nameError}</div> : <div className="vds-helper-text">A unique label for this connection — you can create several instances of the same connector.</div>}
          </div>
        </div>
        <div className="vds-h4 proto-section-title">{tmpl.auth.title}</div>
        <div className="vds-b2 proto-muted proto-section-note">{tmpl.auth.note}</div>
        {!editing && <div style={{marginBottom:12}}><CopyCredsButton existingConnectors={existingConnectors} connId={conn.id} onCopy={(copied)=>setApiKey(copied.apiKey || "")} /></div>}
        <div className="form-grid">
          <div className="field">
            <input className="vds-input" placeholder="Paste your API key" value={apiKey} onChange={(e)=>setApiKey(e.target.value)} />
          </div>
        </div>
        <div className="wiz-footer">
          <button className="vds-btn" onClick={onBackToConnectors}><Icon name="arrowLeft" size={17} />Back</button>
          <button className="vds-btn vds-btn--primary" disabled={!canContinue || testing}
            onClick={()=>{ setTesting(true); setTimeout(()=>{ setTesting(false); setPage("data"); }, 700); }}>
            {testing ? "Testing connection…" : (<>Continue<Icon name="arrowRight" size={17} /></>)}
          </button>
        </div>
      </div>
    );
  }

  // ---- Page 2: Choose Data — two tables side by side, connected by an arrow per checked row.
  // Rendered as a single 7-column CSS grid (samsara name/count, arrow, viaduct name/type/count/action)
  // so every visual row — headers, source rows, and the arrow between them — shares one real grid
  // row and can never drift out of alignment, even when a row's content wraps to two lines.
  if (page === "data"){
    const lastIdx = tmpl.sources.length - 1;
    return (
      <div className="vds-content">
        <PageHead title={"Set up " + conn.name + " connection"} sub={"Choose which " + conn.name + " tables become Viaduct data tables."} onCancel={onCancel} />
        <Stepper current={3} steps={CONNECTOR_WIZARD_STEPS} />
        <div className="sbs-wrap">
          <div className="sbs-title samsara">{conn.name} Data</div>
          <div className="sbs-title arrowcol"></div>
          <div className="sbs-title viaduct">Viaduct data table</div>

          <div className="sbs-colhead samsara-r">{conn.name} source</div>
          <div className="sbs-colhead"></div>
          <div className="sbs-colhead viaduct-l">Destination data table</div>
          <div className="sbs-colhead">Type</div>
          <div className="sbs-colhead">Data Range</div>
          <div className="sbs-colhead">Action</div>

          {tmpl.sources.map((s, i) => {
            const picked = !!picks[s.name];
            const customized = !!configs[s.name];
            const isExisting = existingNames.includes(s.name);
            const last = i === lastIdx ? " lastrow" : "";
            return (
              <React.Fragment key={s.name}>
                <div className={"sbs-cell samsara-r" + last}>
                  <label className="sbs-src">
                    <input type="checkbox" className="vds-checkbox" checked={picked} onChange={()=>requestToggleOff(s)} />
                    {s.name}
                  </label>
                </div>
                <div className={"sbs-cell" + last} style={{justifyContent:"center"}}>
                  <span className={"sbs-arrow-cell" + (picked ? " on" : "")}>{picked && <Icon name="arrowRight" size={18} />}</span>
                </div>
                {picked ? (<>
                  <div className={"sbs-cell viaduct-l" + last}>
                    <div className="sbs-dest">
                      {presetTarget
                        ? <button className="proto-name-link sbs-dest-name" onClick={()=>onOpenSource && onOpenSource(presetTarget.id)}>{presetTarget.name}</button>
                        : isExisting
                        ? <button className="proto-name-link sbs-dest-name" onClick={()=>openExisting(s.name)}>{dsNamePreview(s)}</button>
                        : <span className="sbs-dest-name">{dsNamePreview(s)}</span>}
                    </div>
                  </div>
                  <div className={"sbs-cell viaduct-bg" + last}><span className="vds-chip vds-chip--sm">{s.type}</span></div>
                  <div className={"sbs-cell viaduct-bg" + last}>
                    {presetTarget
                      ? <span className="sbs-num">—</span>
                      : customized
                      ? <button type="button" className="proto-name-link sbs-num" onClick={()=>{ setConfiguring(s.name); setConfiguringOpenCol(backfillColFor(s)); }}>{dataRangeLabel(s)}</button>
                      : <span className="sbs-num">{dataRangeLabel(s)}</span>}
                  </div>
                  <div className={"sbs-cell viaduct-bg" + last}>
                    <button className={"vds-btn vds-btn--sm proto-cfg-btn subtle" + (customized ? " on" : "")} onClick={()=>{ setConfiguring(s.name); setConfiguringOpenCol(null); }}>
                      {presetTarget ? "Map columns" : (customized ? (<><Icon name="sparkles" size={12} />Customized</>) : "Customize")}
                    </button>
                  </div>
                </>) : (
                  <div className={"sbs-cell viaduct-l" + last} style={{gridColumn:"3 / 7"}}><span className="sbs-empty-row">Not included</span></div>
                )}
              </React.Fragment>
            );
          })}
        </div>
        <div className="wiz-footer">
          <button className="vds-btn" onClick={()=>setPage(editing ? "schedule" : "auth")}><Icon name="arrowLeft" size={17} />Back</button>
          <button className="vds-btn vds-btn--primary" disabled={pickedList.length===0} onClick={()=>setPage("schedule")}>Continue<Icon name="arrowRight" size={17} /></button>
        </div>
        {confirmRemove && (
          <ConfirmDialog title="Remove this data table?" danger
            body={"This will remove \u201c" + dsNamePreview(tmpl.sources.find(s=>s.name===confirmRemove)) + "\u201d when you save."}
            confirmLabel="Remove" cancelLabel="Cancel"
            onConfirm={()=>{ toggle(confirmRemove); setConfirmRemove(null); }}
            onCancel={()=>setConfirmRemove(null)} />
        )}
      </div>
    );
  }

  // ---- Page 3: Schedule import ----
  const finish = (runNow) => {
    const instId = editing ? editInstance.id : ("conn_" + Math.random().toString(36).slice(2,10));
    const day = todayStr();
    const keptExistingIds = existingNames.filter(n => picks[n]).map(n => existingByName[n].id);
    const removedExistingIds = existingNames.filter(n => !picks[n]).map(n => existingByName[n].id);
    const dsRecords = pickedList.filter(s => !existingNames.includes(s.name)).map(s => {
      let rec = buildRecord(s, instId);
      if (runNow){ const est = estimatedRecordCount(s); rec = { ...rec, recordCount: est, records: fmtRecords(est), lastSynced:"Just now", status:"Ready" }; }
      return rec;
    });
    const instance = {
      id: instId, name: name || conn.name, connectorId: conn.id, connectorName: conn.name, group: conn.group,
      creds: { apiKey }, automationTrigger: sched, ...triggerToSyncFields(sched),
      startDates: Object.fromEntries(pickedList.map(s => [s.name, s.firstDate])),
      status: "Ready", lastChecked: "Just now",
      createdAt: editing ? editInstance.createdAt : day, updatedAt: day,
      lastRun: runNow ? "Just now" : (editing ? editInstance.lastRun : "Never"),
      dataSourceIds: [...keptExistingIds, ...dsRecords.map(d => d.id)],
    };
    if (editing) onSave(instance, { newRecords: dsRecords, deleteIds: removedExistingIds, sourceUpdates: [] });
    else onCreate(instance, dsRecords);
  };

  return (
    <div className="vds-content">
      <PageHead title={"Set up " + conn.name + " connection"} sub={"Choose how often " + conn.name + " should sync."} onCancel={onCancel} />
      <Stepper current={4} steps={CONNECTOR_WIZARD_STEPS} />
      <div className="vds-h4 proto-section-title">Automate</div>
      <div className="vds-b2 proto-muted proto-section-note">Choose the trigger for the automation this creates. Viaduct keeps the data tables current by running it.</div>
      <AutomateTriggerFields trigger={sched} setTrigger={setSched} allowEvent={false} />

      <div className="wiz-footer">
        <button className="vds-btn" onClick={()=>setPage("data")}><Icon name="arrowLeft" size={17} />Back</button>
        <button className="vds-btn" onClick={()=>finish(false)}>Finish</button>
        <button className="vds-btn vds-btn--primary" onClick={()=>finish(true)}><Icon name="play" size={17} />Run now and finish</button>
      </div>
    </div>
  );
}
/* ---------------- Snowflake connector: same 3-page structure as Samsara, but Configure is mandatory ---------------- */

function SnowflakeConnectorFlow({ conn, tmpl, editing, editInstance, existingSources=[], existingConnectors=[], onOpenSource, onCancel, onBackToConnectors, onCreate, onSave, presetTargetId }){
  const { useState } = React;
  const auth = tmpl.auth;
  const editExisting = editing ? (editInstance.dataSourceIds || []).map(id => existingSources.find(s => s.id === id)).filter(Boolean) : [];
  const existingByName = {}; editExisting.forEach(ds => { existingByName[ds.templateSourceKey || ds.name] = ds; });
  const existingNames = editing ? tmpl.sources.filter(s => existingByName[s.name]).map(s => s.name) : [];
  const openExisting = (srcName) => { const ds = existingByName[srcName]; if (ds && onOpenSource) onOpenSource(ds.id); };
  const presetTarget = presetTargetId ? existingSources.find(s => s.id === presetTargetId) : null;

  const [page, setPage] = useState(editing ? "data" : "auth"); // auth -> data -> schedule
  const [name, setName] = useState(editing ? editInstance.name : conn.name);
  const [creds, setCreds] = useState(editing ? (editInstance.creds || {}) : {});
  const setCred = (k, v) => setCreds(c => ({ ...c, [k]: v }));
  const [testing, setTesting] = useState(false);
  // "Start with only the first table being checked" — same default as Samsara.
  const [picks, setPicks] = useState(() => editing
    ? Object.fromEntries(tmpl.sources.map(s => [s.name, !!existingByName[s.name]]))
    : Object.fromEntries(tmpl.sources.map((s, i) => [s.name, i === 0])));
  // configs: table name -> the configured Data record (draft or, when editing, the real existing one)
  const [configs, setConfigs] = useState(() => {
    if (!editing) return {};
    const out = {};
    tmpl.sources.forEach(s => { const ex = existingByName[s.name]; if (ex) out[s.name] = ex; });
    return out;
  });
  const [configuring, setConfiguring] = useState(null);
  const [sched, setSched] = useState(() => (editing && editInstance.automationTrigger) || newWizardTrigger());
  const [confirmRemove, setConfirmRemove] = useState(null);
  const [tableSearch, setTableSearch] = useState("");

  const nameTaken = (n) => (existingConnectors || []).some(c => c.name.trim().toLowerCase() === n.trim().toLowerCase() && (!editing || c.id !== editInstance.id));
  const nameError = !editing && name.trim() && nameTaken(name) ? "A connection with this name already exists — choose a unique name." : "";
  const requiredAuthFilled = (auth.fields || []).filter(f => !f.optional).every(f => String(creds[f.key]||"").trim() !== "");

  const toggle = (n) => setPicks(p => ({ ...p, [n]: !p[n] }));
  const requestToggleOff = (s) => { if (existingNames.includes(s.name)) setConfirmRemove(s.name); else toggle(s.name); };
  const pickedList = tmpl.sources.filter(s => picks[s.name]);
  const dsNamePreview = (s) => configs[s.name] ? configs[s.name].name : dsNameForSource(s, conn.id, false);
  const fmtRecords = (n) => n.toLocaleString("en-US");
  // Configure is mandatory here (Snowflake requires per-table column configuration) — Continue/Finish
  // stay disabled until every picked table has been configured at least once.
  const allConfigured = pickedList.length > 0 && pickedList.every(s => !!configs[s.name]);

  const buildRecord = (s, instId) => {
    const cfg = configs[s.name];
    return { ...cfg, connectorInstanceId: instId, templateSourceKey: s.name, configured: true, fromConnector: true };
  };

  // "Configure" — mandatory, full configuration (name, columns, types, keys, publish). A connection
  // started from the Connectors page only ever creates a new Data here — no "populate an
  // existing data table" fork (that capability lives only behind "Connect data table" on a data table).
  if (configuring){
    const s = tmpl.sources.find(x => x.name === configuring);
    const base = connectorDataSourceRecord(name || conn.name, s, { connId: conn.id, rawPrefix:false });
    const draft = configs[configuring] ? { ...base, ...configs[configuring] } : base;
    return <WarehouseConfigureStep key={configuring} tableName={s.name} draft={draft} presetTargetId={presetTargetId}
      existingSources={existingSources} offerPopulateExisting={false} connectorName={name || conn.name} columnLabelName={conn.name}
      title={configs[configuring] ? "Reconfigure Data Table" : "Configure Data Table"}
      sub="Set column parameters for this table. It stays inactive until it is configured."
      submitLabel="Save configuration"
      lockedKeys={[]} lockColType={false}
      lockName={editing} noRenameRemove={editing} allowAddColumns={editing}
      onCancel={()=>setConfiguring(null)}
      onSave={(patch)=>{ setConfigs(c => ({ ...c, [configuring]: patch })); setConfiguring(null); }} />;
  }

  // ---- Page 1: Authenticate ----
  if (page === "auth"){
    const successText = (auth.success || "Connection verified.").replace("{n}", tmpl.sources.length);
    return (
      <div className="vds-content">
        <PageHead title={"Set up " + conn.name + " connection"} sub={tmpl.tagline} onCancel={onCancel} />
        <Stepper current={2} steps={CONNECTOR_WIZARD_STEPS} />

        <div className="form-grid">
          <div className="field">
            <label className="vds-label">Connection name</label>
            <input className={"vds-input" + (nameError ? " err" : "")} value={name} onChange={(e)=>setName(e.target.value)} />
            {nameError ? <div className="vds-helper-text vds-helper-text--error">{nameError}</div> : <div className="vds-helper-text">A unique label for this connection — you can create several instances of the same connector.</div>}
          </div>
        </div>

        <div className="vds-h4 proto-section-title">{auth.title}</div>
        <div className="vds-b2 proto-muted proto-section-note">{auth.note}</div>
        {!editing && <div style={{marginBottom:12}}><CopyCredsButton existingConnectors={existingConnectors} connId={conn.id} onCopy={(copied)=>setCreds(c=>({ ...c, ...copied }))} /></div>}
        <div className="cred-grid">
          {(auth.fields || []).map(f => (
            <div className={"field" + (f.half ? "" : " full")} key={f.key} style={{margin:0}}>
              <label className="vds-label">{f.label}{f.optional && <span className="opt"> (optional)</span>}</label>
              {f.textarea
                ? <textarea className="vds-textarea proto-key-area" placeholder={f.placeholder} value={creds[f.key] || ""} onChange={(e)=>setCred(f.key, e.target.value)} />
                : <input className="vds-input" placeholder={f.placeholder} value={creds[f.key] || ""} onChange={(e)=>setCred(f.key, e.target.value)} />}
            </div>
          ))}
        </div>

        <div className="wiz-footer">
          <button className="vds-btn" onClick={onBackToConnectors}><Icon name="arrowLeft" size={17} />Back</button>
          <button className="vds-btn vds-btn--primary" disabled={!requiredAuthFilled || !name.trim() || !!nameError || testing}
            onClick={()=>{ setTesting(true); setTimeout(()=>{ setTesting(false); setPage("data"); }, 700); }}>
            {testing ? "Testing connection…" : (<>Continue<Icon name="arrowRight" size={17} /></>)}
          </button>
        </div>
      </div>
    );
  }

  // ---- Page 2: Choose Data — Snowflake Data / Viaduct data, side by side; Configure is mandatory ----
  if (page === "data"){
    const filteredSources = tmpl.sources.filter(s => s.name.toLowerCase().includes(tableSearch.trim().toLowerCase()));
    const lastIdx = filteredSources.length - 1;
    return (
      <div className="vds-content">
        <PageHead title={"Set up " + conn.name + " connection"} sub="Choose which Snowflake tables become Viaduct data tables." onCancel={onCancel} />
        <Stepper current={3} steps={CONNECTOR_WIZARD_STEPS} />
        <div className="filter" style={{maxWidth:340, marginBottom:12}}><span className="s-icon"><Icon name="search" size={16} /></span>
          <input className="vds-input" placeholder="Search tables…" value={tableSearch} onChange={(e)=>setTableSearch(e.target.value)} />
        </div>
        <div className="sbs-scroll">
        <div className="sbs-wrap snowflake-cols">
          <div className="sbs-title samsara">Snowflake Data</div>
          <div className="sbs-title arrowcol"></div>
          <div className="sbs-title viaduct">Viaduct data table</div>

          <div className="sbs-colhead samsara-r">Snowflake source</div>
          <div className="sbs-colhead samsara-r">Number of records</div>
          <div className="sbs-colhead"></div>
          <div className="sbs-colhead viaduct-l">Destination data table</div>
          <div className="sbs-colhead">Type</div>
          <div className="sbs-colhead">Number of records</div>
          <div className="sbs-colhead">Action</div>

          {filteredSources.length === 0 && (
            <div className="sbs-cell" style={{gridColumn:"1 / 8"}}><span className="sbs-empty-row">No tables match "{tableSearch}".</span></div>
          )}
          {filteredSources.map((s, i) => {
            const picked = !!picks[s.name];
            const configured = !!configs[s.name];
            const isExisting = existingNames.includes(s.name);
            const last = i === lastIdx ? " lastrow" : "";
            return (
              <React.Fragment key={s.name}>
                <div className={"sbs-cell samsara-r" + last}>
                  <label className="sbs-src">
                    <input type="checkbox" className="vds-checkbox" checked={picked} onChange={()=>requestToggleOff(s)} />
                    {s.name}
                  </label>
                </div>
                <div className={"sbs-cell samsara-r" + last}><span className="sbs-num">{fmtRecords(s.records)}</span></div>
                <div className={"sbs-cell" + last} style={{justifyContent:"center"}}>
                  <span className={"sbs-arrow-cell" + (picked ? " on" : "")}>{picked && <Icon name="arrowRight" size={18} />}</span>
                </div>
                {picked ? (<>
                  <div className={"sbs-cell viaduct-l" + last}>
                    <div className="sbs-dest">
                      {presetTarget
                        ? <button className="proto-name-link sbs-dest-name" onClick={()=>onOpenSource && onOpenSource(presetTarget.id)}>{presetTarget.name}</button>
                        : isExisting
                        ? <button className="proto-name-link sbs-dest-name" onClick={()=>openExisting(s.name)}>{dsNamePreview(s)}</button>
                        : <span className="sbs-dest-name">{dsNamePreview(s)}</span>}
                    </div>
                  </div>
                  <div className={"sbs-cell viaduct-bg" + last}><span className="vds-chip vds-chip--sm">{s.type}</span></div>
                  <div className={"sbs-cell viaduct-bg" + last}><span className="sbs-num">{fmtRecords(s.records)}</span></div>
                  <div className={"sbs-cell viaduct-bg" + last}>
                    <button className={"vds-btn vds-btn--sm proto-cfg-btn" + (configured ? " subtle" : "")} onClick={()=>setConfiguring(s.name)}>
                      {presetTarget ? "Map columns" : (configured ? "Reconfigure" : "Configure")}
                    </button>
                  </div>
                </>) : (
                  <div className={"sbs-cell viaduct-l" + last} style={{gridColumn:"4 / 8"}}><span className="sbs-empty-row">Not included</span></div>
                )}
              </React.Fragment>
            );
          })}
        </div>
        </div>
        <div className="wiz-footer">
          <button className="vds-btn" onClick={()=>setPage("auth")}><Icon name="arrowLeft" size={17} />Back</button>
          <button className="vds-btn vds-btn--primary" disabled={!allConfigured} onClick={()=>setPage("schedule")}>Continue<Icon name="arrowRight" size={17} /></button>
        </div>
        {confirmRemove && (
          <ConfirmDialog title="Remove this data table?" danger
            body={"This will remove \u201c" + dsNamePreview(tmpl.sources.find(s=>s.name===confirmRemove)) + "\u201d when you save."}
            confirmLabel="Remove" cancelLabel="Cancel"
            onConfirm={()=>{ toggle(confirmRemove); setConfirmRemove(null); }}
            onCancel={()=>setConfirmRemove(null)} />
        )}
      </div>
    );
  }

  // ---- Page 3: Schedule import ----
  const finish = (runNow) => {
    const instId = editing ? editInstance.id : ("conn_" + Math.random().toString(36).slice(2,10));
    const day = todayStr();
    const keptExistingIds = existingNames.filter(n => picks[n]).map(n => existingByName[n].id);
    const removedExistingIds = existingNames.filter(n => !picks[n]).map(n => existingByName[n].id);
    const dsRecords = pickedList.filter(s => !existingNames.includes(s.name)).map(s => {
      let rec = buildRecord(s, instId);
      if (runNow) rec = { ...rec, recordCount: s.records, records: fmtRecords(s.records), lastSynced:"Just now", status:"Ready" };
      return rec;
    });
    const instance = {
      id: instId, name: name || conn.name, connectorId: conn.id, connectorName: conn.name, group: conn.group,
      creds, automationTrigger: sched, ...triggerToSyncFields(sched),
      startDates: {}, status: "Ready", lastChecked: "Just now",
      createdAt: editing ? editInstance.createdAt : day, updatedAt: day,
      lastRun: runNow ? "Just now" : (editing ? editInstance.lastRun : "Never"),
      dataSourceIds: [...keptExistingIds, ...dsRecords.map(d => d.id)],
    };
    if (editing) onSave(instance, { newRecords: dsRecords, deleteIds: removedExistingIds, sourceUpdates: [] });
    else onCreate(instance, dsRecords);
  };

  return (
    <div className="vds-content">
      <PageHead title={"Set up " + conn.name + " connection"} sub="Choose how often this connection syncs." onCancel={onCancel} />
      <Stepper current={4} steps={CONNECTOR_WIZARD_STEPS} />
      <div className="vds-h4 proto-section-title">Automate</div>
      <div className="vds-b2 proto-muted proto-section-note">Choose the trigger for the automation this creates. Viaduct keeps the data tables current by running it.</div>
      <AutomateTriggerFields trigger={sched} setTrigger={setSched} allowEvent={false} />

      <div className="wiz-footer">
        <button className="vds-btn" onClick={()=>setPage("data")}><Icon name="arrowLeft" size={17} />Back</button>
        <button className="vds-btn" onClick={()=>finish(false)}>Finish</button>
        <button className="vds-btn vds-btn--primary" onClick={()=>finish(true)}><Icon name="play" size={17} />Run now and finish</button>
      </div>
    </div>
  );
}
/* ---------------- Viaduct SFTP connector ---------------- */
function CredRow({ label, value, secret }){
  const [copied, setCopied] = useState(false);
  const [show, setShow] = useState(false);
  const display = (secret && !show) ? "•".repeat(16) : value;
  const copy = () => { try { navigator.clipboard.writeText(value); } catch(e){} setCopied(true); setTimeout(()=>setCopied(false), 1200); };
  return (
    <div className="cred-row">
      <span className="cred-lab">{label}</span>
      <span className="cred-val">{display}</span>
      <span className="cred-acts">
        {copied && <span className="cred-copied">Copied</span>}
        {secret && <button className="vds-icon-btn vds-icon-btn--secondary vds-icon-btn--sm" title={show ? "Hide" : "Show"} onClick={()=>setShow(s=>!s)}><Icon name="eye" size={16} /></button>}
        <button className="vds-icon-btn vds-icon-btn--secondary vds-icon-btn--sm" title="Copy" onClick={copy}><Icon name="copy" size={15} /></button>
      </span>
    </div>
  );
}
function DataSourcePicker({ sources, valueId, onChange }){
  const [open, setOpen] = useState(false);
  const chosen = sources.find(s => s.id === valueId);
  if (chosen && !open){
    return (
      <div className="ds-chosen">
        <span className="dscreate-ico"><Icon name="database" size={18} /></span>
        <span><span className="nm">{chosen.name}</span><div className="ds-pick-meta">{chosen.origin} · {chosen.records} records</div></span>
        <button className="chg" onClick={()=>setOpen(true)}>Change</button>
      </div>
    );
  }
  if (!open) return <button className="vds-btn" onClick={()=>setOpen(true)}><Icon name="database" size={17} />Select Data Table</button>;
  if (!sources.length) return <div className="vds-alert vds-alert--info proto-note proto-plain-note">No data tables uploaded as Data Files yet. Create one from <strong>Data Tables → New → Data Files</strong> first, then attach it here.</div>;
  return (
    <div className="vds-table-container">
      {sources.map(s => (
        <button className="ds-pick-item" key={s.id} onClick={()=>{ onChange(s.id); setOpen(false); }}>
          <span className="dscreate-ico"><Icon name="database" size={18} /></span>
          <span><span className="ds-pick-name">{s.name}</span><div className="ds-pick-meta">{s.origin} · {s.records} records · {s.type}</div></span>
        </button>
      ))}
    </div>
  );
}
function PushConfigureStep({ conn, tmpl, name, setName, sources, templateId, setTemplateId, managedName, setManagedName, creds, editing, onCancel, onBack, onContinue }){

            title={editing ? "The connection name can't be changed after it's configured" : undefined}

function PushScheduleStep({ conn, editing, note, onCancel, onBack, onCreate }){

        <button className="vds-btn vds-btn--primary" onClick={onContinue}>Continue<Icon name="arrowRight" size={17} /></button>
      </div>
    </div>
  );

// Renders a connector connection form (leaf fields, rows, and auth-method branches).
function ConnFormFields({ form, creds, setField }){
  const leaf = (f, key) => (
    <div className="form-grid">
      <div className="field" style={{ marginBottom:20 }} key={key}>
        <label className="vds-label">{f.label}{f.optional && <span className="opt"> (optional)</span>}</label>
        {f.textarea
          ? <textarea className="vds-textarea" style={{ height:"auto", minHeight:92, padding:"12px 14px", lineHeight:1.5 }} rows={3} placeholder={f.placeholder||""} value={creds[f.key]||""} onChange={(e)=>setField(f.key, e.target.value)} />
          : f.type === "select"
            ? <select className="vds-select" value={creds[f.key] || f.options[0]} onChange={(e)=>setField(f.key, e.target.value)}>{f.options.map(o => <option key={o} value={o}>{o}</option>)}</select>
            : <input className="vds-input" type={f.secret ? "password" : "text"} placeholder={f.placeholder||""} value={creds[f.key]||""} onChange={(e)=>setField(f.key, e.target.value)} />}
      </div>
    </div>
  );
  const render = (f, key) => {
    if (f.row) return <div style={{ display:"flex", gap:16}} key={key}>{f.row.map((sf, i) => <div style={{ flex:1 }} key={i}>{render(sf, key+"_"+i)}</div>)}</div>;
    if (f.type === "auth"){
      const sel = f.options.find(o => o.value === creds[f.key]) || f.options[0];
      return (
        <React.Fragment key={key}>
          <div className="form-grid">
            <div className="field" style={{ marginBottom:20 }}>
              <label className="vds-label">{f.label}</label>
              <select className="vds-select" value={creds[f.key] || f.options[0].value} onChange={(e)=>setField(f.key, e.target.value)}>{f.options.map(o => <option key={o.value} value={o.value}>{o.value}</option>)}</select>
            </div>
          </div>
          {sel.fields.map((sf, i) => render(sf, key+"_a"+i))}
        </React.Fragment>
      );
    }
    return leaf(f, key);
  };
  return <React.Fragment>{form.map((f, i) => render(f, "f"+i))}</React.Fragment>;
}

function S3ConnectorFlow({ conn, tmpl, editing, editInstance, existingSources=[], existingConnectors=[], onCancel, onBackToConnectors, onCreate, onSave, onOpenSource, presetTargetId }){
  const { useState } = React;
  const managed = !!tmpl.managed;
  const [name, setName] = useState(editing ? editInstance.name : conn.name);
  const [creds, setCreds] = useState(() => {
    if (managed) return editing ? (editInstance.creds || (tmpl.makeCreds ? tmpl.makeCreds() : {})) : (tmpl.makeCreds ? tmpl.makeCreds() : {});
    const base = pullFormDefaults(tmpl.connForm);
    if (!base.prefix) base.prefix = "exports/viaduct/";
    return editing ? { ...base, ...(editInstance.creds || {}) } : base;
  });
  const setField = (k, v) => setCreds(c => ({ ...c, [k]: v }));
  const [trigger, setTrigger] = useState(() =>
    (editing && editInstance.automationTrigger) || newWizardTrigger());

  // sourceMappings are per-prefix now (one Data can span many files sharing that prefix).
  const existingMappings = editing ? (editInstance.sourceMappings || []) : [];

  const [testing, setTesting] = useState(false);
  const [tested, setTested] = useState(editing);
  const files = tested ? s3DiscoveredFiles(creds) : [];
  // configs: filenamePrefix -> the Data record (draft, not-yet-saved OR an existing real one being re-edited)
  const [configs, setConfigs] = useState(() => {
    if (!editing) return {};
    const out = {};
    existingMappings.forEach(m => {
      const src = existingSources.find(s => s.id === m.dataSourceId);
      if (src) out[m.filenamePrefix] = { ...src, filenamePrefix: m.filenamePrefix };
    });
    return out;
  });

  const [mappingPrefix, setMappingPrefix] = useState(null);
  const [mappingFileName, setMappingFileName] = useState(null);
  const [deleteConfirmPrefix, setDeleteConfirmPrefix] = useState(null);
  const [phase, setPhase] = useState(editing ? "choose" : "auth"); // auth -> choose -> trigger

  const openSourceByPrefix = (prefix) => { const cfg = configs[prefix]; if (cfg && existingSources.some(s=>s.id===cfg.id) && onOpenSource) onOpenSource(cfg.id); };
  const startMap = (file) => { setMappingPrefix(s3CandidatePrefix(file.name)); setMappingFileName(file.name); };
  const startEditMapping = (prefix) => { setMappingPrefix(prefix); setMappingFileName(null); };
  const removeMapping = (prefix) => { setConfigs(c => { const next = { ...c }; delete next[prefix]; return next; }); setDeleteConfirmPrefix(null); };
  // A mapping is "owned" by this connector only if it created the data itself (fromConnector
  // and not a populate-existing target) — deleting that removes the data. A populate-existing
  // mapping just unlinks the connector from someone else's data; the data itself stays.
  const deletingCfg = deleteConfirmPrefix ? configs[deleteConfirmPrefix] : null;
  const deletingOwned = deletingCfg ? (deletingCfg.fromConnector && !deletingCfg.populatedExisting) : false;

  if (mappingPrefix){
    const matching = files.filter(f => f.name.startsWith(mappingPrefix));
    const draft = configs[mappingPrefix] || s3FileDraft(name || conn.name, mappingPrefix, matching);
    return <S3MapStep initialPrefix={mappingPrefix} sourceFileName={mappingFileName} draft={draft} allFiles={files} existingSources={existingSources} presetTargetId={presetTargetId} connectorName={name || conn.name}
      existingPrefixes={Object.keys(configs)}
      onCancel={()=>setMappingPrefix(null)} onCancelAll={onCancel}
      onSave={(patch)=>{
        setConfigs(c => {
          const next = { ...c };
          if (mappingPrefix !== patch.filenamePrefix) delete next[mappingPrefix];
          next[patch.filenamePrefix] = { ...draft, ...patch };
          return next;
        });
        setMappingPrefix(null);
      }} />;
  }

  const finish = (runNow) => {
    const instId = editing ? editInstance.id : ("conn_" + Math.random().toString(36).slice(2,10));
    const day = todayStr();
    const newRecords = [];
    const sourceUpdates = [];
    const sourceMappings = [];
    Object.entries(configs).forEach(([prefix, cfg]) => {
      const isExistingSource = existingSources.some(s => s.id === cfg.id);
      const runPatch = runNow ? { status:"Ready", lastSynced:"Just now" } : {};
      if (isExistingSource){
        const { filenamePrefix: _fp, ...patch } = cfg;
        sourceUpdates.push({ id: cfg.id, patch: { ...patch, ...runPatch, filenamePrefix: prefix, connectorInstanceId: instId, configured:true } });
        sourceMappings.push({ dataSourceId: cfg.id, filenamePrefix: prefix });
      } else {
        const managedRec = { ...cfg, ...runPatch, id: cfg.id || ("ds_" + Math.random().toString(36).slice(2,10)), connectorInstanceId: instId, configured:true, fromConnector:true };
        newRecords.push(managedRec);
        sourceMappings.push({ dataSourceId: managedRec.id, filenamePrefix: prefix });
      }
    });
    const keptPrefixes = new Set(Object.keys(configs));
    const removedMappings = existingMappings.filter(m => !keptPrefixes.has(m.filenamePrefix));
    // Only a mapping this connector actually created (fromConnector, not populate-existing) gets its
    // data deleted when removed. A removed populate-existing mapping just unlinks — the
    // target Data (someone else's manually uploaded table) is left fully intact.
    const deleteIds = [];
    removedMappings.forEach(m => {
      const src = existingSources.find(s => s.id === m.dataSourceId);
      if (src && src.fromConnector && !src.populatedExisting) deleteIds.push(m.dataSourceId);
      else if (src) sourceUpdates.push({ id: m.dataSourceId, patch: { connectorInstanceId: null, populatedExisting: false } });
    });
    const dataSourceIds = sourceMappings.map(m => m.dataSourceId);
    const instance = {
      id: instId, name: name || conn.name,
      connectorId: conn.id, connectorName: conn.name, group: conn.group,
      creds, sourceMappings, dataSourceIds,
      automationTrigger: trigger, ...triggerToSyncFields(trigger),
      noSchedule: trigger.type === "manual", status:"Ready", lastChecked:"Just now",
      createdAt: editing ? editInstance.createdAt : day, updatedAt: day,
      lastRun: runNow ? "Just now" : (editing ? editInstance.lastRun : "Never"),
    };
    if (editing) onSave(instance, { newRecords, deleteIds, sourceUpdates });
    else onCreate(instance, newRecords, sourceUpdates);
  };

  if (phase === "auth"){
    return <S3AuthenticateStep conn={conn} tmpl={tmpl} editing={editing} name={name} setName={setName} creds={creds} setField={setField}
      testing={testing} existingConnectors={existingConnectors} onCopyCreds={(copied)=>setCreds(c=>({ ...c, ...copied }))}
      onContinue={()=>{ setTesting(true); setTimeout(()=>{ setTesting(false); setTested(true); setPhase("choose"); }, 700); }}
      onCancel={onCancel} onBackToConnectors={onBackToConnectors} />;
  }

  if (phase === "trigger"){
    return <S3TriggerStep conn={conn} trigger={trigger} setTrigger={setTrigger} editing={editing}
      onCancel={onCancel} onBack={()=>setPhase("choose")} onFinish={finish} />;
  }

  return (<>
    <S3ChooseDataStep conn={conn} editing={editing} files={files} configs={configs}
      onOpenSourceByPrefix={openSourceByPrefix} onMap={startMap} onEditMapping={startEditMapping} onDeleteMapping={setDeleteConfirmPrefix}
      onCancel={onCancel} onBack={()=>setPhase("auth")} onContinue={()=>setPhase("trigger")} />
    {deleteConfirmPrefix && deletingCfg && (
      <ConfirmDialog title="Remove this data table mapping?"
        danger
        body={deletingOwned
          ? ("This deletes the data table \u201c" + deletingCfg.name + "\u201d that this mapping created. This can't be undone.")
          : ("This removes the AWS connector's mapping to \u201c" + deletingCfg.name + "\u201d. \u201c" + deletingCfg.name + "\u201d itself won't be deleted or changed — it stays exactly as it was, just unlinked from this connector. You can re-map this prefix to it (or another data table) again later.")}
        confirmLabel={deletingOwned ? "Delete data table" : "Remove mapping"} cancelLabel="Cancel"
        onConfirm={()=>removeMapping(deleteConfirmPrefix)}
        onCancel={()=>setDeleteConfirmPrefix(null)} />
    )}
  </>);
}

}

function S3MapStep({ initialPrefix, sourceFileName, draft, allFiles, existingPrefixes, existingSources, onCancel, onCancelAll, onSave, presetTargetId, connectorName }){
  const { useState } = React;
  const isNewMapping = !!sourceFileName; // false only when re-opening an already-created mapping via "Edit"
  const [prefix, setPrefix] = useState(draft.filenamePrefix || initialPrefix);
  const [overlapError, setOverlapError] = useState("");
  const [mapReady, setMapReady] = useState(false); // whether the embedded mapping table is ready to save
  const saveMapRef = React.useRef(null);
  const registerSave = (saveFn, ready) => { saveMapRef.current = saveFn; setMapReady(prev => prev === ready ? prev : ready); };
  const presetTarget = presetTargetId ? (existingSources || []).find(s => s.id === presetTargetId) : null;

  const matchingFiles = (allFiles || []).filter(f => f.name.startsWith(prefix));
  const fileCount = matchingFiles.length;
  const totalRows = matchingFiles.reduce((sum, f) => sum + (f.rows || 0), 0);
  const filesNote = fileCount + " file" + (fileCount===1?"":"s") + " currently match" + (fileCount===1?"es":"") + " this prefix (" + totalRows.toLocaleString("en-US") + " record" + (totalRows===1?"":"s") + ") and will be imported.";

  const prefixOverlaps = () => s3PrefixOverlaps(prefix, (existingPrefixes || []).filter(p => p !== (draft.filenamePrefix || null)));
  const checkPrefix = () => {
    if (prefixOverlaps()){ setOverlapError("This prefix overlaps an existing data table's prefix on this connection. Choose one that doesn't overlap."); return false; }
    setOverlapError("");
    return true;
  };

  // Editing an already-created mapping (opened via "Edit" on the Data Created table): unchanged.
  if (!isNewMapping){
    return (
      <ConfigureSource source={draft}
        title={"Edit " + draft.name}
        sub="Set columns, keys, and publish status for this data table."
        submitLabel="Save mapping"
        afterNameSection={<FilenamePrefixField value={prefix} onChange={(v)=>{ setPrefix(v); setOverlapError(""); }} error={overlapError} />}
        originalNameLabel="File" showRelationsTab={false}
        onCancel={onCancel}
        onSave={(patch)=>{ if (checkPrefix()) onSave({ ...patch, filenamePrefix: prefix }); }} />
    );
  }

  // Launched via "Add connection" from an existing Data's Connections tab: one page with the target
  // prefix section first, then the column mapping section directly below it.
  if (presetTarget){
    const schema = s3SchemaForPrefix(initialPrefix);
    return (
      <div className="vds-content">
        <PageHead title="Map Columns" onCancel={onCancel}
          sub={"Files matching this prefix will feed \u201c" + presetTarget.name + "\u201d. Confirm the prefix, then map your columns onto it."} />

        <div className="form-grid">
          <div className="field">
            <label className="vds-label">Target prefix</label>
            <input className={"vds-input" + (overlapError ? " err" : "")} placeholder="e.g. drivers__" value={prefix}
              onChange={(e)=>{ setPrefix(e.target.value.toLowerCase().replace(/[^a-z0-9_\-]/g,"")); setOverlapError(""); }} />
            <div className="vds-helper-text">Files in this connector's location whose names start with this prefix are loaded into this data table.</div>
            {overlapError && <div className="vds-helper-text vds-helper-text--error">{overlapError}</div>}
          </div>
        </div>

        <ColumnMappingStep targetSource={presetTarget} fromLabel={sourceFileName} incomingCols={schema.cols}
          embedded registerSave={registerSave}
          onSave={({ columnMapping, rowFilters, writeMode }) => onSave({
            ...presetTarget, filenamePrefix: prefix, columnMapping, rowFilters, writeMode, populatedExisting: true,
            origin: connectorName || presetTarget.origin,
            recordCount: totalRows, records: totalRows.toLocaleString("en-US"), lastSynced: "Just now", status: "Ready",
          })} />

        <div className="wiz-footer">
          <button className="vds-btn" onClick={onCancel}><Icon name="arrowLeft" size={17} />Back</button>
          <button className="vds-btn vds-btn--primary" disabled={!mapReady} onClick={()=>{ if (checkPrefix() && saveMapRef.current) saveMapRef.current(); }}>
            <Icon name="check" size={17} />Save mapping
          </button>
        </div>
      </div>
    );
  }

  // Standard flow from the Connectors page: a connection here only ever creates a new Data —
  // ask directly for everything needed (prefix, name, display names, description, type, published,
  // columns, preview). Relations only exist once the data is created (see the detail view).
  return (
    <ConfigureSource source={draft}
      title="Configure Data Table"
      sub={filesNote}
      submitLabel="Done configuring"
      afterNameSection={<FilenamePrefixField value={prefix} onChange={(v)=>{ setPrefix(v); setOverlapError(""); }} error={overlapError} />}
      originalNameLabel="File" showRelationsTab={false}
      onCancel={onCancel}
      onSave={(patch)=>{ if (checkPrefix()) onSave({ ...patch, filenamePrefix: prefix }); }} />
  );
}

// Shared "Map to Viaduct {existing data table}" screen — used whenever a connector's table is being
// mapped onto an EXISTING Viaduct data (not creating a new one). The existing data owns the
// schema: its column names, types, and keys are never redefined here, only mapped onto. Each source
// column can be used at most once across rows. Each row also gets its own value filter, same pattern
// used elsewhere for column-level filters.
function ColumnMappingStep({ targetSource, fromLabel, incomingCols, onCancel, onBack, onSave, embedded, registerSave }){
  const { useState } = React;
  const targetCols = targetSource.columns || [];
  const incoming = incomingCols || [];
  const incomingNames = incoming.map(c => c[0]);
  const incomingTypeOf = (n) => { const f = incoming.find(c => c[0] === n); return f ? f[1] : "string"; };
  const norm = (s) => String(s).toLowerCase().replace(/[^a-z0-9]/g, "");
  const guessMatch = (targetName, taken) => incomingNames.find(n => norm(n) === norm(targetName) && !taken.has(n)) || "";

  const [mapping, setMapping] = useState(() => {
    const taken = new Set(); const m = {};
    targetCols.forEach(c => { const g = guessMatch(c.name, taken); if (g){ m[c.name] = g; taken.add(g); } else m[c.name] = ""; });
    return m;
  });
  const usedSourceCols = new Set(Object.values(mapping).filter(Boolean));
  const setMap = (targetName, srcName) => setMapping(m => ({ ...m, [targetName]: srcName }));

  const [filters, setFilters] = useState({});
  const [openFilterFor, setOpenFilterFor] = useState(null);
  const setFilter = (targetName, patch) => setFilters(f => ({ ...f, [targetName]: { ...(f[targetName] || {}), ...patch } }));
  const clearFilter = (targetName) => setFilters(f => { const n = { ...f }; delete n[targetName]; return n; });
  const numDateInputType = (t) => t === "number" ? "number" : (t === "datetime" ? "datetime-local" : "date");
  const filterLabel = (targetName) => {
    const f = filters[targetName];
    if (!f || !colFilterActive({ filter: f })) return "Filter";
    const kind = filterOpKind(f.op); const v = f.values || [];
    if (kind === "novalue") return f.op;
    if (kind === "single") return f.op + " " + (v[0] || "");
    if (kind === "range") return "between " + (v[0] || "…") + " and " + (v[1] || "…");
    if (kind === "period") return "within last " + (v[0] || "") + " " + (v[1] || "days");
    return f.op + " " + v.slice(0,2).join(", ") + (v.length > 2 ? " +" + (v.length - 2) : "");
  };

  const unmappedRequired = targetCols.filter(c => c.req && !mapping[c.name]);
  const [writeMode, setWriteMode] = useState(targetSource.writeMode || "Update");
  const canSave = unmappedRequired.length === 0;
  const save = () => { if (canSave) onSave({ columnMapping: mapping, rowFilters: filters, writeMode }); };

  // Embedded mode (used when the AWS connector combines the prefix section and the mapping table on
  // one page): expose the current save handler/readiness to the parent instead of rendering our own
  // PageHead/footer, so a single shared Continue button can drive both sections.
  React.useEffect(() => { if (embedded && registerSave) registerSave(save, canSave); });

  const mappingSection = (
    <>
      <div className="form-grid">
        <div className="field" style={{marginBottom:20}}>
          <label className="vds-label">Write behavior</label>
          <select className="vds-select" value={writeMode} onChange={(e)=>setWriteMode(e.target.value)}>
            <option value="Replace">Replace — delete all existing data and replace it with fresh data</option>
            <option value="Append">Append — incrementally add rows, without any deletion</option>
            <option value="Update">Update — update existing rows with fresh data, and create new rows for new primary keys</option>
          </select>
          <div className="vds-helper-text">How each sync should reconcile new data against what's already in {targetSource.name}.</div>
        </div>
      </div>
      <div className="vds-h4 proto-section-title" style={{marginTop:0}}>Column mapping</div>
      <div className="cmap2-head">
        <div className="cmap2-fromhead">From {fromLabel}</div>
        <span></span>
        <div className="cmap2-tohead">To Viaduct {targetSource.name}</div>
        <span></span>
      </div>
      <div className="vds-table-container" style={{marginBottom:16}}>
        {targetCols.map(c => {
          const srcName = mapping[c.name];
          const options = incomingNames.filter(n => n === srcName || !usedSourceCols.has(n));
          const missing = c.req && !srcName;
          const srcType = srcName ? incomingTypeOf(srcName) : "string";
          const ops = filterOpsFor(srcType);
          const f = filters[c.name] || { op: ops[0], values: [] };
          const kind = filterOpKind(f.op);
          const isOpen = openFilterFor === c.name;
          return (
            <React.Fragment key={c.name}>
              <div className="cmap-row3">
                <select className="vds-select" value={srcName || ""} onChange={e => setMap(c.name, e.target.value)}>
                  <option value="">— Unmapped —</option>
                  {options.map(n => <option key={n} value={n}>{n}</option>)}
                </select>
                <span className="cmap-arrow"><Icon name="arrowRight" size={14} /></span>
                <span className="cmap-target">{c.display || c.name}{c.req && <span className="req">Required</span>}<span style={{color:"var(--vds-gray-400)", fontSize:12}}> ({c.type})</span></span>
                <button type="button" className={"cg-filter-btn" + (colFilterActive({filter:filters[c.name]}) ? " on" : "")}
                  disabled={!srcName} title={!srcName ? "Map a column first to filter its values" : (colFilterActive({filter:filters[c.name]}) ? "Edit filter" : "Add filter")}
                  onClick={()=>setOpenFilterFor(isOpen ? null : c.name)}>
                  <Icon name="filter" size={14} /><span className="cg-filter-txt">{filterLabel(c.name)}</span>
                </button>
              </div>
              {isOpen && srcName && (
                <div className="colfilter-editor" style={{margin:"0 16px 10px"}}>
                  <div className="colfilter-title">Filter <span>· only import rows where <b>{srcName}</b>…</span></div>
                  <div className="field" style={{width:210}}>
                    <label className="vds-label">Operator</label>
                    <select className="vds-select" value={f.op} onChange={(e)=>{ const op = e.target.value; const nk = filterOpKind(op), ok = filterOpKind(f.op); setFilter(c.name, { op, values: nk===ok ? (f.values||[]) : (nk==="period" ? ["","days"] : []) }); }}>
                      {ops.map(o => <option key={o} value={o}>{o}</option>)}
                    </select>
                  </div>
                  {kind === "novalue" ? (
                    <div className="form-grid">
                      <div className="field" style={{flex:"1 1 auto"}}><label className="vds-label">Value</label><div className="colfilter-novalue">No value needed for "{f.op}".</div></div>
                    </div>
                  ) : kind === "set" ? (
                    <div className="form-grid">
                      <div className="field" style={{minWidth:280, flex:"1 1 280px"}}><label className="vds-label">Values</label><ChipsInput values={f.values || []} onChange={(vals)=>setFilter(c.name, { values: vals })} placeholder="Type a value, press Enter…" /></div>
                    </div>
                  ) : kind === "single" ? (
                    <div className="field" style={{width:230}}><label className="vds-label">Value</label><input className="vds-input" type={numDateInputType(srcType)} value={(f.values && f.values[0]) || ""} onChange={(e)=>setFilter(c.name, { values:[e.target.value] })} /></div>
                  ) : kind === "range" ? (
                    <>
                      <div className="field" style={{width:180}}><label className="vds-label">From</label><input className="vds-input" type={numDateInputType(srcType)} value={(f.values && f.values[0]) || ""} onChange={(e)=>setFilter(c.name, { values:[e.target.value, (f.values||[])[1]||""] })} /></div>
                      <div className="field" style={{width:180}}><label className="vds-label">To</label><input className="vds-input" type={numDateInputType(srcType)} value={(f.values && f.values[1]) || ""} onChange={(e)=>setFilter(c.name, { values:[(f.values||[])[0]||"", e.target.value] })} /></div>
                    </>
                  ) : (
                    <>
                      <div className="field" style={{width:110}}><label className="vds-label">Amount</label><input className="vds-input" type="number" min="0" value={(f.values && f.values[0]) || ""} onChange={(e)=>setFilter(c.name, { values:[e.target.value, (f.values||[])[1]||"days"] })} /></div>
                      <div className="field" style={{width:140}}><label className="vds-label">Unit</label>
                        <select className="vds-select" value={(f.values && f.values[1]) || "days"} onChange={(e)=>setFilter(c.name, { values:[(f.values||[])[0]||"", e.target.value] })}>
                          {FILTER_PERIOD_UNITS.map(u => <option key={u} value={u}>{u}</option>)}
                        </select>
                      </div>
                    </>
                  )}
                  <button type="button" className="vds-btn" style={{height:36}} onClick={()=>{ clearFilter(c.name); setOpenFilterFor(null); }}>Clear filter</button>
                </div>
              )}
            </React.Fragment>
          );
        })}
      </div>
      {unmappedRequired.length > 0 && (
        <div className="vds-alert vds-alert--error proto-note">
          <b>Map every required column to save:</b> {unmappedRequired.map(c => c.display || c.name).join(", ")}.
        </div>
      )}
    </>
  );

  if (embedded) return mappingSection;

  return (
    <div className="vds-content">
      <PageHead title="Map Columns" onCancel={onCancel}
        sub={"Map each column from \u201c" + fromLabel + "\u201d to the matching column already in \u201c" + targetSource.name + "\u201d. " + targetSource.name + " owns the schema — its column names, types, and keys aren't redefined here."} />
      {mappingSection}
      <div className="wiz-footer">
        <button className="vds-btn" onClick={onBack}><Icon name="arrowLeft" size={17} />Back</button>
        <button className="vds-btn vds-btn--primary" disabled={!canSave} onClick={save}><Icon name="check" size={17} />Save mapping</button>
      </div>
    </div>
  );
}

// Wraps the per-table Configure screen (used by warehouse connectors like Snowflake) with an optional
// "create new" vs "populate an existing data table" choice, mirroring the S3 connector's flow.
// offerPopulateExisting is only true for a table's first-time configuration.
function WarehouseConfigureStep({ tableName, draft, existingSources, offerPopulateExisting, presetTargetId, connectorName, columnLabelName, title, sub, submitLabel, lockedKeys, lockColType, lockName, noRenameRemove, allowAddColumns, onCancel, onSave }){
  const { useState } = React;
  const [phase, setPhase] = useState(presetTargetId ? "map" : "configure"); // configure -> decide -> pickTarget -> map
  const [configPatch, setConfigPatch] = useState(null);
  const [targetId, setTargetId] = useState(presetTargetId || null);

  // Step: configure the table's columns. First-time Snowflake tables then reach the new-vs-existing
  // fork; otherwise this saves straight from here (unchanged behavior).
  if (phase === "configure"){
    return <ConfigureSource source={configPatch ? { ...draft, ...configPatch } : draft}
      title={title} sub={sub} submitLabel={offerPopulateExisting ? "Continue" : submitLabel}
      lockedKeys={lockedKeys} lockColType={lockColType} lockName={lockName} noRenameRemove={noRenameRemove} allowAddColumns={allowAddColumns}
      originalNameLabel={columnLabelName || connectorName || "Snowflake"} showRelationsTab={false}
      onCancel={onCancel}
      onSave={(patch)=>{ if (offerPopulateExisting){ setConfigPatch(patch); setPhase("decide"); } else onSave(patch); }} />;
  }

  if (phase === "decide"){
    return (
      <div className="vds-content">
        <PageHead title="Where should this table go?" onCancel={onCancel}
          sub={tableName + " can create a new data table or feed one you already have."} />
        <div className="target-mode-col">
          <button className="vds-card proto-target-mode-card" onClick={()=>onSave(configPatch)}>
            <div className="tm-title"><Icon name="plus" size={16} />Create a new data table</div>
            <div className="tm-desc">Create it from the columns you just configured.</div>
            <span className="tm-go"><Icon name="arrowRight" size={16} /></span>
          </button>
          <button className="vds-card proto-target-mode-card" onClick={()=>setPhase("pickTarget")}>
            <div className="tm-title"><Icon name="database" size={16} />Populate existing Data Table</div>
            <div className="tm-desc">Feed this table's data into a data table you already have — e.g. one uploaded manually. It keeps its own schema; you&rsquo;ll map your columns onto it.</div>
            <span className="tm-go"><Icon name="arrowRight" size={16} /></span>
          </button>
        </div>
        <div className="wiz-footer">
          <button className="vds-btn" onClick={()=>setPhase("configure")}><Icon name="arrowLeft" size={17} />Back</button>
        </div>
      </div>
    );
  }

  if (phase === "pickTarget"){
    return (
      <div className="vds-content">
        <PageHead title="Populate existing Data Table" onCancel={onCancel}
          sub="Pick the data table this table should feed. It keeps its own schema — you'll map your columns onto it next." />
        <div className="form-grid">
          <div className="field">
            <DataSourcePicker sources={existingSources || []} valueId={targetId} onChange={setTargetId} />
          </div>
        </div>
        <div className="wiz-footer">
          <button className="vds-btn" onClick={()=>{ setTargetId(null); setPhase("decide"); }}><Icon name="arrowLeft" size={17} />Back</button>
          <button className="vds-btn vds-btn--primary" disabled={!targetId} onClick={()=>setPhase("map")}>Continue<Icon name="arrowRight" size={17} /></button>
        </div>
      </div>
    );
  }

  const targetSource = (existingSources || []).find(s => s.id === targetId);
  const chosenIncoming = presetTargetId
    ? (draft.columns || []).filter(c => c.imp !== false).map(c => [c.name, c.type])
    : (configPatch.columns || []).filter(c => c.imp !== false).map(c => [c.name, c.type]);
  return <ColumnMappingStep targetSource={targetSource} fromLabel={tableName} incomingCols={chosenIncoming}
    onCancel={onCancel} onBack={presetTargetId ? onCancel : ()=>setPhase("pickTarget")}
    onSave={({ columnMapping, rowFilters, writeMode }) => onSave({ ...targetSource, columnMapping, rowFilters, writeMode, populatedExisting:true, origin: connectorName || targetSource.origin })} />;
}

    relations:{ outgoing:[{ key:"attachments", schema:childName, type:"One to many", pairs:[{ local:"message_id", related:"message_id" }], created:"Just now" }], incoming:[] },
  };
  const child = {
