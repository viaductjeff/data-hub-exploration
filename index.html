              </div>
              <div className="trel-card-actions" onClick={(e)=>e.stopPropagation()}>
                <button className="vds-icon-btn vds-icon-btn--sm" title="Edit" onClick={()=>startEdit(i)}><Icon name="pencil" size={16} /></button>
                <DeleteButton onDelete={()=>removeRel(i)} />
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}
function RelationsManager({ value, onChange, columns }){
  const outgoing = value.outgoing || [];
  const incoming = value.incoming || [];
  const [adding, setAdding] = useState(false);
  const [draft, setDraft] = useState(() => blankRelation(columns));

  const reset = () => { setDraft(blankRelation(columns)); setAdding(false); };
  const canAdd = draft.key.trim() && draft.schema.trim() && draft.pairs.every(p => p.local && String(p.related).trim());
  const commit = () => {
    if (!canAdd) return;
    const rel = { ...draft, key:draft.key.trim(), schema:draft.schema.trim(), created:"Just now" };
    onChange({ ...value, outgoing:[...outgoing, rel] });
    reset();
  };
  const remove = (i) => onChange({ ...value, outgoing: outgoing.filter((_,idx)=>idx!==i) });
  const setPair = (i, patch) => setDraft(d => ({ ...d, pairs: d.pairs.map((p,idx)=> idx===i ? {...p,...patch} : p) }));
  const addPair = () => setDraft(d => ({ ...d, pairs:[...d.pairs, { local:(columns[0]||""), related:"" }] }));
  const delPair = (i) => setDraft(d => ({ ...d, pairs: d.pairs.length>1 ? d.pairs.filter((_,idx)=>idx!==i) : d.pairs }));
  const pairText = (rel) => rel.pairs.map(p => `${p.local} = ${p.related}`).join(", ");

  return (
    <div>
      <div className="vds-alert vds-alert--info proto-note">
        <span className="ic"><Icon name="broadcast" size={20} /></span>
        <div>
          <div className="rel-note-title">Changes apply immediately.</div>
          <p className="rel-note-body">Joins between this source and others. ClickHouse has no foreign keys, so we generate queries that emulate the join — adding or deleting a relation takes effect right away.</p>
        </div>
      </div>

      <div className="rel-section">
        <div className="rel-head">
          <div className="vds-h4"><b>Outgoing Relations</b> defined on this schema</div>
          <button className="vds-btn" onClick={()=>setAdding(a=>!a)}><Icon name="plus" size={18} />Add Relation</button>
        </div>
        <div className="rel-table-head">
          <div className="rel-th">Key</div><div className="rel-th">Related Schema</div><div className="rel-th">Type</div><div className="rel-th">Column Pairs</div><div className="rel-th">Created</div><div></div>
        </div>
        {outgoing.length === 0 && !adding && <div className="rel-empty">No outgoing relations yet.</div>}
        {outgoing.map((rel,i) => (
          <div className="rel-row" style={{gridTemplateColumns:REL_TMPL}} key={i}>
            <div className="rel-cell rel-key">{rel.key}</div>
            <div className="rel-cell">{rel.schema}</div>
            <div className="rel-cell">{rel.type}</div>
            <div className="rel-cell">{pairText(rel)}</div>
            <div className="rel-cell">{rel.created}</div>
            <button className="vds-icon-btn vds-icon-btn--sm proto-icon-btn--danger" onClick={()=>remove(i)} aria-label="Delete relation">×</button>
          </div>
        ))}

        {adding && (
          <div className="vds-card proto-rel-form">
            <div className="rel-form-grid">
              <div>
                <label className="vds-label">Key</label>
                <input className="vds-input" placeholder="e.g. vehicle" value={draft.key} onChange={(e)=>setDraft(d=>({...d, key:e.target.value}))} />
              </div>
              <div>
                <label className="vds-label">Related Schema</label>
                <input className="vds-input" placeholder="e.g. vehicles" value={draft.schema} onChange={(e)=>setDraft(d=>({...d, schema:e.target.value}))} />
              </div>
              <div>
                <label className="vds-label">Type</label>
                <select className="vds-select" value={draft.type} onChange={(e)=>setDraft(d=>({...d, type:e.target.value}))}>
                  {REL_TYPES.map(t => <option key={t} value={t}>{t}</option>)}
                </select>
              </div>
            </div>
            <div className="rel-pairs">
              <label className="vds-label">Column Pairs</label>
              {draft.pairs.map((p,i) => (
                <div className="pair-row" key={i}>
                  <select className="vds-select" value={p.local} onChange={(e)=>setPair(i,{local:e.target.value})} aria-label="Local column">
                    {columns.length===0 && <option value="">—</option>}
                    {columns.map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                  <span className="arrow">→</span>
                  <input className="vds-input" placeholder="related column" value={p.related} onChange={(e)=>setPair(i,{related:e.target.value})} aria-label="Related column" />
                  <button className="vds-icon-btn vds-icon-btn--sm proto-icon-btn--danger" onClick={()=>delPair(i)} aria-label="Remove pair" disabled={draft.pairs.length===1}>×</button>
                </div>
              ))}
              <button className="pair-add" onClick={addPair}>+ Add column pair</button>
            </div>
            <div className="rel-form-actions">
              <button className="vds-btn vds-btn--primary vds-btn--sm" onClick={commit} disabled={!canAdd}><Icon name="plus" size={16} />Add relation</button>
              <button className="vds-btn" onClick={reset}>Cancel</button>
            </div>
          </div>
        )}
      </div>

      <div className="rel-section">
        <div className="vds-h4"><b>Incoming Relations</b> other schemas pointing here — managed from their side</div>
        <div className="rel-table-head">
          <div className="rel-th">Key</div><div className="rel-th">Source Schema</div><div className="rel-th">Type</div><div className="rel-th">Column Pairs</div><div className="rel-th">Created</div><div></div>
        </div>
        {incoming.length === 0
          ? <div className="rel-empty">No incoming relations.</div>
          : incoming.map((rel,i) => (
              <div className="rel-row" style={{gridTemplateColumns:REL_TMPL}} key={i}>
                <div className="rel-cell rel-key">{rel.key}</div><div className="rel-cell">{rel.schema}</div>
                <div className="rel-cell">{rel.type}</div><div className="rel-cell">{rel.pairs ? rel.pairs.map(p=>`${p.local} = ${p.related}`).join(", ") : ""}</div>
                <div className="rel-cell">{rel.created}</div><div></div>
              </div>
            ))}
      </div>
    </div>
  );
}

function useScrollStableTabs(tab){
  const scRef = useRef(null);
  const savedTop = useRef(0);
  React.useLayoutEffect(() => { if (scRef.current) scRef.current.scrollTop = savedTop.current; }, [tab]);
  return (val, setTab) => (e) => {
    const sc = e.currentTarget.closest(".content");
    scRef.current = sc;
    savedTop.current = sc ? sc.scrollTop : 0;
    setTab(val);
  };
}

function MapImportStep({ parsed, origin, onCancel, onBack, onCreate }){
  const [name, setName] = useState("raw__" + slugify(parsed.fileName));
  const initNames = displayNamesFromName("raw__" + slugify(parsed.fileName));
  const [singular, setSingular] = useState(initNames.singular);
  const [plural, setPlural] = useState(initNames.plural);
  const [namesEdited, setNamesEdited] = useState(false);
  const editSingular = (v) => { setSingular(v); setNamesEdited(true); };
  const editPlural = (v) => { setPlural(v); setNamesEdited(true); };
  const [desc, setDesc] = useState(() => parsed.media ? autoDescribe(parsed) : "");
  const [descEdited, setDescEdited] = useState(false);
  const editDesc = (v) => { setDesc(v); setDescEdited(true); };
  const [type, setType] = useState(parsed.media ? "Media" : "Table");
  const [published, setPublished] = useState(true);
  const [tab, setTab] = useState("columns");
  const [cols, setCols] = useState(() => parsed.columns.map(c => ({
    name:c, display:c, type:(parsed.typeByCol[c] || "string"),
    imp:true, pk:false, req:false, orderBy:false, lowCard:false, part:false, dedup:false,
  })));
  const [relations, setRelations] = useState({ outgoing:[], incoming:[] });
  const tabClick = useScrollStableTabs(tab);
  const hasFilter = cols.some(colFilterActive);
  const filteredRows = applyColumnFilters(parsed.rows, cols);
  const previewRows = filteredRows.slice(0,10);
  const previewCols = cols.filter(c => c.imp !== false).map(c => ({ key:c.name, label:c.display || c.name }));
  const originLabel = (ORIGINS.find(o => o.id === origin) || {}).title || "Data Files";
  // Keep display names in sync with the data name until the user edits them.
  React.useEffect(() => {
    if (!namesEdited && !parsed.media){ const dn = displayNamesFromName(name); setSingular(dn.singular); setPlural(dn.plural); }
  }, [name, namesEdited, parsed]);
  // Media keeps its auto-generated library blurb in sync until edited by hand. Regular uploads no
  // longer auto-describe from the schema — the description starts blank with a placeholder only.
  React.useEffect(() => {
    if (!descEdited && parsed.media) setDesc(autoDescribe(parsed, { noun: plural || "records", origin: originLabel }));
  }, [plural, descEdited, parsed, originLabel]);

  const create = () => {
    const finalRows = hasFilter ? applyColumnFilters(parsed.rows, cols) : parsed.rows;
    onCreate({
      id: "ds_" + Date.now(),
      name: name || slugify(parsed.fileName),
      origin: originLabel,
      type,
      status: "Ready",
      records: Number(finalRows.length).toLocaleString(),
      recordCount: finalRows.length,
      lastSynced: "Just now",
      singular, plural, description: desc,
      published,
      media: !!parsed.media,
      columns: cols,
      parsed: { ...parsed, rows: finalRows },
      relations,
    });
  };

  return (<>
    <PageHead title="Map & import" sub="Review columns and configure how they are imported." onCancel={onCancel} />
    <Stepper current={3} />

    <div className="form-grid">
      <div className="field">
        <label className="vds-label">Data table name</label>
        <input className="vds-input" value={name} onChange={(e)=>setName(e.target.value.toLowerCase().replace(/[^a-z0-9_]/g,"_"))} />
        <div className="vds-helper-text">Lowercase letters and underscores only (e.g. asset_list).</div>
      </div>
      <div className="field">
        <label className="vds-label">Display Name Singular</label>
        <input className="vds-input" placeholder="e.g. Asset" value={singular} onChange={(e)=>editSingular(e.target.value)} />
      </div>
      <div className="field">
        <label className="vds-label">Display Name Plural</label>
        <input className="vds-input" placeholder="e.g. Assets" value={plural} onChange={(e)=>editPlural(e.target.value)} />
      </div>
      <div className="field">
        <label className="vds-label">Description</label>
        <textarea className="vds-textarea" placeholder="Describe what this data table contains…" value={desc} onChange={(e)=>editDesc(e.target.value)} />
        <div className="vds-helper-text">{parsed.media ? "Agents use this to decide when to query this data table. Auto-filled from the data — edit to refine." : "Agents use this to decide when to query this data table."}</div>
      </div>
      <div className="field">
        <label className="vds-label">Type</label>
        <select className="vds-select" value={type} onChange={(e)=>setType(e.target.value)}>
          {parsed.media
            ? <><option>Media</option></>
            : <><option>Asset</option><option>Event</option><option>Table</option></>}
        </select>
      </div>
      <div className="field">
        <label className="vds-label">Published</label>
        <select className="vds-select" value={published ? "True" : "False"} onChange={(e)=>setPublished(e.target.value === "True")}>
          <option>True</option><option>False</option>
        </select>
        <div className="vds-helper-text">Published sources are visible to the rest of the app.</div>
      </div>
    </div>

    <div className="vds-h4 proto-section-title">Preview</div>
    <div className="vds-b2 proto-muted proto-section-note">{hasFilter ? ("Filtered — " + filteredRows.length + " of " + parsed.rows.length + " rows match the current filters.") : ("First " + previewRows.length + " rows from " + parsed.fileName + ".")}</div>
    <div className="vds-table-container proto-scroll-wrap">
      <table className="vds-table proto-preview-table">
        <thead><tr>{previewCols.map(c => <th key={c.key}>{c.label}</th>)}</tr></thead>
        <tbody>
          {previewRows.map((r,i) => <tr key={i}>{previewCols.map(c => <td key={c.key}>{cellText(r[c.key])}</td>)}</tr>)}
        </tbody>
      </table>
    </div>
    {previewRows.length === 0 && hasFilter && (
      <div className="vds-b2 proto-muted proto-section-note">No rows match the current filters. Loosen a filter to include records.</div>
    )}

    <div className="vds-tabs">
      <button className={"vds-tab" + (tab==="columns" ? " vds-tab--selected" : "")} onClick={tabClick("columns", setTab)}>Columns</button>
      <button className={"vds-tab" + (tab==="relations" ? " vds-tab--selected" : "")} onClick={tabClick("relations", setTab)}>Relations</button>
    </div>
    <div className="tab-body">
      {tab==="columns" ? <ColumnsTab cols={cols} setCols={setCols} enableFilter={true} rows={parsed.rows} />
        : <RelationsManager value={relations} onChange={setRelations} columns={cols.filter(c=>c.imp).map(c=>c.display)} />}
    </div>

    <div className="wiz-footer">
      <button className="vds-btn" onClick={onBack}><Icon name="arrowLeft" size={17} />Back</button>
      <button className="vds-btn vds-btn--primary" onClick={create}><Icon name="check" size={17} />Create data table</button>
    </div>
  </>);
}

/* ---------------- Configure data (column parameters) ---------------- */
function ConfigureSource({ source, title, sub, submitLabel, onCancel, onSave, lockedKeys = [], stepper = null, extraSection = null, afterNameSection = null, lockName = false, allowAddColumns = false, noRenameRemove = false, lockColType = false, forceNameEditable = false, enableFilter = true, writeModeLocked = false, writeModeReadOnly = "", initialOpenFilterCol = null, showRelationsTab = true, originalNameLabel = null }){
  const p = source.parsed || { columns:[], typeByCol:{}, rows:[] };
  const [name, setName] = useState(source.name || "");
  const initNames = displayNamesFromName(source.name || "");
  const [singular, setSingular] = useState(source.singular || initNames.singular);
  const [plural, setPlural] = useState(source.plural || initNames.plural);
  const [namesEdited, setNamesEdited] = useState(!!(source.singular || source.plural));
  const editSingular = (v) => { setSingular(v); setNamesEdited(true); };
  const editPlural = (v) => { setPlural(v); setNamesEdited(true); };
  const [desc, setDesc] = useState(source.description || "");
  const [type, setType] = useState(source.type || "Table");
  const [published, setPublished] = useState(source.published !== false);
  const [writeMode, setWriteMode] = useState(source.writeMode || "Replace");
  const [tab, setTab] = useState("columns");
  const [cols, setCols] = useState(() => (source.columns && source.columns.length)
    ? source.columns.map(c => ({ ...c }))
    : (p.columns || []).map(c => ({ name:c, display:c, type:(p.typeByCol[c] || "string"), imp:true, pk:false, req:false, orderBy:false, lowCard:false, part:false, dedup:false })));
  const [relations, setRelations] = useState(source.relations || { outgoing:[], incoming:[] });
  const tabClick = useScrollStableTabs(tab);
  const hasFilter = cols.some(colFilterActive);
  const isSample = !((p.rows || []).length) && !!((p.previewRows || []).length);
  const baseRows = (p.rows && p.rows.length) ? p.rows : (p.previewRows || []);
  const filteredRows = applyColumnFilters(baseRows, cols);
  const previewRows = filteredRows.slice(0,100);
  const previewCols = cols.filter(c => c.imp !== false).map(c => ({ key:c.name, label:c.display || c.name }));
  React.useEffect(() => {
    if (!namesEdited){ const dn = displayNamesFromName(name); setSingular(dn.singular); setPlural(dn.plural); }
  }, [name, namesEdited]);
  const save = () => {
    const patch = {
      name: name || source.name, singular, plural, description: desc, type, published, writeMode,
      columns: cols, relations, configured: true, status: "Ready",
    };
    if ((p.rows || []).length && cols.some(colFilterActive)){
      const fr = applyColumnFilters(p.rows, cols);
      patch.parsed = { ...p, rows: fr };
      patch.recordCount = fr.length;
      patch.records = fr.length.toLocaleString("en-US");
    }
    onSave(patch);
  };
  return (<div className="vds-content">
    <PageHead title={title || "Configure Data Table"} sub={sub || "Set column parameters for this table. It stays inactive until it is configured."} onCancel={onCancel} />
    {stepper}

    <div className="form-grid">
      <div className="field">
        <label className="vds-label">Data table name</label>
        <input className={"vds-input" + (lockName ? " locked" : "")} value={name} readOnly={lockName}
          title={lockName ? "The data table name can't be changed after it's configured" : undefined}
          onChange={(e)=>{ if (lockName) return; setName(e.target.value.toLowerCase().replace(/[^a-z0-9_]/g,"_")); }} />
        <div className="vds-helper-text">{lockName ? "Set when the data table was created — can't be changed." : "Lowercase letters and underscores only."}</div>
      </div>
    </div>
    {afterNameSection}
    <div className="form-grid">
      <div className="field">
        <label className="vds-label">Display Name Singular</label>
        <input className="vds-input" placeholder="e.g. Driver" value={singular} onChange={(e)=>editSingular(e.target.value)} />
      </div>
      <div className="field">
        <label className="vds-label">Display Name Plural</label>
        <input className="vds-input" placeholder="e.g. Drivers" value={plural} onChange={(e)=>editPlural(e.target.value)} />
      </div>
      <div className="field">
        <label className="vds-label">Description</label>
        <textarea className="vds-textarea" placeholder="Describe what this data table contains…" value={desc} onChange={(e)=>setDesc(e.target.value)} />
        <div className="vds-helper-text">Agents use this to decide when to query this data table.</div>
      </div>
      <div className="field">
        <label className="vds-label">Type</label>
        <select className="vds-select" value={type} onChange={(e)=>setType(e.target.value)}>
          <option>Asset</option><option>Event</option><option>Table</option><option>Media</option>
        </select>
      </div>
      <div className="field">
        <label className="vds-label">Published</label>
        <select className="vds-select" value={published ? "True" : "False"} onChange={(e)=>setPublished(e.target.value === "True")}>
          <option>True</option><option>False</option>
        </select>
        <div className="vds-helper-text">Published sources are visible to the rest of the app once configured.</div>
      </div>
      <div className="field">
        <label className="vds-label">Write behavior</label>
        {writeModeLocked ? (
          <div className="vds-input locked" style={{display:"flex", alignItems:"center", height:44}}>{writeModeReadOnly || writeMode}</div>
        ) : (
          <select className="vds-select" value={writeMode} onChange={(e)=>setWriteMode(e.target.value)}>
            <option value="Replace">Replace — delete all existing data and replace it with fresh data</option>
            <option value="Append">Append — incrementally add rows, without any deletion</option>
            <option value="Update">Update — update existing rows with fresh data, and create new rows for new primary keys</option>
          </select>
        )}
        <div className="vds-helper-text">{writeModeLocked ? "Set by the API and can't be changed here." : "How each sync should reconcile new data against what's already here."}</div>
      </div>
    </div>

    {extraSection}

    {showRelationsTab && (
      <div className="vds-tabs">
        <button className={"vds-tab" + (tab==="columns" ? " vds-tab--selected" : "")} onClick={tabClick("columns", setTab)}>Columns</button>
        <button className={"vds-tab" + (tab==="relations" ? " vds-tab--selected" : "")} onClick={tabClick("relations", setTab)}>Relations</button>
      </div>
    )}
    <div className="tab-body">
      {(!showRelationsTab || tab==="columns") ? (<>
        <ColumnsTab cols={cols} setCols={setCols} enableFilter={enableFilter} rows={baseRows} lockedKeys={lockedKeys} noRenameRemove={noRenameRemove} allowAdd={allowAddColumns} lockColType={lockColType} forceNameEditable={forceNameEditable} initialOpenFilterCol={initialOpenFilterCol} originalNameLabel={originalNameLabel} />
        {previewRows.length > 0 && (<>
          <div className="vds-h4 proto-section-title">Preview</div>
          <div className="vds-b2 proto-muted proto-section-note">{isSample ? "Sample data to help guide column configuration — this connector hasn't synced yet, so these rows aren't real records. " : ""}{hasFilter ? ("Filtered sample — " + filteredRows.length + " of " + baseRows.length + " sample rows match the current filters.") : ("First " + previewRows.length + " rows.")}</div>
          <div className="vds-table-container proto-scroll-wrap">
            <table className="vds-table proto-preview-table">
              <thead><tr>{previewCols.map(c => <th key={c.key}>{c.label}</th>)}</tr></thead>
              <tbody>{previewRows.map((r,i) => <tr key={i}>{previewCols.map(c => <td key={c.key}>{cellText(r[c.key])}</td>)}</tr>)}</tbody>
            </table>
          </div>
        </>)}
        {previewRows.length === 0 && hasFilter && (<>
          <div className="vds-h4 proto-section-title">Preview</div>
          <div className="vds-b2 proto-muted proto-section-note">No sample rows match the current filters. Loosen a filter to include records.</div>
        </>)}
      </>)
        : <RelationsManager value={relations} onChange={setRelations} columns={cols.filter(c=>c.imp).map(c=>c.display)} />}
    </div>


    <div className="wiz-footer">
      <button className="vds-btn" onClick={onCancel}><Icon name="arrowLeft" size={17} />Cancel</button>
      <button className="vds-btn vds-btn--primary" onClick={save}><Icon name="check" size={17} />{submitLabel || "Save configuration"}</button>
    </div>
  </div>);
}

function NewDataSource({ onCancel, onCreate }){
  const [step, setStep] = useState(1);
  const [origin, setOrigin] = useState(null);
  const [parsed, setParsed] = useState(null);
  return (
    <div className="vds-content">
      {step===1 && <SelectOrigin onCancel={onCancel} onPick={(o)=>{ setOrigin(o); setStep(2); }} />}
      {step===2 && <UploadStep origin={origin} onCancel={onCancel} onBack={()=>setStep(1)} onParsed={(p)=>{ setParsed(p); setStep(3); }} />}
      {step===3 && parsed && <MapImportStep parsed={parsed} origin={origin} onCancel={onCancel} onBack={()=>setStep(2)} onCreate={onCreate} />}
    </div>
  );
}

function ConfirmDialog({ title, body, confirmLabel = "Proceed", cancelLabel = "Cancel", danger = false, onConfirm, onCancel }){

          <button className="vds-btn" onClick={onCancel}>{cancelLabel}</button>

}

function AttachmentViewerModal({ row, onBack, onClose }){
  const isImage = String(row.content_type||"").startsWith("image/");
  const isPdf = row.content_type === "application/pdf";
  const preview = row._preview;
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="vds-dialog proto-modal-card file-modal" onClick={(e)=>e.stopPropagation()}>
        <div className="vds-dialog__title">
          {onBack && <button className="vds-icon-btn vds-icon-btn--xs" onClick={onBack} aria-label="Back to email"><Icon name="arrowLeft" size={16} /></button>}
          <Icon name={isImage ? "image" : "fileText"} size={18} />{row.filename}
          <button className="vds-icon-btn vds-icon-btn--xs" onClick={onClose} aria-label="Close"><Icon name="x" size={16} /></button>

function DataSourceDetails({ source, allSources = [], connectors = [], automations = [], onBack, onUpdate, onConnectData }){
  const [tab, setTab] = useState("data");
  const p = source.parsed;
  const rows = p ? p.rows : [];
  const lockStructure = !!source.fromConnector;   // configured connections: column schema fixed
  const lockName = lockStructure && source.tableNameLocked !== false;   // Email connections explicitly allow renaming the table
  const filterable = lockStructure && source.filterable !== false;   // Email's schema is a fixed platform contract — no filters
  const ingested = (source.recordCount || rows.length || 0) > 0;
  const isEmailParent = source.emailKind === "parent";
  const isEmailChild = source.emailKind === "child";
  const childSchemaName = (source.relations && source.relations.outgoing && source.relations.outgoing[0]) ? source.relations.outgoing[0].schema : null;
  const childEmailSource = isEmailParent ? allSources.find(s => s.name === childSchemaName) : null;
  const attachmentsForMessage = (messageId) => (childEmailSource && childEmailSource.parsed ? childEmailSource.parsed.rows.filter(r => r.message_id === messageId) : []);
  const [viewerRow, setViewerRow] = useState(null);
  const [viewerAttachment, setViewerAttachment] = useState(null);
  const rowClickable = isEmailParent || isEmailChild;
  const onRowClick = isEmailParent ? setViewerRow : isEmailChild ? setViewerAttachment : null;
  const buildInitCols = () => (source.columns && source.columns.length)
    ? source.columns.map(c => ({ ...c }))
    : ((p && p.columns) ? p.columns.map(nm => ({ name:nm, display:nm, type:(p.typeByCol && p.typeByCol[nm]) || "string", imp:true })) : []);
  const [name, setName] = useState(source.name || "");
  const [singular, setSingular] = useState(source.singular || "");
  const [plural, setPlural] = useState(source.plural || "");
  const [desc, setDesc] = useState(source.description || "");
  const [published, setPublished] = useState(source.published !== false);
  const [cols, setCols] = useState(buildInitCols);
  const [confirmFilterChange, setConfirmFilterChange] = useState(false);
  const dataCols = (cols && cols.length)
    ? cols.filter(c => c.imp !== false).map(c => ({ key:c.name, label:c.display || c.name }))
    : (p ? p.columns.map(c => ({ key:c, label:c })) : []);

  const editName = (v) => { if (lockName) return; setName(v.toLowerCase().replace(/[^a-z0-9_]/g, "_")); };
  const editSingular = (v) => setSingular(v);
  const editPlural = (v) => setPlural(v);
  const editDesc = (v) => setDesc(v);
  const editPublished = (v) => setPublished(v);
  const origColsJSON = JSON.stringify(buildInitCols());
  const colsDirty = JSON.stringify(cols) !== origColsJSON;
  const dirty = name !== (source.name || "") || singular !== (source.singular || "") || plural !== (source.plural || "")
    || desc !== (source.description || "") || published !== (source.published !== false)
    || colsDirty;
  const doSave = () => {
    onUpdate(source.id, { name: lockName ? source.name : (name || source.name), singular, plural, description: desc, published, columns: cols });
    setConfirmFilterChange(false);
  };
  const requestSave = () => {
    if (lockName && colsDirty) setConfirmFilterChange(true);
    else doSave();
  };
  const cancelEdits = () => {
    setName(source.name || ""); setSingular(source.singular || ""); setPlural(source.plural || "");
    setDesc(source.description || ""); setPublished(source.published !== false); setCols(buildInitCols());
  };
  const relColumns = cols.filter(c => c.imp !== false).map(c => c.display);
  const tabClick = useScrollStableTabs(tab);

  return (
    <div className="vds-content">
      <button className="vds-btn vds-btn--text vds-btn--sm proto-back-link" onClick={onBack}><Icon name="arrowLeft" size={16} />Data Tables</button>
      <div className="vds-page-header proto-sticky-head">
        <div>
          <h1 className="vds-page-title">{source.name}</h1>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:10,flex:"0 0 auto"}}>
          <span className={"vds-chip vds-chip--sm proto-pub-pill " + (published ? "yes" : "no")}>{published ? "Published" : "Unpublished"}</span>
          <span className={"vds-chip vds-chip--sm proto-status-pill" + (source.status === "Needs configuration" ? " cfg" : (source.status === "Waiting for data" || source.status === "Not built yet") ? " wait" : "")}><span className="dot"></span>{source.status}</span>
        </div>
      </div>

      <div className="form-grid">
        <div className="field">
          <label className="vds-label">Data table name</label>
          <input className={"vds-input" + (lockName ? " locked" : "")} value={name} readOnly={lockName}
            title={lockName ? "Managed by a connector — the data table name can't be changed" : undefined}
            onChange={(e)=>editName(e.target.value)} />
          <div className="vds-helper-text">{lockName ? "Managed by a connector — the name can't be changed." : "Lowercase letters and underscores only (e.g. asset_list)."}</div>
        </div>
      </div>
      <div className="meta-grid">
        <div className="form-grid">
          <div className="field">
            <label className="vds-label">Display Name Singular</label>
            <input className="vds-input" placeholder="e.g. Repair" value={singular} onChange={(e)=>editSingular(e.target.value)} />
          </div>
          <div className="field">
            <label className="vds-label">Display Name Plural</label>
            <input className="vds-input" placeholder="e.g. Repairs" value={plural} onChange={(e)=>editPlural(e.target.value)} />
          </div>
        </div>
      </div>
      <div className="form-grid">
        <div className="field" style={{marginTop:20}}>
          <label className="vds-label">Description</label>
          <textarea className="vds-textarea" placeholder="Describe what this data table contains…" value={desc} onChange={(e)=>editDesc(e.target.value)} />
        </div>
        <div className="field">
          <label className="vds-label">Published</label>
          <select className="vds-select" value={published ? "True" : "False"} onChange={(e)=>editPublished(e.target.value === "True")}>
            <option>True</option><option>False</option>
          </select>
        </div>
      </div>

      {dirty && (
        <div className="vds-alert vds-alert--info proto-save-bar">
          <span className="save-note">You have unsaved changes</span>
          <div style={{display:"flex", gap:10}}>
            <button className="vds-btn" onClick={cancelEdits}>Cancel</button>
            <button className="vds-btn vds-btn--primary vds-btn--sm" onClick={requestSave}><Icon name="check" size={16} />Save changes</button>
          </div>
        </div>
      )}

      {confirmFilterChange && (
        <ConfirmDialog
          title="Re-ingest this data table?"
          body="We must delete the existing data table and re-ingest it. This may take minutes to hours and it won't be available in between. Do you want to proceed?"
          confirmLabel="Proceed" cancelLabel="Cancel" danger
          onConfirm={doSave}
          onCancel={()=>setConfirmFilterChange(false)}
        />
      )}

      <div className="vds-tabs">
        <button className={"vds-tab" + (tab==="data" ? " vds-tab--selected" : "")} onClick={tabClick("data", setTab)}>Data</button>
        <button className={"vds-tab" + (tab==="columns" ? " vds-tab--selected" : "")} onClick={tabClick("columns", setTab)}>Columns</button>
        <button className={"vds-tab" + (tab==="connections" ? " vds-tab--selected" : "")} onClick={tabClick("connections", setTab)}>Connections</button>
        <button className={"vds-tab" + (tab==="relations" ? " vds-tab--selected" : "")} onClick={tabClick("relations", setTab)}>Relations</button>
      </div>
      <div className="tab-body">
        {tab==="data" ? (
          <div>
            <div className="vds-b2 proto-muted proto-section-note">{Number(source.recordCount||rows.length).toLocaleString()} records · {dataCols.length} columns{rowClickable ? " · click a row to open it" : ""}</div>
            <div className="vds-table-container proto-scroll-wrap proto-data-wrap">
              <table className="vds-table proto-preview-table">
                <thead><tr>{dataCols.map(c => <th key={c.key}>{c.label}</th>)}</tr></thead>
                <tbody>
                  {rows.map((r,i) => <tr key={i} className={rowClickable ? "clickable-row" : undefined} onClick={rowClickable ? ()=>onRowClick(r) : undefined}>{dataCols.map(c => <td key={c.key}>{cellText(r[c.key])}</td>)}</tr>)}
                </tbody>
              </table>
            </div>
          </div>
        ) : tab==="columns" ? (
          <div>
            <p className="vds-b2 proto-muted proto-cols-instr" style={{marginTop:-6}}>{source.colNameEditable
              ? "This schema is a fixed platform contract. Column types, keys, and selection can't be changed — only the column name can be renamed."
              : filterable
              ? "This data table is managed by a connector. Column names, types, and key options are fixed — you can still adjust filters (changing one re-ingests the data) and add filters to control which records are imported."
              : "Columns are fixed once the data table is created. Column names, types, and selection can't be changed here."}</p>
            <ColumnsTab cols={cols} setCols={setCols} enableFilter={filterable} rows={rows} noRenameRemove={true} allowAdd={false} lockedKeys={ALL_OPTION_KEYS} lockColType={true} forceNameEditable={!!source.colNameEditable} />
          </div>
        ) : tab==="connections" ? (
          <div>
            <div className="conns-toolbar">{onConnectData && <ConnectDataButton connectors={connectors} onPick={onConnectData} label="Add connection" />}</div>
            {(() => {
              // A data can be fed by more than one connection at once (e.g. a Samsara connection that
              // created it, plus an AWS S3 connection later mapped onto it) — each connector instance
              // tracks its own dataSourceIds independently, so show every instance that lists this one.
              const insts = connectors.filter(c => (c.dataSourceIds || []).includes(source.id));
              if (insts.length === 0){
                return <div className="vds-alert vds-alert--info proto-note proto-plain-note">No connection currently populates this data table. Use "Add connection" above to add one.</div>;
              }
              return (
                <div className="vds-table-container">
                  <div className="conns-head">
                    <div className="dscreate-h">Name</div>
                    <div className="dscreate-h">Connector</div>
                    <div className="dscreate-h">Creation date</div>
                    <div className="dscreate-h">Last updated</div>
                    <div className="dscreate-h">Schedule</div>
                  </div>
                  {insts.map(inst => {
                    const typeInfo = CONNECTORS.find(c => c.id === inst.connectorId);
                    const sched = automations.find(a => a.connectorId === inst.id);
                    return (
                      <div className="conns-row" key={inst.id}>
                        <span className="conns-name"><Icon name={(typeInfo && typeInfo.icon) || "link"} size={16} />{inst.name}</span>
                        <span className="dscreate-num">{(typeInfo && typeInfo.name) || inst.connectorId}</span>
                        <span className="dscreate-num">{inst.createdAt}</span>
                        <span className="dscreate-num">{inst.updatedAt}</span>
                        <span className="dscreate-num">{sched ? sched.scheduleText : "—"}</span>
                      </div>
                    );
                  })}
                </div>
              );
            })()}
          </div>
        ) : (
          <TableRelationsTab source={source} allSources={allSources} onUpdate={onUpdate} />
        )}
      </div>

      {viewerAttachment ? (
        <AttachmentViewerModal row={viewerAttachment}
          onBack={viewerRow ? ()=>setViewerAttachment(null) : null}
          onClose={()=>{ setViewerAttachment(null); setViewerRow(null); }} />
      ) : viewerRow ? (
        <EmailViewerModal row={viewerRow} attachments={attachmentsForMessage(viewerRow.message_id)}
          onOpenAttachment={setViewerAttachment} onClose={()=>setViewerRow(null)} />
      ) : null}
    </div>
  );
}

/* ---------------- Update data ---------------- */
function UpdateDataSource({ source, onCancel, onUpdate, onDone }){
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  const [confirmDelete, setConfirmDelete] = useState(false);
  const inputRef = useRef(null);
  const modeRef = useRef(null);
  const origCols = source.parsed ? source.parsed.columns : [];

  const sameColumns = (a) => a.length === origCols.length && [...a].sort().join("\u0001") === [...origCols].sort().join("\u0001");
  const finishRows = (rows) => {
    onUpdate(source.id, {
      parsed: { ...source.parsed, rows },
      recordCount: rows.length,
      records: Number(rows.length).toLocaleString(),
      lastSynced: "Just now",
    });
    setBusy(false);
    onDone();
  };
  const isMedia = !!source.media;
  const pick = (mode) => { setError(""); setConfirmDelete(false); modeRef.current = mode; if (inputRef.current) inputRef.current.click(); };
  const mediaColConfig = (parsed) => parsed.columns.map(c => ({
    name:c, display:c, type:parsed.typeByCol[c] || "string",
    imp:true, pk:false, req:false, orderBy:false, lowCard:false, part:false, dedup:false,
  }));
  const finishMedia = (items, replace) => {
    const np = deriveMediaParsed(items);
    let columns;
    if (replace){
      columns = mediaColConfig(np);
    } else {
      const existingCfg = source.columns || [];
      const have = new Set(existingCfg.map(c => c.name));
      const added = np.columns.filter(c => !have.has(c)).map(c => ({
        name:c, display:c, type:np.typeByCol[c] || "string",
        imp:true, pk:false, req:false, orderBy:false, lowCard:false, part:false, dedup:false,
      }));
      columns = [...existingCfg, ...added];
    }
    onUpdate(source.id, {
      parsed: np, columns,
      recordCount: np.rows.length,
      records: Number(np.rows.length).toLocaleString(),
      lastSynced: "Just now",
    });
    onDone();
  };
  const existingItems = () => {
    if (source.parsed && Array.isArray(source.parsed.mediaItems)) return source.parsed.mediaItems;
    return (source.parsed && source.parsed.rows ? source.parsed.rows : []).map(r => ({ id: Number(r.ID) || 0, name: r.MediaFileName, url: r.URL, segs: [] }));
  };
  const handleMedia = (fileList) => {
    const media = Array.from(fileList || [])
      .map(f => ({ name:f.name, relPath: f.webkitRelativePath || f.name }))
      .filter(d => isMediaName(d.name))
      .map(d => ({ name:d.name, url:s3Url(d.relPath || d.name), segs: segsFromPath(d.relPath) }));
    if (!media.length) return;
    if (modeRef.current === "replace") finishMedia(assignIds(media, 1), true);
    else {
      const existing = existingItems();
      finishMedia([ ...existing, ...assignIds(media, nextMediaId(existing)) ], false);
    }
  };
  const deleteAll = () => {
    if (isMedia){
      onUpdate(source.id, { parsed: { ...source.parsed, rows:[], mediaItems:[] }, recordCount:0, records:"0", lastSynced:"Just now" });
      onDone();
    } else finishRows([]);
  };
  const handleFile = async (file) => {
    if (!file) return;
    setBusy(true); setError("");
    try {
      const p = await parseFile(file);
      if (!sameColumns(p.columns)){
        setBusy(false);
        setError("Column names must match the original file. Expected: " + origCols.join(", ") + ".");
        return;
      }
      const norm = p.rows.map(r => { const o={}; origCols.forEach(c => o[c] = (r[c]===undefined ? null : r[c])); return o; });
      if (modeRef.current === "replace") finishRows(norm);
      else finishRows([ ...(source.parsed.rows || []), ...norm ]);
    } catch(e){ setBusy(false); setError(e && e.message ? e.message : String(e)); }
    finally { if (inputRef.current) inputRef.current.value = ""; }
  };
  const handleInput = (fileList) => { if (isMedia) handleMedia(fileList); else handleFile(fileList[0]); };

  const CARDS = isMedia ? [
    { id:"replace", icon:"swap", title:"Replace Media", desc:"Upload a new folder of media to replace all files. IDs restart from 1." },
    { id:"append", icon:"plus", title:"Add Media", desc:"Upload another folder of media. New rows continue the ID sequence and folder columns merge in." },
    { id:"delete", icon:"trash", title:"Delete all Rows", desc:"Remove every row of data from this data table. The columns and configuration are kept." },
  ] : [
    { id:"replace", icon:"swap", title:"Replace File", desc:"Upload a new file to replace the data table. Column names must match the original file." },
    { id:"append", icon:"plus", title:"Append to File", desc:"Add more rows from another file. Column names must match exactly." },
    { id:"delete", icon:"trash", title:"Delete all Rows", desc:"Remove every row of data from this data table. The columns and configuration are kept." },
  ];
  const onCard = (id) => { if (id === "delete") setConfirmDelete(true); else pick(id); };

  return (
    <div className="vds-content">
      <PageHead title="Update data table" sub={source.name} onCancel={onCancel} />
      <div className="origin-grid">
        {CARDS.map(c => (
          <button key={c.id} className="vds-card proto-origin-card" onClick={()=>onCard(c.id)} disabled={busy}>
            <span className="origin-icon"><Icon name={c.icon} size={26} /></span>
            <span className="origin-title">{c.title}</span>
            <span className="origin-desc">{c.desc}</span>
          </button>
        ))}
      </div>

      {isMedia
        ? <input ref={inputRef} type="file" multiple webkitdirectory="" directory="" style={{display:"none"}} onChange={(e)=>{ handleInput(e.target.files); e.target.value=""; }} />
        : <input ref={inputRef} type="file" accept=".csv,.tsv,.xlsx,.xls,.xlsm,.json,.parquet" style={{display:"none"}} onChange={(e)=>{ handleInput(e.target.files); e.target.value=""; }} />
      }
      {busy && <div className="parsing">Reading file…</div>}
      {error && <div className="vds-alert vds-alert--error proto-note">{error}</div>}

      {confirmDelete && (
        <div className="vds-card proto-rel-form">
          <div className="menu-confirm" style={{padding:0, marginBottom:6}}>Delete all rows?</div>
          <p className="vds-b2 proto-muted proto-section-note" style={{margin:"0 0 18px"}}>Remove every row of data from <b>{source.name}</b>. The columns and configuration are kept.</p>
          <div style={{display:"flex", gap:12}}>
            <button className="vds-btn" onClick={()=>setConfirmDelete(false)}>Cancel</button>
            <button className="vds-btn proto-btn--danger" onClick={deleteAll}><Icon name="trash" size={16} />Delete all rows</button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------------- New connector ---------------- */
function ConfigureStep({ conn, tmpl, name, setName, creds, setCreds, verified, setVerified, picks, setPicks, startDates, setStartDates, configs={}, onConfigure, editing, existingNames=[], onOpenExisting, onCancel, onBack, onContinue }){
